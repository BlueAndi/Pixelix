name: Release Pipeline

# Controls when the action will run.
on:
  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Enter the name of the tag which to release."
        required: true

# Releasing the same tag twice in parallel would race for the release assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  # Pinned to keep the toolchain reproducible and the cache key meaningful.
  PIO_VERSION: "6.2.0"
  # Bump this to invalidate every PlatformIO cache of this repository.
  PIO_CACHE_EPOCH: "v1"
  # SDL3 version built from source for the Linux native release.
  SDL3_VERSION: "release-3.4.18"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel.
jobs:
  # Build all targets
  build:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          [
            "adafruit_feather_esp32_v2-LED-32x8",
            "adafruit_matrixportal_s3-HUB75-64x64",
            "adafruit_matrixportal_s3-HUB75-64x64-makapix",
            "az-delivery-devkit-v4-LED-32x8",
            "esp32doit-devkit-v1-LED-32x8",
            "esp32doit-devkit-v1-HUB75-64x64",
            "esp32-s3-devkitc-1-n16r8v-LED-32x8",
            "esp32-s3-devkitc-1-n16r8v-LED-32x16",
            "esp32-nodemcu-LED-32x8",
            "lilygo-ttgo-t-display-TFT-32x8",
            "lilygo-t-display-s3-TFT-32x8",
            "lilygo-t-display-s3-TFT-64x16",
            "lilygo-t-display-s3-TFT-64x16-makapix",
            "m5stack_core-TFT-32x8",
            "ulanzi-tc001-LED-32x8",
            "wemos_lolin_s2_mini-LED-32x8",
          ]

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Only the toolchain is cached. The build folder is deliberately not
      # restored here, so that every release artifact comes from a clean build.
      - name: Cache PlatformIO core and packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ env.PIO_CACHE_EPOCH }}-${{ env.PIO_VERSION }}-${{ hashFiles('platformio.ini', 'config/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ env.PIO_CACHE_EPOCH }}-${{ env.PIO_VERSION }}-

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio==${{ env.PIO_VERSION }}

      - name: Create release artifcats folder
        run: |
          mkdir ${{ github.workspace }}/artifacts

      # The build scripts create src/Generated/*.cpp, which PlatformIO hashes. Without
      # this run, the second platformio call wipes the build folder (incl. bootloader.bin).
      - name: Generate sources for ${{ matrix.environment }}
        run: platformio run --environment ${{ matrix.environment }} --target buildfs

      - name: Compile ${{ matrix.environment }} firmware
        run: platformio run --environment ${{ matrix.environment }} 2>&1 | tee firmware-build.log

      - name: Build ${{ matrix.environment }} filesystem image
        run: platformio run --environment ${{ matrix.environment }} --target buildfs

      - name: Package ${{ matrix.environment }} USB flash images
        run: |
          python scripts/package_flash_images.py \
            --environment "${{ matrix.environment }}" \
            --build-dir ".pio/build/${{ matrix.environment }}" \
            --output-dir "flash-package/${{ matrix.environment }}"

      - name: Upload ${{ matrix.environment }} USB flash package
        uses: actions/upload-artifact@v6
        with:
          name: usb-flash-${{ matrix.environment }}
          path: flash-package/${{ matrix.environment }}/*
          retention-days: 5

      - name: Collect size metrics for ${{ matrix.environment }}
        run: |
          python scripts/ci_size_report.py collect \
            --environment "${{ matrix.environment }}" \
            --build-log firmware-build.log \
            --build-dir ".pio/build/${{ matrix.environment }}" \
            --output-dir size-metrics

      - name: Save size metrics for ${{ matrix.environment }}
        uses: actions/upload-artifact@v6
        with:
          name: size-metrics-${{ matrix.environment }}
          path: size-metrics/${{ matrix.environment }}.json

  # Build distributable native applications on their target operating systems.
  build_native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag_name }}

      - name: Checkout release packaging tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: release-tooling

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Windows native toolchain
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3

      - name: Add Windows native toolchain to PATH
        if: runner.os == 'Windows'
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: 'Join-Path $env:MSYS2_LOCATION "ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Install Linux SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git make pkg-config cmake ninja-build \
            gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev \
            libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxrender-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev wayland-protocols libdecor-0-dev \
            liburing-dev

      - name: Build Linux SDL3
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch "$SDL3_VERSION" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/SDL/build" --parallel
          sudo cmake --install "$RUNNER_TEMP/SDL/build"
          sudo ldconfig
          pkg-config --modversion sdl3
          mkdir "$RUNNER_TEMP/sdl-licenses"
          cp "$RUNNER_TEMP/SDL/LICENSE.txt" "$RUNNER_TEMP/sdl-licenses/"

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==${{ env.PIO_VERSION }}

      - name: Compile native application and generate data
        run: platformio run --environment native

      - name: Package Linux native application
        if: runner.os == 'Linux'
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          python release-tooling/scripts/package_native_release.py --kind linux \
            --executable .pio/build/native/program --data data \
            --runtime "$(pkg-config --variable=libdir sdl3)/libSDL3.so.0" \
            --licenses "$RUNNER_TEMP/sdl-licenses" \
            --project . \
            --output "$RUNNER_TEMP/${GITHUB_REPOSITORY#*/}-${TAG_NAME}-native-linux-x86_64.tar.gz"
          python release-tooling/scripts/verify_native_release.py --kind linux --data data \
            --archive "$RUNNER_TEMP/${GITHUB_REPOSITORY#*/}-${TAG_NAME}-native-linux-x86_64.tar.gz"

      - name: Package Windows native application
        if: runner.os == 'Windows'
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "$env:REPOSITORY_NAME-$env:TAG_NAME-native-windows-x86_64.zip"
          $runtime = Join-Path $env:MSYS2_LOCATION "ucrt64\bin"
          python release-tooling/scripts/package_native_release.py --kind windows `
            --executable .pio/build/native/program.exe --data data `
            --runtime $runtime --msys2 $env:MSYS2_LOCATION `
            --project . `
            --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python release-tooling/scripts/verify_native_release.py --kind windows --data data --archive $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native release archive
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/${{ github.event.repository.name }}-${{ github.event.inputs.tag_name }}-native-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 5

  # Show firmware and filesystem size changes against the prior release run.
  size_report:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download current size metrics
        uses: actions/download-artifact@v7
        with:
          pattern: size-metrics-*
          path: current-metrics
          merge-multiple: true

      - name: Find previous release run
        id: baselines
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          python scripts/ci_size_report.py find-runs \
            --workflow-file release.yml \
            --event "$EVENT_NAME" \
            --ref-name "$REF_NAME" \
            --head-branch "$HEAD_BRANCH" \
            --base-branch "$BASE_BRANCH" \
            --current-sha "$GITHUB_SHA" \
            --output "$GITHUB_OUTPUT"

      - name: Download previous release metrics
        if: steps.baselines.outputs.branch_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: size-metrics-*
          path: branch-baseline
          merge-multiple: true
          run-id: ${{ steps.baselines.outputs.branch_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Write size trend to workflow summary
        env:
          BRANCH_LABEL: previous successful release run
          TARGET_LABEL: not applicable
        run: |
          python scripts/ci_size_report.py report \
            --current-dir current-metrics \
            --branch-dir branch-baseline \
            --branch-label "$BRANCH_LABEL" \
            --target-label "$TARGET_LABEL"

  # Deploy release artifacts
  deploy:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    needs: [build, build_native]
    permissions:
      contents: write
    steps:
      - name: Checkout release packaging tools
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download USB flash packages
        uses: actions/download-artifact@v7
        with:
          pattern: usb-flash-*
          path: ${{ github.workspace }}/artifacts

      - name: Download native archives
        uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: ${{ github.workspace }}/native-artifacts

      - name: Archive USB flash packages
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          zip -qr "${GITHUB_WORKSPACE}/${{ github.event.repository.name }}-${TAG_NAME}-usb-flash-packages.zip" usb-flash-*
        working-directory: ${{ github.workspace }}/artifacts

      - name: Check native archives
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          test -f "native-artifacts/native-linux-x86_64/${GITHUB_REPOSITORY#*/}-${TAG_NAME}-native-linux-x86_64.tar.gz"
          test -f "native-artifacts/native-windows-x86_64/${GITHUB_REPOSITORY#*/}-${TAG_NAME}-native-windows-x86_64.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/${{ github.event.repository.name }}-${{ github.event.inputs.tag_name }}-usb-flash-packages.zip
            ${{ github.workspace }}/native-artifacts/native-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the USB installer and the Home Assistant blueprints on GitHub Pages.
  publish_installer:
    needs: [deploy]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      source_ref: ${{ github.event.inputs.tag_name }}
