name: Release Pipeline

# Controls when the action will run.
on:
  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Enter the name of the tag which to release."
        required: true

# Releasing the same tag twice in parallel would race for the release assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

env:
  # Pinned to keep the toolchain reproducible and the cache key meaningful.
  PIO_VERSION: "6.2.0"
  # Bump this to invalidate every PlatformIO cache of this repository.
  PIO_CACHE_EPOCH: "v1"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel.
jobs:
  # Build all targets
  build:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          [
            "adafruit_feather_esp32_v2-LED-32x8",
            "adafruit_matrixportal_s3-HUB75-64x64",
            "adafruit_matrixportal_s3-HUB75-64x64-makapix",
            "az-delivery-devkit-v4-LED-32x8",
            "esp32doit-devkit-v1-LED-32x8",
            "esp32doit-devkit-v1-HUB75-64x64",
            "esp32-s3-devkitc-1-n16r8v-LED-32x8",
            "esp32-s3-devkitc-1-n16r8v-LED-32x16",
            "esp32-nodemcu-LED-32x8",
            "lilygo-ttgo-t-display-TFT-32x8",
            "lilygo-t-display-s3-TFT-32x8",
            "lilygo-t-display-s3-TFT-64x16",
            "lilygo-t-display-s3-TFT-64x16-makapix",
            "m5stack_core-TFT-32x8",
            "ulanzi-tc001-LED-32x8",
            "wemos_lolin_s2_mini-LED-32x8",
          ]

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Only the toolchain is cached. The build folder is deliberately not
      # restored here, so that every release artifact comes from a clean build.
      - name: Cache PlatformIO core and packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ env.PIO_CACHE_EPOCH }}-${{ env.PIO_VERSION }}-${{ hashFiles('platformio.ini', 'config/*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ env.PIO_CACHE_EPOCH }}-${{ env.PIO_VERSION }}-

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio==${{ env.PIO_VERSION }}

      - name: Create release artifcats folder
        run: |
          mkdir ${{ github.workspace }}/artifacts

      - name: Compile ${{ matrix.environment }} firmware
        run: platformio run --environment ${{ matrix.environment }} 2>&1 | tee firmware-build.log

      - name: Determine factory binary name
        id: factory
        # Extract board name from environment (remove display suffix like -LED-32x8)
        run: |
          BOARD_NAME=$(echo "${{ matrix.environment }}" | sed 's/-LED-.*//; s/-HUB75-.*//; s/-TFT-.*//')
          FACTORY_BIN="factory_binaries/${BOARD_NAME}-factory.bin"
          if [ -f "$FACTORY_BIN" ]; then
            echo "factory_bin=$FACTORY_BIN" >> $GITHUB_OUTPUT
            echo "Found factory binary: $FACTORY_BIN"
          else
            echo "factory_bin=" >> $GITHUB_OUTPUT
            echo "No factory binary found for: $BOARD_NAME"
          fi

      - name: Deploy ${{ matrix.environment }} firmware
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.environment }}_firmware
          path: |
            ${{ github.workspace }}/.pio/build/${{ matrix.environment }}/firmware.bin
            ${{ github.workspace }}/.pio/build/${{ matrix.environment }}/bootloader.bin
            ${{ github.workspace }}/.pio/build/${{ matrix.environment }}/partitions.bin
            ${{ github.workspace }}/${{ steps.factory.outputs.factory_bin }}
          retention-days: 5

      - name: Build ${{ matrix.environment }} filesystem image
        run: platformio run --environment ${{ matrix.environment }} --target buildfs

      - name: Package ${{ matrix.environment }} USB flash images
        run: |
          python scripts/package_flash_images.py \
            --environment "${{ matrix.environment }}" \
            --build-dir ".pio/build/${{ matrix.environment }}" \
            --output-dir "flash-package/${{ matrix.environment }}"

      - name: Upload ${{ matrix.environment }} USB flash package
        uses: actions/upload-artifact@v6
        with:
          name: usb-flash-${{ matrix.environment }}
          path: flash-package/${{ matrix.environment }}/*
          retention-days: 5

      - name: Collect size metrics for ${{ matrix.environment }}
        run: |
          python scripts/ci_size_report.py collect \
            --environment "${{ matrix.environment }}" \
            --build-log firmware-build.log \
            --build-dir ".pio/build/${{ matrix.environment }}" \
            --output-dir size-metrics

      - name: Save size metrics for ${{ matrix.environment }}
        uses: actions/upload-artifact@v6
        with:
          name: size-metrics-${{ matrix.environment }}
          path: size-metrics/${{ matrix.environment }}.json

      - name: Deploy ${{ matrix.environment }} filesystem image
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.environment }}_filesystem
          path: |
            ${{ github.workspace }}/.pio/build/${{ matrix.environment }}/spiffs.bin
            ${{ github.workspace }}/.pio/build/${{ matrix.environment }}/littlefs.bin
          retention-days: 5

  # Show firmware and filesystem size changes against the prior release run.
  size_report:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download current size metrics
        uses: actions/download-artifact@v7
        with:
          pattern: size-metrics-*
          path: current-metrics
          merge-multiple: true

      - name: Find previous release run
        id: baselines
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          python scripts/ci_size_report.py find-runs \
            --workflow-file release.yml \
            --event "$EVENT_NAME" \
            --ref-name "$REF_NAME" \
            --head-branch "$HEAD_BRANCH" \
            --base-branch "$BASE_BRANCH" \
            --current-sha "$GITHUB_SHA" \
            --output "$GITHUB_OUTPUT"

      - name: Download previous release metrics
        if: steps.baselines.outputs.branch_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: size-metrics-*
          path: branch-baseline
          merge-multiple: true
          run-id: ${{ steps.baselines.outputs.branch_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Write size trend to workflow summary
        env:
          BRANCH_LABEL: previous successful release run
          TARGET_LABEL: not applicable
        run: |
          python scripts/ci_size_report.py report \
            --current-dir current-metrics \
            --branch-dir branch-baseline \
            --branch-label "$BRANCH_LABEL" \
            --target-label "$TARGET_LABEL"

  # Deploy release artifacts
  deploy:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: ${{ github.workspace }}/artifacts

      - name: Archive USB flash packages
        run: |
          zip -qr "${GITHUB_WORKSPACE}/${{ github.event.repository.name }}-${{ github.event.inputs.tag_name }}-usb-flash-packages.zip" usb-flash-*
        working-directory: ${{ github.workspace }}/artifacts

      - name: Exclude CI size metrics from release archive
        run: find . -type d -name 'size-metrics-*' -prune -exec rm -rf {} +
        working-directory: ${{ github.workspace }}/artifacts

      - name: Exclude Pages flash packages from release archive
        run: find . -type d -name 'usb-flash-*' -prune -exec rm -rf {} +
        working-directory: ${{ github.workspace }}/artifacts

      - name: Display structure of release artifacts
        run: ls -R
        working-directory: ${{ github.workspace }}/artifacts

      - name: Zip release artifacts folder
        run: zip -r ${{ github.event.repository.name }}-${{ github.event.inputs.tag_name }}.zip .
        working-directory: ${{ github.workspace }}/artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: |
            ${{ github.workspace }}/artifacts/${{ github.event.repository.name }}-${{ github.event.inputs.tag_name }}.zip
            ${{ github.workspace }}/${{ github.event.repository.name }}-${{ github.event.inputs.tag_name }}-usb-flash-packages.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
