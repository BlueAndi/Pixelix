name: Main CI/CD Pipeline

# Controls when the action will run.
# This workflow is triggered only on pull requests to the master or main branch.
on:
  pull_request:
    branches: [ master, main ]
  release:
    # A release, pre-release, or draft of a release is published.
    types: [ published ]
  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel.
jobs:
  # The introduction just shows some useful informations.
  intro:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:
    - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
    - run: echo "The name of the branch is ${{ github.ref }} and the repository is ${{ github.repository }}."

  # Build all targets
  build:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    needs: intro
    strategy:
      matrix:
        environment: ["adafruit_feather_esp32_v2-LED-32x8",
                      "adafruit_matrixportal_s3-HUB75-64x64",
                      "adafruit_matrixportal_s3-HUB75-64x64-makapix",
                      "az-delivery-devkit-v4-LED-32x8",
                      "esp32doit-devkit-v1-LED-32x8",
                      "esp32doit-devkit-v1-HUB75-64x64",
                      "esp32-s3-devkitc-1-n16r8v-LED-32x8",
                      "esp32-s3-devkitc-1-n16r8v-LED-32x16",
                      "esp32-nodemcu-LED-32x8",
                      "lilygo-ttgo-t-display-TFT-32x8",
                      "lilygo-t-display-s3-TFT-32x8",
                      "lilygo-t-display-s3-TFT-64x16",
                      "m5stack_core-TFT-32x8",
                      "ulanzi-tc001-LED-32x8",
                      "wemos_lolin_s2_mini-LED-32x8"]

    # Steps represent a sequence of tasks that will be executed as part of the job.
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Cache pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v5
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
    
    - name: Create release artifcats folder
      if: startsWith(github.ref_type, 'refs/tags/v')
      run: |
        mkdir ${{ github.workspace }}/artifacts

    - name: Compile ${{ matrix.environment }} firmware
      run: platformio run --environment ${{ matrix.environment }}
    
    - name: Build ${{ matrix.environment }} filesystem image
      run: platformio run --environment ${{ matrix.environment }} --target buildfs

    - name: Deploy ${{ matrix.environment }}
      if: startsWith(github.ref_type, 'refs/tags/v')
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.environment }}
        path: |
          ${{ github.workspace }}/.pio/build/${{ matrix.environment }}/firmware.bin
          ${{ github.workspace }}/.pio/build/${{ matrix.environment }}/spiffs.bin
          ${{ github.workspace }}/.pio/build/${{ matrix.environment }}/littlefs.bin
        retention-days: 5

  # Perform static checks
  check:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    needs: intro
    strategy:
      matrix:
        environment: ["adafruit_feather_esp32_v2-LED-32x8",
                      "adafruit_matrixportal_s3-HUB75-64x64",
                      "adafruit_matrixportal_s3-HUB75-64x64-makapix",
                      "az-delivery-devkit-v4-LED-32x8",
                      "esp32doit-devkit-v1-LED-32x8",
                      "esp32doit-devkit-v1-HUB75-64x64",
                      "esp32-s3-devkitc-1-n16r8v-LED-32x8",
                      "esp32-s3-devkitc-1-n16r8v-LED-32x16",
                      "esp32-nodemcu-LED-32x8",
                      "lilygo-ttgo-t-display-TFT-32x8",
                      "lilygo-t-display-s3-TFT-32x8",
                      "lilygo-t-display-s3-TFT-64x16",
                      "m5stack_core-TFT-32x8",
                      "ulanzi-tc001-LED-32x8",
                      "wemos_lolin_s2_mini-LED-32x8"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Cache pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v5
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Perform static checks on ${{ matrix.environment }}
      run: platformio check --environment ${{ matrix.environment }} --fail-on-defect=medium --fail-on-defect=high

  # Perform tests
  test:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    needs: intro

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Cache pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v5
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Run tests on native environment
      run: platformio test --environment test

  # Validate the OpenAPI specification of the REST API.
  openapi_lint:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    needs: intro

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install openapi-spec-validator
      run: |
        python -m pip install --upgrade pip
        pip install openapi-spec-validator==0.9.0

    - name: Validate the OpenAPI specification
      run: openapi-spec-validator ./doc/OpenAPI/OpenAPI.yaml

  # Build the application for the host, check that its webserver answers and
  # verify the REST API against the OpenAPI specification.
  # This is the only place where the POSIX part of the native environment is
  # built.
  build_native:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    needs: intro

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Cache pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v5
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Compile native application
      run: platformio run --environment native

    - name: Start the native application
      run: |
        ./.pio/build/native/program > pixelix.log 2>&1 &
        echo $! > pixelix.pid
        # The webserver is started by the init state, which takes a moment.
        for _ in $(seq 1 30); do
          if curl --silent --output /dev/null http://localhost:8080/; then
            break
          fi
          sleep 1
        done

    - name: Check that the webserver answers
      run: |
        STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/)
        # The root page redirects to the index page.
        if [ "${STATUS}" != "302" ]; then
          echo "The webserver answered with ${STATUS} instead of 302."
          exit 1
        fi

    # Schemathesis requires Python 3.10 or higher, PlatformIO is not used
    # anymore from here on.
    - name: Set up Python for the REST API test
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install schemathesis
      run: pip install schemathesis==4.27.0

    # Every REST API endpoint is called with generated data and the response is
    # verified against the OpenAPI specification. Endpoints which would stop the
    # application or modify the filesystem/settings are excluded, because they
    # would break the test run itself.
    #
    # Only valid data is generated (positive mode). Remove the mode option to
    # let schemathesis fuzz the API with invalid data as well.
    - name: Verify the REST API against the OpenAPI specification
      run: |
        schemathesis run ./doc/OpenAPI/OpenAPI.yaml \
          --url http://localhost:8080/rest/api/v1 \
          --auth luke:skywalker \
          --mode positive \
          --checks status_code_conformance,response_schema_conformance \
          --max-examples 20 \
          --exclude-operation-id restart \
          --exclude-operation-id changePartition \
          --exclude-operation-id installPlugin \
          --exclude-operation-id uninstallPlugin \
          --exclude-operation-id uploadFile \
          --exclude-operation-id removeFile \
          --exclude-operation-id writeFile \
          --exclude-operation-id deleteFile \
          --exclude-operation-id setSetting \
          --exclude-operation-id clearCoredump

    - name: Stop the native application
      if: always()
      run: |
        if [ -f pixelix.pid ]; then
          kill "$(cat pixelix.pid)" || true
        fi
        cat pixelix.log || true

  # Build documentation
  doc:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    needs: intro
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Cache pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache PlatformIO
      uses: actions/cache@v5
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
  
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Set up graphviz
      uses: ts-graphviz/setup-graphviz@v2

    - name: Set up doxygen and generate documentation
      uses: mattnotmitt/doxygen-action@v1
      with:
        working-directory: './doc/doxygen'
        doxyfile-path: './Doxyfile'

    - name: Print doxygen warnings
      if: ${{ failure() }}
      run: cat ./doc/doxygen/doxygen_warnings.txt

  # Deploy release artifacts
  deploy:
    if: startsWith(github.ref_type, 'refs/tags/v')
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    needs: [build, check, doc]
    steps:
    - name: Deploy release artifacts
      uses: actions/download-artifact@v7
      with:
        path: ${{ github.workspace }}/artifacts

    - name: Display structure of release artifacts
      run: ls -R
      working-directory: ${{ github.workspace }}/artifacts

    - name: Zip release artifacts folder
      run: zip -rj ${{ github.event.repository.name }}-${{ github.event.release.tag_name }}.zip .
      working-directory: ${{ github.workspace }}/artifacts

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ github.workspace }}/artifacts/${{ github.event.repository.name }}-${{ github.event.release.tag_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
