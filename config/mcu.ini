; ********************************************************************************
; MCU ESP32 configuration
; ********************************************************************************
[mcu:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
build_flags =
    -I ./src/ButtonHandler
    -I ./src/DisplayMgr
    -I ./src/General
    -I ./src/Generated
    -I ./src/Hal
    -I ./src/Performance
    -I ./src/Plugin
    -I ./src/Service
    -I ./src/SystemState
    -I ./src/Topics
    -I ./src/Restart
    -I ./src/Web
    -I ./src/Web/WsCommand
    -D CONFIG_FILESYSTEM_TYPE=FILESYSTEM_LITTLEFS
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=APP_CPU_NUM
    -D CONFIG_ASYNC_TCP_USE_WDT=1
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
    "-D TEMPLATE_PLACEHOLDER='~'"
    -D PIO_ENV="$PIOENV"
    -Wl,-Map,firmware.map
lib_deps_external =
    ESP32Async/AsyncTCP @ ~3.5.0
    ESP32Async/ESPAsyncWebServer @ ~3.12.0
lib_deps_builtin =
    Wire
    FS
    Networking
    NetworkClientSecure
    WiFi
    FadeEffects
    StateMachine
    ESP32 Async UDP
    DNSServer
    ESPmDNS
lib_ignore_external =
lib_ignore_builtin =
    ArduinoNative
