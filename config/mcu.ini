; ********************************************************************************
; MCU ESP32 configuration
; ********************************************************************************
[mcu:esp32]
platform = espressif32 @ ~6.13.0
platform_packages = 
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#release/v2.x
    tool-mklittlefs @ tasmota/tool-mklittlefs@^3.2.0-new
framework = arduino
build_flags =
    -I ./src/ButtonHandler
    -I ./src/DisplayMgr
    -I ./src/General
    -I ./src/Generated
    -I ./src/Hal
    -I ./src/Performance
    -I ./src/Plugin
    -I ./src/Service
    -I ./src/SystemState
    -I ./src/Topics
    -I ./src/Restart
    -I ./src/Web
    -I ./src/Web/WsCommand
    -D SOC_WIFI_SUPPORTED=1 ; AsyncWebserver requires this. Can be removed with Arduino 3.x.x
    -D CONFIG_FILESYSTEM_TYPE=FILESYSTEM_LITTLEFS
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=APP_CPU_NUM
    -D CONFIG_ASYNC_TCP_USE_WDT=1
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
    "-D TEMPLATE_PLACEHOLDER='~'"
    -D PIO_ENV="$PIOENV"
    -Wl,-Map,firmware.map
lib_deps_external =
    ESP32Async/AsyncTCP @ ~3.5.0
    ESP32Async/ESPAsyncWebServer @ ~3.12.0
lib_deps_builtin =
    Wire
    FS
    WiFi
    FadeEffects
    StateMachine
    WiFiClientSecure
    DNSServer
    ESPmDNS
    HalEsp32
lib_ignore_external =
lib_ignore_builtin =
    ArduinoNative

; ********************************************************************************
; Native host configuration
;
; Pixelix runs on the host, therefore every target specific part is replaced by
; a native counterpart.
; ********************************************************************************
[mcu:native]
platform = native @ ~1.2.1
lib_compat_mode = off
; Note, the library dependency finder stays off, like for every target
; environment. That way a missing dependency in a library manifest breaks the
; native build too, instead of being silently resolved here.
build_flags =
    -std=c++17
    -pthread
    # The native AsyncTCP uses winsock on Windows, see SocketCompat.hpp.
    # On Linux the sockets are part of the C library, so nothing to link.
    -I ./src/ButtonHandler
    -I ./src/DisplayMgr
    -I ./src/General
    -I ./src/Generated
    -I ./src/Hal
    -I ./src/Plugin
    -I ./src/Restart
    -I ./src/SystemState
    -I ./src/Topics
    -I ./src/Web
    -I ./src/Web/WsCommand
    -I ./lib/HalLedMatrixNative/src
    ; Windows misses some POSIX functions, which the target and Linux have.
    ; Force included, so no library needs a host specific include.
    -include ./lib/ArduinoNative/src/HostCompat.h
    -D NATIVE
    -D PROGMEM=
    ; The webserver supports a host build, which uses AsyncTCP.
    -D HOST
    -D CONFIG_FILESYSTEM_TYPE=FILESYSTEM_NATIVE
    ; ArduinoJson shall use the Arduino String, not std::string.
    -D ARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -D ARDUINOJSON_ENABLE_PROGMEM=0
    ; There are no tasks on the host, therefore no stack statistics.
    -D CONFIG_MEM_MON_STACK_STATS=0
    -D CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
    ; The mini terminal is served by the terminal of the host, which is
    ; switched to the raw mode for that. Disable it in case the raw mode
    ; disturbs e.g. a debugger or the terminal of an IDE.
    -D CONFIG_NATIVE_SERIAL_INPUT=1
    ; Shown in the webinterface. There is no ESP-IDF on the host.
    '-D CONFIG_IDF_TARGET="native"'
    '-D CONFIG_ARDUINO_IDF_BRANCH="N/A"'
    "-D TEMPLATE_PLACEHOLDER='~'"
    -D PIO_ENV="$PIOENV"
lib_deps_external =
    ESP32Async/ESPAsyncWebServer @ ~3.12.0
lib_deps_builtin =
    ArduinoNative
    AsyncTcpNative
    Common
    HalNative
    HttpClientNative
    Os
    FadeEffects
    StateMachine
lib_ignore_external =
    ESP32-PSRamFS ; There is no PSRAM on the host, see esp32-hal-psram.h.
lib_ignore_builtin =
    AsyncTCP
    HTTPClient
    HalEsp32
    RtcDrv
    Sensors
