; ********************************************************************************
; Image format feature sets
;
; Pixelix always supports BMP and GIF. PNG and WebP are optional, because they
; are expensive: PNGdec's decoder object is around 40 kByte of RAM and libwebp
; costs a few hundred kByte of flash even when built decoder-only. They are
; therefore only enabled on the boards which have PSRAM, see
; doc/specs/2026-10-24-png-webp-support-design.md.
;
; A board section states its choice in one line per key, in the same style as
; ${mcu:esp32.build_flags}:
;
;   build_flags = ... ${imageformats:basic.build_flags}
;   lib_deps    = ... ${imageformats:basic.lib_deps}
;   lib_ignore  = ... ${imageformats:basic.lib_ignore}
;
; The switches are tested as #if (0 != CONFIG_IMAGE_FORMAT_PNG_ENABLE). An
; undefined macro evaluates to 0, so a board which does not want the formats
; does not have to mention them at all.
;
; Gating variant in effect: lib_ignore.
; lib/YAWidgets/library.json declares PNGdec and libwebp as dependencies,
; because lib_ldf_mode = off means a library's include path only reaches
; YAWidgets through that declaration. The lib_ignore list of
; [imageformats:basic] then takes both back out again, and PlatformIO accepts
; that: on a basic board no file under lib/libwebp is compiled at all. The
; --gc-sections fallback described in the design document is NOT needed and
; NOT in use. See doc/plans/2026-10-24-png-webp-support-notes.md for the
; measurement which proves it.
; ********************************************************************************

; ********************************************************************************
; BMP and GIF only - the historical Pixelix feature set.
; ********************************************************************************
[imageformats:basic]
build_flags =
lib_deps =
lib_ignore =
    PNGdec
    libwebp

; ********************************************************************************
; BMP, GIF, PNG and WebP - requires PSRAM.
;
; WEBP_REDUCE_SIZE  drops the rescaler, WEBP_REDUCE_CSP drops the colorspace
; conversions Pixelix does not ask for and WEBP_DISABLE_STATS drops the
; statistics collection. All three only shrink the decoder.
; ********************************************************************************
[imageformats:extended]
build_flags =
    -D CONFIG_IMAGE_FORMAT_PNG_ENABLE=1
    -D CONFIG_IMAGE_FORMAT_WEBP_ENABLE=1
    -D WEBP_REDUCE_SIZE
    -D WEBP_REDUCE_CSP
    -D WEBP_DISABLE_STATS
lib_deps =
    bitbank2/PNGdec @ ~1.1.6
    libwebp
lib_ignore =
