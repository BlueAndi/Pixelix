; Configuration for the native environment, which runs Pixelix on the host.
;
; Everything which needs real hardware (audio, sensors) or a protocol which is
; not available on the host (MQTT, TLS) is disabled. The webinterface incl. the
; display preview and the HTTP service are available. Note, the REST plugins
; can only reach a plain HTTP endpoint, because the host has no TLS stack.
[config:native]
build_flags =
lib_deps =
    # ********** Libraries which requires the HAL (Board) **********
    SensorsNative # Counterpart of the Sensors library, the host has no sensor.
    # ********** Features **********
    # ********** Services (keep the order) **********
    SettingsService @ ~0.1.0 # Mandatory, can not be removed.
    FileMgrService @ ~0.1.0 # Mandatory, can not be removed.
    ;MqttService @ ~0.1.0 # Requires a native PubSubClient.
    TopicHandlerService @ ~0.1.0 # Mandatory, can not be removed.
    RestService @ ~0.1.0 # Requires HttpService
    ;AudioService @ ~0.1.0 # Requires I2S.
    TimerService @ ~0.1.0
    HttpService @ ~0.1.0 # Plain HTTP only, the host has no TLS stack.
    # ********** Topic handlers **********
    RestApiTopicHandler @ ~0.1.0 # Mandatory, can not be removed. Used by webinterface.
    ;MqttApiTopicHandler @ ~0.1.0 # Requires MqttService
    # ********** Plugins **********
    ;BatteryPlugin @ ~0.1.0 # Requires Sensors
    ChicagoBusTrackerPlugin @ ~0.1.0 # Requires RestService
    CountdownPlugin @ ~0.1.0
    DateTimePlugin @ ~0.1.0
    ;DDPPlugin @ ~0.1.0
    FirePlugin @ ~0.1.0
    GameOfLifePlugin @ ~0.1.0
    ;GrabViaMqttPlugin @ ~0.1.0 # Requires MqttService
    GrabViaRestPlugin @ ~0.1.0 # Requires RestService
    GruenbeckPlugin @ ~0.1.0 # Requires RestService
    IconTextLampPlugin @ ~0.1.0
    IconTextPlugin @ ~0.1.0 # Mandatory, can not be removed.
    MatrixPlugin @ ~0.1.0
    MultiIconPlugin @ ~0.1.0
    OpenMeteoPlugin @ ~0.1.0 # Requires RestService
    OpenWeatherPlugin @ ~0.1.0 # Requires RestService
    RainbowPlugin @ ~0.1.0
    ;SensorPlugin @ ~0.1.0 # Requires Sensors
    ;SignalDetectorPlugin @ ~0.1.0 # Requires AudioService
    ;SoundReactivePlugin @ ~0.1.0 # Requires AudioService
    SunrisePlugin @ ~0.1.0 # Requires RestService
    SysMsgPlugin @ ~0.1.0 # Mandatory, can not be removed.
    ;TempHumidPlugin @ ~0.1.0 # Requires Sensors
    VolumioPlugin @ ~0.1.0 # Requires RestService
    WifiStatusPlugin @ ~0.1.0
    WormPlugin @ ~0.1.0
extra_scripts =
    pre:./scripts/configure_native.py