<!doctype html>
<html lang="en" data-bs-theme="dark">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <!-- Styles -->
        <link id="bootstrap-css" rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
        <script>
            (function () {
                const cdnLink = document.getElementById("bootstrap-css");
                let isLoaded = false;

                if (null === cdnLink) {
                    return;
                }

                const useLocalBootstrapCss = function () {
                    cdnLink.setAttribute("href", "/style/bootstrap.min.css");
                };

                cdnLink.addEventListener("load", function () {
                    isLoaded = true;
                });

                cdnLink.addEventListener("error", useLocalBootstrapCss);

                window.setTimeout(function () {
                    if (false === isLoaded) {
                        useLocalBootstrapCss();
                    }
                }, 3000);
            })();
        </script>
        <link rel="stylesheet" type="text/css" href="/style/sticky-footer-navbar.css" />
        <link rel="stylesheet" type="text/css" href="/style/style.css" />

        <title>PIXELIX</title>
        <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    </head>

    <body class="d-flex flex-column h-100">
        <header>
            <!-- Fixed navbar -->
            <nav class="navbar navbar-expand-md fixed-top bg-dark">
                <a class="navbar-brand" href="/index.html">
                    <img src="/images/LogoSmall.png" alt="PIXELIX"
                        data-bs-toggle="tooltip" data-bs-placement="bottom"
                        title="~TARGET~ | ~HOSTNAME~" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto" id="menu">
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Begin page content -->
        <main role="main" class="flex-shrink-0">
            <div class="container">
                <h1 class="mt-5">VolumioPlugin</h1>
                <p><img src="VolumioPlugin.jpg" alt="Screenshot" /></p>
                <p>The plugin shows the current <a href="https://volumio.com/" target="_blank">VOLUMIO</a> state as icon and the played artist/title.</p>
                <p>If the VOLUMIO server is offline, the plugin gets automatically disabled, otherwise enabled.</p>
                <h2>Configuration</h2>
                <h3>Host Address</h3>
                <div class="h-100 p-2 bg-body-tertiary border rounded-3">
                    <form id="myForm">
                        <div class="form-group mb-3">
                            <label class="form-label" for="pluginUid">Plugin UID:</label>
                            <select class="form-select" id="pluginUid" size="1">
                            </select>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label" for="host">Host address of server:</label>
                            <input class="form-control" type="text" id="host" name="host" value="volumio.fritz.box" />
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="scrollIcon" name="scrollIcon" value="0" />
                            <label class="form-label" for="scrollIcon">Scroll the icon together with the text (true) or scroll only the text next to the standing icon (false).</label>
                        </div>
                        <input name="submit" type="submit" value="Update" />
                    </form>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer mt-auto py-3">
            <div class="container">
                <hr />
                <span class="text-secondary">Copyright (c) 2019 - 2026 Andreas Merkle (web@blue-andi.de)</span><br />
                <span class="text-secondary"><a href="https://github.com/BlueAndi/Pixelix/blob/master/LICENSE">MIT License</a></span>
            </div>
        </footer>

        <!-- Bootstrap JS bundle -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" onerror="this.onerror=null;this.src='/js/bootstrap.bundle.min.js';"></script>
        <script>document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function(el){new bootstrap.Tooltip(el);});</script>
        <!-- Pixelix menu -->
        <script type="text/javascript" src="/js/app-menu.js"></script>
        <!-- Pixelix utilities -->
        <script type="text/javascript" src="/js/app-api.js"></script>
        <!-- Pixelix REST API -->

        <script>

            const pluginName = "VolumioPlugin";
            const restClient = new pixelix.rest.Client();

            function enableUI() {
                utils.enableForm("myForm", true);
            }

            function disableUI() {
                utils.enableForm("myForm", false);
            }

            async function getPluginInstances() {
                try {
                    const rsp = await restClient.getPluginInstances();
                    let cnt = 0;

                    for (let slotIndex = 0; slotIndex < rsp.data.slots.length; ++slotIndex) {
                        if (rsp.data.slots[slotIndex].name === pluginName) {

                            let optionText = rsp.data.slots[slotIndex].uid;
                            optionText += " (";

                            if (0 === rsp.data.slots[slotIndex].alias.length) {
                                optionText += "-";
                            } else {
                                optionText += rsp.data.slots[slotIndex].alias;
                            }

                            optionText += ")";

                            const option = document.createElement("option");
                            option.value = "" + rsp.data.slots[slotIndex].uid;
                            option.textContent = optionText;

                            document.getElementById("pluginUid").append(option);

                            ++cnt;
                        }
                    }

                    return cnt;
                } catch (rsp) {
                    alert("Internal error.");
                    return 0;
                }
            }

            async function getConfig(pluginUid) {
                disableUI();
                try {
                    const rsp = await utils.makeRequest({
                        method: "GET",
                        url: restClient.getBaseUri() + "/display/uid/" + pluginUid + "/host",
                        isJsonResponse: true
                    });
                    document.getElementById("host").value = rsp.data.host;
                    document.getElementById("scrollIcon").checked = rsp.data.scrollIcon;
                } catch (rsp) {
                    alert("Internal error.");
                } finally {
                    enableUI();
                }
            }

            async function setConfig(pluginUid) {
                disableUI();
                try {
                    await utils.makeRequest({
                        method: "POST",
                        url: restClient.getBaseUri() + "/display/uid/" + pluginUid + "/host",
                        isJsonResponse: true,
                        parameter: {
                            host: document.getElementById("host").value,
                            scrollIcon: document.getElementById("scrollIcon").checked
                        }
                    });
                    alert("Ok.");
                } catch (rsp) {
                    alert("Failed.");
                } finally {
                    enableUI();
                }
            }

            document.addEventListener("DOMContentLoaded", async () => {
                menu.addSubMenu(menu.data, "Plugins", pluginSubMenu);
                menu.addSubMenu(menu.data, "Services", serviceSubMenu);
                menu.create("menu", menu.data);

                const pluginUidSelect = document.getElementById("pluginUid");

                pluginUidSelect.addEventListener("change", () => {
                    getConfig(pluginUidSelect.value);
                });

                document.getElementById("myForm").addEventListener("submit", (event) => {
                    event.preventDefault();
                    setConfig(document.getElementById("pluginUid").value);
                });

                /* Disable all forms, until the plugin instances are loaded. */
                disableUI();

                /* Load all plugin instances. */
                const cnt = await getPluginInstances();

                if (0 < cnt) {
                    /* Check if UID was passed in URL and auto-select it */
                    const uidFromUrl = utils.getURLParameter('uid');
                    if (uidFromUrl) {
                        for (let i = 0; i < pluginUidSelect.options.length; i++) {
                            if (pluginUidSelect.options[i].value === uidFromUrl) {
                                pluginUidSelect.selectedIndex = i;
                                break;
                            }
                        }
                    }

                    await getConfig(pluginUidSelect.options[pluginUidSelect.selectedIndex].value);
                }
            });
        </script>
    </body>

</html>
