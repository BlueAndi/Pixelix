<!doctype html>
<html lang="en" data-bs-theme="dark">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <!-- Styles -->
        <link rel="stylesheet" type="text/css" href="/style/bootstrap.min.css" />
        <link rel="stylesheet" type="text/css" href="/style/sticky-footer-navbar.css" />
        <link rel="stylesheet" type="text/css" href="/style/style.css" />

        <title>PIXELIX</title>
        <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    </head>

    <body class="d-flex flex-column h-100">
        <header>
            <!-- Fixed navbar -->
            <nav class="navbar navbar-expand-md fixed-top bg-dark">
                <a class="navbar-brand" href="/index.html">
                    <img src="/images/LogoSmall.png" alt="PIXELIX"
                        data-bs-toggle="tooltip" data-bs-placement="bottom"
                        title="~TARGET~ | ~HOSTNAME~" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto" id="menu">
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Begin page content -->
        <main role="main" class="flex-shrink-0">
            <div class="container">
                <h1 class="mt-5">SensorPlugin</h1>
                <p><img src="SensorPlugin.jpg" alt="Screenshot" /></p>
                <p>The plugin shows sensor values of the selected sensor channel.</p>
                <p>Which kind of sensor is available depends on the installed sensor drivers.</p>
                <h2>Configuration</h2>
                <h3>Sensor and Channel</h3>
                <div class="h-100 p-2 bg-body-tertiary border rounded-3">
                    <form id="myForm">
                        <div class="form-group mb-3">
                            <label class="form-label" for="pluginUid">Plugin UID:</label>
                            <select class="form-select" id="pluginUid" size="1">
                            </select>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label" for="sensorList">Sensor:</label>
                            <select class="form-select" id="sensorList">
                            </select>
                        </div>
                        <div class="form-group mb-3">
                            <label class="form-label" for="channelList">Channel:</label>
                            <select class="form-select" id="channelList">
                            </select>
                        </div>
                        <input name="submit" type="submit" value="Update" />
                    </form>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer mt-auto py-3">
            <div class="container">
                <hr />
                <span class="text-secondary">Copyright (c) 2019 - 2026 Andreas Merkle (web@blue-andi.de)</span><br />
                <span class="text-secondary"><a href="https://github.com/BlueAndi/Pixelix/blob/master/LICENSE">MIT License</a></span>
            </div>
        </footer>

        <!-- Bootstrap JS bundle -->
        <script type="text/javascript" src="/js/bootstrap.bundle.min.js"></script>
        <script>document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function(el){new bootstrap.Tooltip(el);});</script>
        <!-- Pixelix menu -->
        <script type="text/javascript" src="/js/app-menu.js"></script>
        <!-- Pixelix utilities -->
        <script type="text/javascript" src="/js/app-api.js"></script>
        <!-- Pixelix REST API -->

        <script>

            const pluginName = "SensorPlugin";
            const restClient = new pixelix.rest.Client();
            let sensors = [];

            function enableUI() {
                utils.enableForm("myForm", true);
            }

            function disableUI() {
                utils.enableForm("myForm", false);
            }

            async function getPluginInstances() {
                try {
                    const rsp = await restClient.getPluginInstances();
                    let cnt = 0;
                    const pluginUidSelect = document.getElementById("pluginUid");

                    for (let slotIndex = 0; slotIndex < rsp.data.slots.length; ++slotIndex) {
                        if (rsp.data.slots[slotIndex].name === pluginName) {

                            let optionText = rsp.data.slots[slotIndex].uid;
                            optionText += " (";

                            if (0 === rsp.data.slots[slotIndex].alias.length) {
                                optionText += "-"
                            } else {
                                optionText += rsp.data.slots[slotIndex].alias
                            }

                            optionText += ")";

                            const option = document.createElement("option");
                            option.value = rsp.data.slots[slotIndex].uid;
                            option.textContent = optionText;

                            pluginUidSelect.appendChild(option);

                            ++cnt;
                        }
                    }

                    return cnt;
                } catch (rsp) {
                    alert("Internal error.");
                    return 0;
                }
            }

            async function getSensors() {
                const rsp = await restClient.getSensors();
                const sensorListSelect = document.getElementById("sensorList");

                sensors = rsp.data.sensors;

                const firstOption = document.createElement("option");
                firstOption.value = -1;
                firstOption.textContent = "-";

                sensorListSelect.appendChild(firstOption);

                for (let index = 0; index < sensors.length; ++index) {

                    if (true === sensors[index].isAvailable) {

                        const option = document.createElement("option");
                        option.value = sensors[index].index;
                        option.textContent = sensors[index].name;

                        sensorListSelect.appendChild(option);
                    }
                }

                sensorListSelect.value = -1;
            }

            async function getSensorAndChannel(pluginUid) {
                disableUI();
                try {
                    const rsp = await utils.makeRequest({
                        method: "GET",
                        url: restClient.getBaseUri() + "/display/uid/" + pluginUid + "/channel",
                        isJsonResponse: true
                    });

                    let sensorIndex = 0;

                    while (rsp.data.sensorIndex !== sensors[sensorIndex].index) {
                        ++sensorIndex;
                    }

                    if (rsp.data.sensorIndex === sensors[sensorIndex].index) {

                        if (false === sensors[sensorIndex].isAvailable) {

                            document.getElementById("sensorList").value = -1;
                            document.getElementById("channelList").replaceChildren();

                        } else {
                            document.getElementById("sensorList").value = rsp.data.sensorIndex;

                            updateChannelList(rsp.data.sensorIndex)

                            document.getElementById("channelList").value = rsp.data.channelIndex;
                        }
                    }

                } catch (rsp) {
                    alert("Internal error.");
                } finally {
                    enableUI();
                }
            }

            async function setConfig(pluginUid) {
                disableUI();

                try {
                    const rsp = await utils.makeRequest({
                        method: "POST",
                        url: restClient.getBaseUri() + "/display/uid/" + pluginUid + "/channel",
                        isJsonResponse: true,
                        parameter: {
                            sensorIndex: document.getElementById("sensorList").value,
                            channelIndex: document.getElementById("channelList").value
                        }
                    });
                    alert("Ok.");
                } catch (rsp) {
                    alert("Failed.");
                } finally {
                    enableUI();
                }
            }

            function updateChannelList(sensorIndex) {
                const channelListSelect = document.getElementById("channelList");

                channelListSelect.replaceChildren();

                if (0 <= sensorIndex) {
                    for (let index = 0; index < sensors[sensorIndex].channels.length; ++index) {

                        const option = document.createElement("option");
                        option.value = sensors[sensorIndex].channels[index].index;
                        option.textContent = sensors[sensorIndex].channels[index].name;

                        channelListSelect.appendChild(option);
                    }
                }
            }

            document.addEventListener("DOMContentLoaded", async () => {
                menu.addSubMenu(menu.data, "Plugins", pluginSubMenu);
                menu.addSubMenu(menu.data, "Services", serviceSubMenu);
                menu.create("menu", menu.data);

                document.getElementById("myForm").addEventListener("submit", (event) => {
                    event.preventDefault();
                    setConfig(document.getElementById("pluginUid").value);
                });

                document.getElementById("pluginUid").addEventListener("change", (event) => {
                    getSensorAndChannel(event.target.value);
                });

                document.getElementById("sensorList").addEventListener("change", (event) => {
                    updateChannelList(event.target.value);
                });

                /* Disable all forms, until the plugin instances are loaded. */
                disableUI();

                try {
                    /* Get all available sensors. */
                    await getSensors();

                    /* Load all plugin instances. */
                    const cnt = await getPluginInstances();

                    const select = document.getElementById("pluginUid");

                    if (0 < cnt) {
                        /* Check if UID was passed in URL and auto-select it */
                        const uidFromUrl = utils.getURLParameter('uid');
                        if (uidFromUrl) {
                            for (let i = 0; i < select.options.length; i++) {
                                if (select.options[i].value === uidFromUrl) {
                                    select.selectedIndex = i;
                                    break;
                                }
                            }
                        }

                        await getSensorAndChannel(
                            select.options[select.selectedIndex].value
                        );
                    }
                } catch (err) {
                    alert("Internal error.");
                }
            });
        </script>
    </body>

</html>
