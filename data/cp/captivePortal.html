<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <!-- Styles -->
        <link id="bootstrap-css" rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
        <script>
            (function () {
                const cdnLink = document.getElementById("bootstrap-css");
                let isLoaded = false;

                if (null === cdnLink) {
                    return;
                }

                const useLocalBootstrapCss = function () {
                    cdnLink.setAttribute("href", "/style/bootstrap.min.css");
                };

                cdnLink.addEventListener("load", function () {
                    isLoaded = true;
                });

                cdnLink.addEventListener("error", useLocalBootstrapCss);

                window.setTimeout(function () {
                    if (false === isLoaded) {
                        useLocalBootstrapCss();
                    }
                }, 3000);
            })();
        </script>
        <link rel="stylesheet" type="text/css" href="/style/app-common.css" />
        <style>
            .bd-placeholder-img {
                font-size: 1.125rem;
                text-anchor: middle;
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }

            @media (min-width: 768px) {
                .bd-placeholder-img-lg {
                    font-size: 3.5rem;
                }
            }
        </style>

        <title>PIXELIX</title>
        <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    </head>
    <body class="d-flex flex-column h-100">
        <header>
            <!-- Fixed navbar -->
            <nav class="navbar navbar-expand-md fixed-top bg-dark">
                <a class="navbar-brand" href="/index.html">
                    <img src="/images/LogoSmall.png" alt="PIXELIX"
                        data-bs-toggle="tooltip" data-bs-placement="bottom"
                        title="~TARGET~ | ~HOSTNAME~" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item active">
                            <a class="nav-link" href="/">Home <span class="sr-only">(current)</span></a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/about.html">About</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Begin page content -->
        <main role="main" class="flex-shrink-0">
            <div class="container">
                <h1 class="mt-5">Captive Portal</h1>
                <h2>Wifi network configuration</h2>
                <p>
                    <div class="form-group mb-3">
                        <label class="form-label" for="ssid">SSID:</label><br />
                        <input class="form-control" type="text" id="ssid" name="ssid" value="~SSID~" /><br />
                        <label class="form-label" for="passphrase">Passphrase:</label><br />
                        <input class="form-control" type="password" id="passphrase" name="passphrase" value="~PASSPHRASE~" /><br />
                        <input type="button" value="Store configuration" id="btnStore" />
                    </div>
                </p>
                <p>WiFi MAC address: ~MAC_ADDR~</p>
                <h2>Restart</h2>
                <p>
                    <input type="button" value="Restart now" id="btnRestart" />
                </p>
            </div>
        </main>
  
        <!-- Footer -->
        <footer class="footer mt-auto py-3">
            <div class="container">
                <hr />
                <span class="text-secondary">Copyright (c) 2019 - 2026 Andreas Merkle (web@blue-andi.de)</span>
                <span class="text-secondary"><a href="https://github.com/BlueAndi/Pixelix/blob/master/LICENSE">MIT License</a></span>
            </div>
        </footer>

        <!-- Bootstrap JS bundle -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" onerror="this.onerror=null;this.src='/js/bootstrap.bundle.min.js';"></script>

        <script>
            async function store() {
                const formData = new FormData();

                formData.append("ssid", document.getElementById("ssid").value);
                formData.append("passphrase", document.getElementById("passphrase").value);

                const response = await fetch("/", { method: "POST", body: formData });

                alert(await response.text());
            }

            async function restart() {
                const formData = new FormData();

                formData.append("restart", "now");

                const response = await fetch("/", { method: "POST", body: formData });

                alert(await response.text());
            }

            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("btnStore").addEventListener("click", store);
                document.getElementById("btnRestart").addEventListener("click", restart);
            });
        </script>
    </body>
</html>
