        <script>
            (function () {
                const cdnLink = document.getElementById("bootstrap-css");
                let isLoaded = false;

                if (null === cdnLink) {
                    return;
                }

                const useLocalBootstrapCss = function () {
                    cdnLink.setAttribute("href", "/style/bootstrap.min.css");
                };

                cdnLink.addEventListener("load", function () {
                    isLoaded = true;
                });

                cdnLink.addEventListener("error", useLocalBootstrapCss);

                window.setTimeout(function () {
                    if (false === isLoaded) {
                        useLocalBootstrapCss();
                    }
                }, 3000);
            })();
        </script>

        <!-- Custom javascript -->
        <script>
            let ctx = null;     // Canvas context
            let timerId = 0;        // Timer id
            const period = 400;      // Display refresh period in ms
            const wsClient = new pixelix.ws.Client();
            const restClient = new pixelix.rest.Client();
            let isPageUnload = false;
            let plugins = [];       // List of all available plugins
            let currentFadeEffect = 0;        // Fade effect [1;3]
            let currentSlotId = -1;       // Currently active slot

            const PIXEL_WIDTH = 10;                           // Width of a single LED in pixels
            const PIXEL_HEIGHT = 10;                           // Height of a single LED in pixels
            const DISPLAY_WIDTH = Number.parseInt("~DISPLAY_WIDTH~");  // Width in pixels (Updated by webserver on send)
            const DISPLAY_HEIGHT = Number.parseInt("~DISPLAY_HEIGHT~"); // Height in pixels (Updated by webserver on send)

            const CANVAS_WIDTH = (DISPLAY_WIDTH) * PIXEL_WIDTH + (DISPLAY_WIDTH) + 1;
            const CANVAS_HEIGHT = (DISPLAY_HEIGHT) * PIXEL_HEIGHT + (DISPLAY_HEIGHT) + 1;

            /* Disable all UI elements. */
            function disableUI() {
                document.querySelectorAll("main button, main input, main select, main textarea").forEach((el) => {
                    el.disabled = true;
                });
            }

            /* Enable all UI elements. */
            function enableUI() {
                const automaticBrightnessControl = document.getElementById("btnAutoBrightnessCtrl").value === "true";

                document.querySelectorAll("main button, main input, main select, main textarea").forEach((el) => {
                    el.disabled = false;
                });

                if (automaticBrightnessControl === true) {
                    document.getElementById("currentBrightness").disabled = true;
                }
            }

            /* If websocket connection is unexpectedly closed, clean up. */
            function wsOnClosed() {
                disableUI();

                window.clearTimeout(timerId);

                if (false === isPageUnload) {
                    dialog.showError("<p>Websocket connection closed.</p>");
                }
            }

            function plot(x, y, color) {
                if (null !== ctx) {
                    ctx.lineWidth = "1";
                    ctx.strokeStyle = color;
                    ctx.fillStyle = color;
                    ctx.fillRect(x * PIXEL_WIDTH + x + 1, y * PIXEL_HEIGHT + y + 1, PIXEL_WIDTH, PIXEL_HEIGHT);
                }
            }

            async function getDisplayContent() {
                try {
                    const rsp = await wsClient.getDisplayContent();
                    let index = 0;              // Index in input sequence.
                    let pixelIndex = 0;           // Index as pixel offset from framebuffer start.

                    currentSlotId = rsp.slotId;
                    document.getElementById("slotId").textContent = rsp.slotId;
                    updateActiveSlot();

                    /* If necessary, resize the canvas (shares the context with plot()). */
                    const canvasCtx = document.getElementById("canvas").getContext("2d");

                    if ((canvasCtx.canvas.width != CANVAS_WIDTH) || (canvasCtx.canvas.height != CANVAS_HEIGHT)) {
                        canvasCtx.canvas.width = CANVAS_WIDTH;
                        canvasCtx.canvas.height = CANVAS_HEIGHT;
                    }

                    /* Handle display data */
                    while (index < rsp.data.length) {
                        const color = rsp.data[index];
                        let repeat = (color & 0xFF000000) >>> 24;
                        const red = (color & 0x00FF0000) >>> 16;
                        const green = (color & 0x0000FF00) >>> 8;
                        const blue = (color & 0x000000FF) >>> 0;
                        const colFmt = "rgb(" + red + ", " + green + ", " + blue + ")";

                        do {
                            const x = pixelIndex % DISPLAY_WIDTH;
                            const y = Math.floor(pixelIndex / DISPLAY_WIDTH);

                            plot(x, y, colFmt);

                            --repeat;
                            ++pixelIndex;
                        } while (repeat >= 0);
                        ++index;
                    }
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                } finally {
                    const isDisplayUpdateOn = document.getElementById("btnUpdateDisplay").value;

                    if ("true" === isDisplayUpdateOn) {
                        /* Start next update timer. */
                        timerId = window.setTimeout(getDisplayContent, period);
                    }
                }
            }

            function updateActiveSlot() {
                document.querySelectorAll(".slot-card").forEach((card) => card.classList.remove("active"));

                if (currentSlotId >= 0) {
                    const activeCard = document.getElementById("slotCard" + currentSlotId);

                    if (activeCard !== null) {
                        activeCard.classList.add("active");
                    }
                }
            }

            async function install() {
                const pluginIndex = Number.parseInt(document.getElementById("pluginToInstall").value);
                const pluginName = plugins[pluginIndex];

                disableUI();

                try {
                    await wsClient.install({ pluginName: pluginName });
                    await updateSlotInfo();
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Install " + pluginName + " failed.</p>");
                } finally {
                    enableUI();
                }
            }

            async function uninstall(slotId) {
                disableUI();

                try {
                    await wsClient.uninstall({ slotId: slotId });
                    await updateSlotInfo();
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Uninstall slot " + slotId + " failed.</p>");
                } finally {
                    enableUI();
                }
            }

            async function nextEffect() {
                try {
                    const rsp = await wsClient.setFadeEffect({ fadeEffect: (currentFadeEffect + 1) });
                    currentFadeEffect = rsp.fadeEffect;
                    updateFadeEffect();
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Failed.</p>");
                }
            }

            function updateFadeEffect() {
                /* Update label accordingly. */
                const label = document.getElementById("lableFadeEffect");

                if (0 === currentFadeEffect) {
                    label.textContent = "None";
                } else if (1 === currentFadeEffect) {
                    label.textContent = "Linear";
                } else if (2 === currentFadeEffect) {
                    label.textContent = "MoveX";
                } else if (3 === currentFadeEffect) {
                    label.textContent = "MoveY";
                } else {
                    label.textContent = "Unknown";
                }
            }

            async function prevSlot() {
                const buttonActionIdPrevSlot = 2; /* See ButtonActionId */

                disableUI();

                try {
                    await wsClient.triggerButton({ "actionId": buttonActionIdPrevSlot });
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Failed.</p>");
                } finally {
                    enableUI();
                }
            }

            async function nextSlot() {
                const buttonActionIdNextSlot = 1; /* See ButtonActionId */

                disableUI();

                try {
                    await wsClient.triggerButton({ "actionId": buttonActionIdNextSlot });
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Failed.</p>");
                } finally {
                    enableUI();
                }
            }

            function updateDisplay() {
                const button = document.getElementById("btnUpdateDisplay");
                const isDisplayUpdateOn = button.value;

                disableUI();

                /* Currently off? */
                if ("false" === isDisplayUpdateOn) {
                    timerId = window.setTimeout(getDisplayContent, period);
                    button.textContent = "Disable auto. display update";
                    button.value = "true";
                } else {
                    window.clearTimeout(timerId);
                    button.textContent = "Enable auto. display update";
                    button.value = "false";
                }

                enableUI();
            }

            async function updatetDisplayState() {
                try {
                    const rsp = await restClient.getDisplayState();
                    const button = document.getElementById("btnDisplayPower");
                    button.value = rsp.data.state;
                    button.textContent = ("off" === rsp.data.state) ? "Power On" : "Power Off";
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Failed.</p>");
                }
            }

            async function triggerDisplayState() {
                const button = document.getElementById("btnDisplayPower");
                let powerState = button.value;

                if ("off" === powerState) {
                    powerState = "on";
                } else {
                    powerState = "off";
                }

                disableUI();

                try {
                    await restClient.setDisplayState(powerState);
                    button.value = powerState;
                    button.textContent = ("off" === powerState) ? "Power On" : "Power Off";
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Failed.</p>");
                } finally {
                    enableUI();
                }
            }

            async function move(uid, slotId) {
                try {
                    await wsClient.move({ uid: uid, slotId: slotId });
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Moving failed.</p>");
                } finally {
                    await updateSlotInfo();
                }
            }

            function allowDrop(ev) {
                ev.preventDefault();
                ev.currentTarget.classList.add("drag-over");
            }

            function drag(ev) {
                ev.currentTarget.classList.add("dragging");
                ev.dataTransfer.setData("src", ev.currentTarget.id);
            }

            function onDragEnd() {
                document.querySelectorAll(".slot-card").forEach((card) => {
                    card.classList.remove("dragging");
                    card.classList.remove("drag-over");
                });
            }

            function onDragLeave(ev) {
                ev.currentTarget.classList.remove("drag-over");
            }

            function drop(ev) {
                ev.preventDefault();
                document.querySelectorAll(".slot-card").forEach((card) => card.classList.remove("drag-over"));

                const srcId = ev.dataTransfer.getData("src");
                const srcElement = document.getElementById(srcId);
                const srcCard = (srcElement !== null) ? srcElement.closest(".slot-card") : null;
                const dstCard = ev.currentTarget.closest(".slot-card");

                if ((!srcCard) || (!dstCard)) {
                    return;
                }

                const srcSlotId = Number.parseInt(srcCard.getAttribute("data-slot-id"));
                const dstSlotId = Number.parseInt(dstCard.getAttribute("data-slot-id"));

                if (srcSlotId !== dstSlotId) {
                    const uid = Number.parseInt(srcId.replace("slotCard", ""));
                    move(uid, dstSlotId);
                }
            }

            async function setDuration(slotId) {
                const duration = Number.parseInt(document.getElementById("duration" + slotId).value) * 1000;

                try {
                    await wsClient.setSlotDuration({ slotId: slotId, duration: duration });
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Set duration failed.</p>");
                } finally {
                    await updateSlotInfo();
                }
            }

            async function setFontType(pluginUid) {
                const fontType = document.getElementById("fontType" + pluginUid).value;

                try {
                    await wsClient.setPluginFontType({ uid: pluginUid, fontType: fontType });
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Set font type failed.</p>");
                } finally {
                    await updateSlotInfo();
                }
            }

            async function setAlias(pluginUid) {
                const alias = document.getElementById("alias" + pluginUid).value;

                try {
                    await wsClient.setPluginAlias({ uid: pluginUid, name: alias });
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Set alias failed.</p>");
                } finally {
                    await updateSlotInfo();
                }
            }

            function createBadge(cssClass, text) {
                const badge = document.createElement("span");
                badge.className = "status-badge " + cssClass;
                badge.textContent = text;
                return badge;
            }

            function createSlotCard(slot, index) {
                const card = document.createElement("div");
                card.className = "slot-card";
                card.id = "slotCard" + slot.uid;
                card.setAttribute("data-slot-id", index);

                if (slot.isLocked && slot.isSticky) {
                    card.classList.add("locked", "sticky");
                } else if (slot.isLocked) {
                    card.classList.add("locked");
                } else if (slot.isSticky) {
                    card.classList.add("sticky");
                }

                if (slot.isDisabled) {
                    card.classList.add("disabled");
                }

                /* Enable drag and drop. */
                if (!slot.isLocked && slot.name.length > 0) {
                    card.draggable = true;
                    card.addEventListener("dragstart", drag);
                    card.addEventListener("dragend", onDragEnd);
                }
                card.addEventListener("dragover", allowDrop);
                card.addEventListener("dragleave", onDragLeave);
                card.addEventListener("drop", drop);

                /* Header */
                const header = document.createElement("div");
                header.className = "slot-header";

                const slotNum = document.createElement("div");
                slotNum.className = "slot-number";
                slotNum.textContent = "Slot " + index;

                const badges = document.createElement("div");
                badges.className = "slot-status-badges";
                badges.appendChild(slot.isDisabled ? createBadge("disabled", "Disabled") : createBadge("active", "Active"));
                if (slot.isSticky) {
                    badges.appendChild(createBadge("sticky", "Sticky"));
                }
                if (slot.isLocked) {
                    badges.appendChild(createBadge("locked", "Locked"));
                }

                header.appendChild(slotNum);
                header.appendChild(badges);
                card.appendChild(header);

                if (slot.name.length === 0) {
                    /* Empty slot */
                    const empty = document.createElement("div");
                    empty.className = "plugin-empty";
                    empty.textContent = "Empty slot - drop a plugin here";
                    card.appendChild(empty);
                } else {
                    /* Plugin info */
                    const pluginInfo = document.createElement("div");
                    pluginInfo.className = "plugin-info";
                    pluginInfo.id = "plugin" + slot.uid;

                    const pluginName = document.createElement("div");
                    pluginName.className = "plugin-name";
                    pluginName.textContent = slot.name;
                    pluginInfo.appendChild(pluginName);

                    const pluginUid = document.createElement("div");
                    pluginUid.className = "plugin-uid";
                    pluginUid.textContent = "UID: " + slot.uid;
                    pluginInfo.appendChild(pluginUid);

                    /* Alias */
                    const aliasGroup = document.createElement("div");
                    aliasGroup.className = "alias-group";

                    const aliasLabel = document.createElement("label");
                    aliasLabel.className = "alias-label";
                    aliasLabel.textContent = "Alias";
                    aliasGroup.appendChild(aliasLabel);

                    const aliasInput = document.createElement("input");
                    aliasInput.className = "alias-input";
                    aliasInput.id = "alias" + slot.uid;
                    aliasInput.type = "text";
                    aliasInput.value = slot.alias || "";
                    aliasInput.placeholder = "Enter alias...";
                    aliasInput.maxLength = 8;
                    aliasInput.addEventListener("change", () => setAlias(slot.uid));
                    aliasGroup.appendChild(aliasInput);
                    pluginInfo.appendChild(aliasGroup);

                    /* Font Type */
                    const fontTypeGroup = document.createElement("div");
                    fontTypeGroup.className = "font-type-control";

                    const fontTypeLabel = document.createElement("label");
                    fontTypeLabel.className = "font-type-label";
                    fontTypeLabel.textContent = "Font Type";
                    fontTypeGroup.appendChild(fontTypeLabel);

                    const fontTypeSelect = document.createElement("select");
                    fontTypeSelect.className = "form-select";
                    fontTypeSelect.id = "fontType" + slot.uid;
                    fontTypeSelect.addEventListener("change", () => setFontType(slot.uid));

                    [["default", "Default"], ["normal", "Normal"], ["large", "Large"]].forEach(([value, text]) => {
                        const option = document.createElement("option");
                        option.value = value;
                        option.textContent = text;
                        fontTypeSelect.appendChild(option);
                    });
                    fontTypeSelect.value = slot.fontType;

                    fontTypeGroup.appendChild(fontTypeSelect);
                    pluginInfo.appendChild(fontTypeGroup);

                    card.appendChild(pluginInfo);
                }

                /* Duration control */
                const durationControl = document.createElement("div");
                durationControl.className = "duration-control";

                const durationGroup = document.createElement("div");
                durationGroup.className = "duration-input-group";

                const durationInput = document.createElement("input");
                durationInput.className = "duration-input";
                durationInput.id = "duration" + index;
                durationInput.type = "number";
                durationInput.value = slot.duration / 1000;
                durationInput.min = "1";
                durationInput.max = "3600";
                durationInput.addEventListener("change", () => setDuration(index));
                durationGroup.appendChild(durationInput);

                const durationUnit = document.createElement("span");
                durationUnit.className = "duration-unit";
                durationUnit.textContent = "sec";
                durationGroup.appendChild(durationUnit);

                durationControl.appendChild(durationGroup);
                card.appendChild(durationControl);

                /* Action buttons */
                const actions = document.createElement("div");
                actions.className = "slot-actions";

                const stickyBtn = document.createElement("button");
                stickyBtn.className = slot.isSticky ? "icon-btn active" : "icon-btn warning";
                stickyBtn.title = "Toggle sticky flag";
                stickyBtn.textContent = slot.isSticky ? "\uD83D\uDCCC Sticky" : "\uD83D\uDCCC Make Sticky";
                stickyBtn.addEventListener("click", () => handleStickySlot(index));

                const statusBtn = document.createElement("button");
                statusBtn.className = slot.isDisabled ? "icon-btn" : "icon-btn active";
                statusBtn.title = "Toggle slot enable/disable";
                statusBtn.textContent = slot.isDisabled ? "\u2713 Enable" : "\u2713 Enabled";
                statusBtn.addEventListener("click", () => handleSlotStatus(index));

                actions.appendChild(statusBtn);
                actions.appendChild(stickyBtn);

                if (slot.name.length > 0) {
                    const configBtn = document.createElement("button");
                    configBtn.className = "icon-btn";
                    configBtn.title = "Configure plugin";
                    configBtn.textContent = "\u2699 Config";
                    configBtn.addEventListener("click", () => {
                        window.location.href = "/plugins/" + slot.name + "/" + slot.name + ".html?uid=" + slot.uid;
                    });
                    actions.appendChild(configBtn);
                }

                if (!slot.isLocked && slot.name.length > 0) {
                    const uninstallBtn = document.createElement("button");
                    uninstallBtn.className = "icon-btn danger";
                    uninstallBtn.title = "Uninstall plugin";
                    uninstallBtn.textContent = "\uD83D\uDDD1 Remove";
                    uninstallBtn.addEventListener("click", () => uninstall(index));
                    actions.appendChild(uninstallBtn);
                }

                card.appendChild(actions);

                return card;
            }

            async function updateSlotInfo() {
                const rsp = await wsClient.getSlots();
                const divSlots = document.getElementById("divSlots");

                divSlots.replaceChildren();

                rsp.slots.forEach((slot, index) => {
                    divSlots.appendChild(createSlotCard(slot, index));
                });

                updateActiveSlot();
            }

            async function handleSlotStatus(slotId) {
                const slot = document.querySelector(".slot-card[data-slot-id='" + slotId + "']");
                const isDisabled = !slot.classList.contains("disabled");

                disableUI();

                try {
                    await wsClient.setSlot({ slotId: slotId, isDisabled: isDisabled });
                    await updateSlotInfo();
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Failed.</p>");
                } finally {
                    enableUI();
                }
            }

            async function handleStickySlot(slotId) {
                const slot = document.querySelector(".slot-card[data-slot-id='" + slotId + "']");
                const sticky = !slot.classList.contains("sticky");

                disableUI();

                try {
                    await wsClient.setSlot({ slotId: slotId, sticky: sticky });
                    await updateSlotInfo();
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Failed.</p>");
                } finally {
                    enableUI();
                }
            }

            function calcPercentage(value) {
                return (value * 100 / 255).toFixed(1);
            }

            function updateCurrentBrightness(brightness) {
                document.getElementById("currentBrightnessValue").textContent = "" + calcPercentage(brightness) + " %";
                document.getElementById("currentBrightness").value = brightness;
            }

            function updateMinBrightness(minBrightness) {
                document.getElementById("minBrightnessValue").textContent = "" + calcPercentage(minBrightness) + " %";
                document.getElementById("minBrightness").value = minBrightness;
            }

            function updateMaxBrightness(maxBrightness) {
                document.getElementById("maxBrightnessValue").textContent = "" + calcPercentage(maxBrightness) + " %";
                document.getElementById("maxBrightness").value = maxBrightness;
            }

            function updateAutoBrightnessCtrl(autoBrightnessCtrl) {
                const status = document.getElementById("autoBrightnessStatus");
                const button = document.getElementById("btnAutoBrightnessCtrl");

                if (false === autoBrightnessCtrl) {
                    status.textContent = "Disabled";
                    button.textContent = "Enable";
                    button.value = "false";
                    document.getElementById("currentBrightness").disabled = false;
                } else {
                    status.textContent = "Enabled";
                    button.textContent = "Disable";
                    button.value = "true";
                    document.getElementById("currentBrightness").disabled = true;
                }
            }

            function triggerAutoBrightnessCtrl() {
                const status = document.getElementById("autoBrightnessStatus");
                const button = document.getElementById("btnAutoBrightnessCtrl");
                const autoBrightnessCtrl = button.value === "true";

                if (false === autoBrightnessCtrl) {
                    status.textContent = "Enabled";
                    button.textContent = "Disable";
                    button.value = "true";
                } else {
                    status.textContent = "Disabled";
                    button.textContent = "Enable";
                    button.value = "false";
                }
            }

            async function changeBrightness() {
                const currentBrightness = Number.parseInt(document.getElementById("currentBrightness").value);
                const minBrightness = Number.parseInt(document.getElementById("minBrightness").value);
                const maxBrightness = Number.parseInt(document.getElementById("maxBrightness").value);
                const autoBrightnessCtrl = document.getElementById("btnAutoBrightnessCtrl").value === "true";

                disableUI();

                try {
                    const rsp = await wsClient.setBrightness({
                        brightness: currentBrightness,
                        minBrightness: minBrightness,
                        maxBrightness: maxBrightness,
                        automaticBrightnessControl: autoBrightnessCtrl
                    });

                    updateCurrentBrightness(rsp.brightness);
                    updateMinBrightness(rsp.minBrightness);
                    updateMaxBrightness(rsp.maxBrightness);
                    updateAutoBrightnessCtrl(rsp.automaticBrightnessControl);
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    await dialog.showError("<p>Changing brightness failed.</p>");
                } finally {
                    enableUI();
                }
            }

            function wireBrightnessSlider(sliderId, valueId) {
                document.getElementById(sliderId).addEventListener("change", changeBrightness);
                document.getElementById(sliderId).addEventListener("input", (event) => {
                    document.getElementById(valueId).textContent = calcPercentage(event.currentTarget.value) + " %";
                });
            }

            /* Execute after page is ready. */
            document.addEventListener("DOMContentLoaded", async () => {
                ctx = document.getElementById("canvas").getContext("2d");

                menu.addSubMenu(menu.data, "Plugins", pluginSubMenu);
                menu.addSubMenu(menu.data, "Services", serviceSubMenu);
                menu.create("menu", menu.data);

                /* Wire up the static controls. */
                document.getElementById("btnNextEffect").addEventListener("click", nextEffect);
                document.getElementById("btnInstall").addEventListener("click", install);
                document.getElementById("btnAutoBrightnessCtrl").addEventListener("click", () => {
                    triggerAutoBrightnessCtrl();
                    changeBrightness();
                });
                document.getElementById("btnDisplayPower").addEventListener("click", triggerDisplayState);
                document.getElementById("btnUpdateDisplay").addEventListener("click", updateDisplay);
                document.getElementById("btnPrevSlot").addEventListener("click", prevSlot);
                document.getElementById("btnNextSlot").addEventListener("click", nextSlot);

                wireBrightnessSlider("currentBrightness", "currentBrightnessValue");
                wireBrightnessSlider("minBrightness", "minBrightnessValue");
                wireBrightnessSlider("maxBrightness", "maxBrightnessValue");

                /* Connect to pixelix */
                try {
                    await wsClient.connect({
                        protocol: "~WS_PROTOCOL~",
                        hostname: location.hostname,
                        port: Number.parseInt("~WS_PORT~"),
                        endpoint: "~WS_ENDPOINT~",
                        onClosed: wsOnClosed
                    });

                    /* Get list of available plugins. */
                    const pluginsRsp = await wsClient.getPlugins();
                    plugins = pluginsRsp.plugins;

                    /* Update plugin dropdown list. */
                    const pluginToInstall = document.getElementById("pluginToInstall");
                    plugins.forEach((pluginName, index) => {
                        const option = document.createElement("option");
                        option.value = index;
                        option.textContent = pluginName;
                        pluginToInstall.appendChild(option);
                    });

                    /* Update the slot informations, shown to user. */
                    await updateSlotInfo();

                    /* Get brightness information. */
                    const brightnessRsp = await wsClient.getBrightness();
                    updateCurrentBrightness(brightnessRsp.brightness);
                    updateMinBrightness(brightnessRsp.minBrightness);
                    updateMaxBrightness(brightnessRsp.maxBrightness);
                    updateAutoBrightnessCtrl(brightnessRsp.automaticBrightnessControl);

                    /* Get fadeEffect information. */
                    const fadeEffectRsp = await wsClient.getFadeEffect();
                    currentFadeEffect = fadeEffectRsp.fadeEffect;
                    updateFadeEffect();

                    /* Update display state. */
                    await updatetDisplayState();

                    /* UI is enabled at least. */
                    enableUI();
                } catch (err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                }
            });

            /* If the page is left, there shall be no message shown regarding
             * unexpected websocket lost.
             */
            window.addEventListener("beforeunload", () => {
                isPageUnload = true;

                if (null !== wsClient) {
                    wsClient.disconnect();
                }
            });
        </script>
    </body>

</html>
