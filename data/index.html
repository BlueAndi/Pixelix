<!doctype html>
<html lang="en" data-bs-theme="dark">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <!-- Styles -->
        <link id="bootstrap-css" rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
        <script>
            (function () {
                const cdnLink = document.getElementById("bootstrap-css");
                let isLoaded = false;

                if (null === cdnLink) {
                    return;
                }

                const useLocalBootstrapCss = function () {
                    cdnLink.setAttribute("href", "/style/bootstrap.min.css");
                };

                cdnLink.addEventListener("load", function () {
                    isLoaded = true;
                });

                cdnLink.addEventListener("error", useLocalBootstrapCss);

                window.setTimeout(function () {
                    if (false === isLoaded) {
                        useLocalBootstrapCss();
                    }
                }, 3000);
            })();
        </script>
        <link rel="stylesheet" type="text/css" href="/style/app-common.css" />
        <style>
            .version-tooltip .tooltip-inner {
                text-align: left;
            }
        </style>

        <title>PIXELIX</title>
        <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    </head>

    <body class="d-flex flex-column h-100">
        <header>
            <!-- Fixed navbar -->
            <nav class="navbar navbar-expand-md fixed-top bg-dark">
                <a class="navbar-brand" href="/index.html">
                    <img src="/images/LogoSmall.png" alt="PIXELIX" data-bs-toggle="tooltip" data-bs-placement="bottom" data-bs-custom-class="logo-tooltip" title="Target: ~TARGET~&#10;Hostname: ~HOSTNAME~" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto" id="menu">
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Begin page content -->
        <main role="main" class="flex-shrink-0">
            <div class="container text-center">
                <h1 class="mt-5">Welcome to</h1>
                <p class="lead"><img src="/images/Logo.png" alt="Pixelix" /></p>
                <table class="table table-borderless table-sm w-auto mx-auto mt-5 text-start">
                    <caption class="visually-hidden">Software and build information</caption>
                    <tbody>
                        <tr>
                            <th scope="row">
                                <span tabindex="0" data-bs-toggle="tooltip" data-bs-html="true" data-bs-placement="top"
                                    title=":uc = unpushed commits&#10;:lc = tracked local changes&#10;:b = non-master, non-tag build."
                                    data-bs-custom-class="version-tooltip"
                                    data-bs-title="<span class='badge bg-warning text-dark'>:uc</span> Unpushed commits<br><span class='badge bg-info text-dark'>:lc</span> Tracked local changes<br><span class='badge bg-secondary'>:b</span> Non-master, non-tag build.">Software version</span>
                            </th>
                            <td>~SW_VERSION~</td>
                        </tr>
                        <tr>
                            <th scope="row">Git revision</th>
                            <td><span id="software-revision">~SW_REVISION~</span></td>
                        </tr>
                        <tr>
                            <th scope="row">Git ref</th>
                            <td>~SW_BRANCH~</td>
                        </tr>
                        <tr>
                            <th scope="row">Build target</th>
                            <td>~TARGET~</td>
                        </tr>
                        <tr>
                            <th scope="row">Hostname</th>
                            <td>~HOSTNAME~</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer mt-auto py-3">
            <div class="container">
                <hr />
                <span class="text-secondary">Copyright (c) 2019 - 2026 Andreas Merkle (web@blue-andi.de)</span><br />
                <span class="text-secondary"><a href="https://github.com/BlueAndi/Pixelix/blob/master/LICENSE">MIT License</a></span>
            </div>
        </footer>

        <!-- Bootstrap JS bundle -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" onerror="this.onerror=null;this.src='/js/bootstrap.bundle.min.js';"></script>
        <script>document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) { new bootstrap.Tooltip(el); });</script>
        <!-- Pixelix menu -->
        <script type="text/javascript" src="/js/app-menu.js"></script>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                menu.addSubMenu(menu.data, "Plugins", pluginSubMenu);
                menu.addSubMenu(menu.data, "Services", serviceSubMenu);
                menu.create("menu", menu.data);

                const revisionElement = document.getElementById("software-revision");
                const revision = revisionElement.textContent.trim();

                if (/^[0-9a-f]{40}$/i.test(revision)) {
                    const revisionLink = document.createElement("a");
                    revisionLink.href = `https://github.com/BlueAndi/Pixelix/tree/${revision}`;
                    revisionLink.target = "_blank";
                    revisionLink.rel = "noopener noreferrer";
                    revisionLink.textContent = revision;
                    revisionElement.replaceChildren(revisionLink);
                }

            });
        </script>
    </body>

</html>
