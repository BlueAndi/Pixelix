<!doctype html>
<html lang="en" data-bs-theme="dark">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <!-- Styles -->
        <link id="bootstrap-css" rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
        <script>
            (function () {
                const cdnLink = document.getElementById("bootstrap-css");
                let isLoaded = false;

                if (null === cdnLink) {
                    return;
                }

                const useLocalBootstrapCss = function () {
                    cdnLink.setAttribute("href", "/style/bootstrap.min.css");
                };

                cdnLink.addEventListener("load", function () {
                    isLoaded = true;
                });

                cdnLink.addEventListener("error", useLocalBootstrapCss);

                window.setTimeout(function () {
                    if (false === isLoaded) {
                        useLocalBootstrapCss();
                    }
                }, 3000);
            })();
        </script>
        <link rel="stylesheet" type="text/css" href="/style/app-common.css" />

        <title>PIXELIX</title>
        <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    </head>

    <body class="d-flex flex-column h-100">
        <header>
            <!-- Fixed navbar -->
            <nav class="navbar navbar-expand-md fixed-top bg-dark">
                <a class="navbar-brand" href="/index.html">
                    <img src="/images/LogoSmall.png" alt="PIXELIX" data-bs-toggle="tooltip" data-bs-placement="bottom" title="~TARGET~ | ~HOSTNAME~" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto" id="menu">
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Begin page content -->
        <main role="main" class="flex-shrink-0">
            <!-- Dialog -->
            <div class="modal fade" id="modalDialog" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true" data-bs-keyboard="false" data-bs-backdrop="static">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header" id="dialogHeader">
                            <h5 class="modal-title" id="dialogTitle"></h5>
                        </div>
                        <div class="modal-body" id="dialogBody">
                        </div>
                        <div class="modal-footer" id="dialogFooter">
                        </div>
                    </div>
                </div>
            </div>
            <!-- Main view -->
            <div class="container">
                <h1 class="mt-5">Settings</h1>
                <p>Setting changes need a restart to take effect.</p>
                <p><button class="btn btn-light" type="button" id="btnRestart" disabled>Restart</button></p>
                <p id="settings"></p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer mt-auto py-3">
            <div class="container">
                <hr />
                <span class="text-secondary">Copyright (c) 2019 - 2026 Andreas Merkle (web@blue-andi.de)</span><br />
                <span class="text-secondary"><a href="https://github.com/BlueAndi/Pixelix/blob/master/LICENSE">MIT License</a></span>
            </div>
        </footer>

        <!-- Bootstrap JS bundle -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" onerror="this.onerror=null;this.src='/js/bootstrap.bundle.min.js';"></script>
        <script>document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) { new bootstrap.Tooltip(el); });</script>
        <!-- Pixelix menu -->
        <script type="text/javascript" src="/js/app-menu.js"></script>
        <!-- Pixelix utilities -->
        <script type="text/javascript" src="/js/app-api.js"></script>
        <!-- Pixelix REST API -->

        <!-- Custom javascript -->
        <script>
            const restClient = new pixelix.rest.Client();
            const data = [];

            /* Disable all UI elements. */
            function disableUI() {
                document.querySelectorAll("main button").forEach((button) => {
                    button.disabled = true;
                });
            }

            /* Enable all UI elements. */
            function enableUI() {
                document.querySelectorAll("main button").forEach((button) => {
                    button.disabled = false;
                });
            }

            async function restart() {
                disableUI();

                try {
                    await restClient.restart();
                    await dialog.showInfo("<p>Ok.</p>");
                } catch (err) {
                    await dialog.showError("<p>Error: " + err + "</p>");
                }
            }

            async function store(id) {
                const input = document.getElementById(id);
                const index = Number.parseInt(id.substring(8));
                let value = null;

                if (input.type === "checkbox") {
                    value = input.checked;
                } else {
                    value = input.value;
                }

                try {
                    await restClient.setSetting(data[index].key, value);
                    await dialog.showInfo("<p>Successful stored.</p>");
                } catch (rsp) {
                    await dialog.showError("<p>Error: " + rsp.error.msg + "</p>");
                }
            }

            function createSettingBlock(setting, index) {
                const block = document.createElement("div");
                block.className = "form-group h-100 p-2 bg-body-tertiary border rounded-3 mt-2";

                const label = document.createElement("label");
                label.setAttribute("for", "setting-" + index);
                label.className = "form-label";
                label.textContent = setting.name;

                let inputField = null;
                let formCheck = null;

                if (typeof setting.value === "string") {
                    let inputFieldType = "text";

                    if ((typeof setting.isSecret === "boolean") && (setting.isSecret === true)) {
                        inputFieldType = "password";
                    }

                    inputField = document.createElement("input");
                    inputField.className = "form-control";
                    inputField.id = "setting-" + index;
                    inputField.placeholder = "";
                    inputField.type = inputFieldType;
                    if (setting.minlength != null) {
                        inputField.setAttribute("minlength", setting.minlength);
                    }
                    if (setting.maxlength != null) {
                        inputField.setAttribute("maxlength", setting.maxlength);
                    }
                    inputField.value = setting.value;

                } else if (typeof setting.value === "number") {
                    inputField = document.createElement("input");
                    inputField.className = "form-control";
                    inputField.id = "setting-" + index;
                    inputField.placeholder = "";
                    inputField.type = "number";
                    if (setting.min != null) {
                        inputField.setAttribute("min", setting.min);
                    }
                    if (setting.max != null) {
                        inputField.setAttribute("max", setting.max);
                    }
                    inputField.value = setting.value;

                } else if (typeof setting.value === "boolean") {
                    inputField = document.createElement("input");
                    inputField.className = "form-check-input";
                    inputField.id = "setting-" + index;
                    inputField.placeholder = "";
                    inputField.type = "checkbox";

                    if (setting.value === true) {
                        inputField.checked = true;
                    }

                    label.className = "form-check-label";

                    formCheck = document.createElement("div");
                    formCheck.className = "form-check";
                    formCheck.appendChild(inputField);
                    formCheck.appendChild(label);

                } else if (typeof setting.value === "object") {
                    inputField = document.createElement("textarea");
                    inputField.className = "form-control";
                    inputField.id = "setting-" + index;
                    inputField.placeholder = "";
                    inputField.cols = 40;
                    inputField.rows = 20;
                    inputField.style.fontFamily = "monospace";
                    if (setting.minlength != null) {
                        inputField.setAttribute("minlength", setting.minlength);
                    }
                    if (setting.maxlength != null) {
                        inputField.setAttribute("maxlength", setting.maxlength);
                    }
                    inputField.value = JSON.stringify(setting.value, null, 2);

                } else {
                    console.error("Data type" + typeof setting.value + "not handled.");
                }

                const button = document.createElement("button");
                button.className = "btn btn-primary";
                button.textContent = "Store";
                button.addEventListener("click", () => store("setting-" + index));

                const formGroup = document.createElement("div");
                formGroup.className = "form-group";

                if (formCheck !== null) {
                    formGroup.appendChild(formCheck);
                } else {
                    formGroup.appendChild(label);
                    formGroup.appendChild(inputField);
                }

                block.appendChild(formGroup);
                block.appendChild(button);

                return block;
            }

            document.addEventListener("DOMContentLoaded", async () => {
                menu.addSubMenu(menu.data, "Plugins", pluginSubMenu);
                menu.addSubMenu(menu.data, "Services", serviceSubMenu);
                menu.create("menu", menu.data);

                try {
                    const result = await restClient.getSettingKeys();

                    for (const key of result.data.settings) {
                        const response = await restClient.getSettingByKey(key);
                        data.push(response.data);
                    }

                    const settingsContainer = document.getElementById("settings");

                    data.forEach((setting, index) => {
                        settingsContainer.appendChild(createSettingBlock(setting, index));
                    });

                    enableUI();
                } catch (err) {
                    await dialog.showError("<p>Error: " + err + "</p>");
                }
            });

            document.addEventListener("DOMContentLoaded", () => {
                document.getElementById("btnRestart").addEventListener("click", restart);
            });
        </script>
    </body>

</html>
