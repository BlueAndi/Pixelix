<!doctype html>
<html lang="en" data-bs-theme="dark">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <!-- Styles -->
        <link rel="stylesheet" type="text/css" href="/style/bootstrap.min.css" />
        <link rel="stylesheet" type="text/css" href="/style/sticky-footer-navbar.css" />
        <link rel="stylesheet" type="text/css" href="/style/style.css" />
        <link rel="stylesheet" type="text/css" href="/style/edit.css" />
        <link rel="stylesheet" type="text/css" href="/style/tree.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ace-builds@1.43.5/css/ace.min.css">

        <style>
            .editor-page {
                padding-top: 1rem;
                padding-bottom: 1.5rem;
            }

            .editor-shell {
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 0.75rem;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
                overflow: hidden;
            }

            .editor-toolbar {
                background-color: rgba(0, 0, 0, 0.2);
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }

            .file-sidebar {
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 0.75rem;
                background-color: rgba(255, 255, 255, 0.02);
                padding: 0.75rem;
            }

            .file-tree-scroll {
                max-height: 65vh;
                overflow: auto;
                padding-right: 0.25rem;
            }

            #fileTree .nav-link {
                border-radius: 0.4rem;
            }

            #editor,
            #preview {
                min-height: 70vh;
            }

            #preview {
                padding: 0.75rem;
            }

            #preview img {
                max-width: 100%;
                height: auto;
                border-radius: 0.5rem;
            }

            .upload-card {
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 0.75rem;
                background-color: rgba(255, 255, 255, 0.02);
                padding: 0.75rem;
            }
        </style>

        <title>PIXELIX</title>
        <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    </head>

    <body class="d-flex flex-column h-100">
        <header>
            <!-- Fixed navbar -->
            <nav class="navbar navbar-expand-md navbar-dark navbar-fixed-top bg-dark">
                <a class="navbar-brand" href="/index.html">
                    <img src="/images/LogoSmall.png" alt="PIXELIX" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav me-auto" id="menu">
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Begin page content -->
        <main role="main" class="flex-shrink-0">
            <!-- Dialog -->
            <div class="modal fade" id="modalDialog" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true" data-bs-keyboard="false" data-bs-backdrop="static">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header" id="dialogHeader">
                            <h5 class="modal-title" id="dialogTitle"></h5>
                        </div>
                        <div class="modal-body" id="dialogBody">
                        </div>
                        <div class="modal-footer" id="dialogFooter">
                        </div>
                    </div>
                </div>
            </div>
            <!-- Main view -->
            <div class="container-fluid editor-page">
                <div class="row g-3 align-items-center mb-1">
                    <div class="col-lg-7">
                        <h1 class="mt-1 mb-1">File Editor</h1>
                        <p class="text-secondary mb-0">Browse, upload, preview and edit files directly on the device.</p>
                    </div>
                    <div class="col-lg-5 text-lg-end">
                        <span class="badge text-bg-secondary">Shortcut: CTRL + S to save</span>
                    </div>
                </div>

                <div class="upload-card mb-3">
                    <div class="row g-2 align-items-center">
                        <div class="col-lg-8">
                            <div class="input-group">
                                <input type="file" class="form-control" id="uploadFile">
                                <button class="btn btn-light" type="button" onclick="upload();">Upload</button>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="input-group">
                                <span class="input-group-text">Destination</span>
                                <input type="text" class="form-control" id="directory" value="/configuration" size="40" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-lg-3">
                        <div class="file-sidebar sticky-top" style="top: 84px;">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h2 class="h5 mb-0">Files</h2>
                                <button class="btn btn-sm btn-outline-light" type="button" id="refreshTree">Refresh</button>
                            </div>
                            <div class="input-group input-group-sm mb-2">
                                <span class="input-group-text">Filter</span>
                                <input type="text" class="form-control" id="fileFilter" placeholder="Type to filter files" />
                            </div>
                            <div class="file-tree-scroll">
                                <ul class="nav nav-pills flex-column" id="fileTree"></ul>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-9" style="position: relative;">
                        <div class="editor-shell">
                            <div class="editor-toolbar px-3 py-2 d-flex flex-wrap justify-content-between align-items-center gap-2">
                                <div>
                                    <div class="small text-secondary">Current file</div>
                                    <div id="fileName" class="fw-semibold text-light"></div>
                                </div>
                                <div class="btn-group btn-group-sm" role="group" aria-label="Editor actions">
                                    <button type="button" class="btn btn-outline-light" onclick="saveCurrentFile();">Save</button>
                                    <button type="button" class="btn btn-outline-light" onclick="undoInEditor();">Undo</button>
                                    <button type="button" class="btn btn-outline-light" onclick="redoInEditor();">Redo</button>
                                </div>
                            </div>
                            <div class="collapse show" id="editor"></div>
                            <div class="collapse" id="preview"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer mt-auto py-3">
            <div class="container">
                <hr />
                <span class="text-secondary">Copyright (c) 2019 - 2026 Andreas Merkle (web@blue-andi.de)</span><br />
                <span class="text-secondary"><a href="https://github.com/BlueAndi/Pixelix/blob/master/LICENSE">MIT License</a></span>
            </div>
        </footer>

        <!-- jQuery, and Bootstrap JS bundle -->
        <script type="text/javascript" src="/js/jquery-3.7.1.slim.min.js"></script>
        <script type="text/javascript" src="/js/bootstrap.bundle.min.js"></script>
        <!-- Pixelix menu -->
        <script type="text/javascript" src="/js/menu.js"></script>
        <script type="text/javascript" src="/js/pluginsSubMenu.js"></script>
        <script type="text/javascript" src="/js/servicesSubMenu.js"></script>
        <!-- Pixelix utilities -->
        <script type="text/javascript" src="/js/utils.js"></script>
        <script type="text/javascript" src="/js/dialog.js"></script>
        <!-- Pixelix REST API -->
        <script type="text/javascript" src="/js/rest.js"></script>
        <!-- The high performance code editor Ace. -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/ace-builds@1.43.5/src-min-noconflict/ace.min.js" referrerpolicy="origin"></script>

        <!-- Custom javascript -->
        <script>
            var editor = null;
            var loadedFile = "";
            var restClient = new pixelix.rest.Client();
            var supportedFileTypes = [{
                name: "bmp",
                lang: null,
                type: "image"
            }, {
                name: "css",
                lang: "css",
                type: "text"
            }, {
                name: "gif",
                lang: null,
                type: "image"
            }, {
                name: "htm",
                lang: "html",
                type: "text"
            }, {
                name: "html",
                lang: "html",
                type: "text"
            }, {
                name: "jpg",
                lang: null,
                type: "image"
            }, {
                name: "js",
                lang: "javascript",
                type: "text"
            }, {
                name: "json",
                lang: "json",
                type: "text"
            }, {
                name: "png",
                lang: null,
                type: "image"
            }, {
                name: "txt",
                lang: "plain_text",
                type: "text"
            }, {
                name: "xml",
                lang: "xml",
                type: "text"
            }];

            function createFileInTree(fileInfo, seqNo) {
                var fileTypeInfo = getFileTypeInfo(fileInfo.name);
                var itemId = "file" + seqNo;
                var fileName = fileInfo.name.split('/').pop(); // Extract only the filename without path
                var $itemFile = $("<li>");
                var $actions = $("<div>")
                    .attr("class", "dropdown-menu");
                var $actionSize = $("<a>")
                    .attr("class", "dropdown-item disabled")
                    .attr("href", "#")
                    .attr("tabindex", "-1")
                    .attr("aria-disabled", "true")
                    .text((fileInfo.size / 1024).toFixed(2) + " kByte");
                var $actionDownload = $("<a>")
                    .attr("class", "dropdown-item")
                    .attr("href", fileInfo.name)
                    .attr("download", true)
                    .text("Download");
                var $actionEdit = $("<a>")
                    .attr("class", "dropdown-item")
                    .attr("href", "#")
                    .attr("onclick", "editFile(\"" + itemId + "\")")
                    .text("Edit");
                var $actionPreview = $("<a>")
                    .attr("class", "dropdown-item")
                    .attr("href", "#")
                    .attr("onclick", "previewFile(\"" + itemId + "\")")
                    .text("Preview");
                var $actionRemove = $("<a>")
                    .attr("class", "dropdown-item")
                    .attr("href", "#")
                    .attr("onclick", "removeFile(\"" + itemId + "\")")
                    .text("Remove");
                var $itemButton = $("<a>")
                    .attr("href", "#")
                    .attr("role", "button")
                    .attr("class", "nav-link dropdown-toggle")
                    .attr("id", itemId)
                    .attr("data-full-path", fileInfo.name) // Store full path for operations
                    .attr("data-bs-toggle", "dropdown")
                    .attr("aria-haspopup", "true")
                    .attr("aria-expanded", "false")
                    .text(fileName);

                $($actions).append($actionSize);
                $($actions).append($actionDownload);

                if (null !== fileTypeInfo) {
                    if ("text" === fileTypeInfo.type) {
                        $($actions).append($actionEdit);
                    } else if ("image" === fileTypeInfo.type) {
                        $($actions).append($actionPreview);
                    }
                }

                $($actions).append($actionRemove);
                $($itemFile).append($itemButton).append($actions);

                return $itemFile;
            }

            function createDirectoryInTree(directoryInfo, meta = null) {
                var idx = 0;
                var dirName = directoryInfo.name.split('/').pop() || directoryInfo.name; // Extract only the directory name without path
                var $dirName = $("<li>")
                    .attr("data-full-path", directoryInfo.name)
                    .attr("data-loaded", "false")
                    .text(dirName);
                var $itemDir = $("<ul>");

                $($dirName).append($itemDir);

                if (null === meta) {
                    meta = {
                        seqNo: 0
                    };
                }

                // Only process the listing if it exists (for initially loaded directories)
                if (directoryInfo.listing && directoryInfo.listing.length > 0) {
                    for (idx = 0; idx < directoryInfo.listing.length; ++idx) {

                        if (directoryInfo.listing[idx].type === "dir") {
                            // For subdirectories, create placeholder without listing to enable lazy loading
                            var subDir = {
                                name: directoryInfo.listing[idx].name,
                                type: "dir"
                                // No listing property - this will trigger lazy loading
                            };
                            $($itemDir).append(createDirectoryInTree(subDir, meta));
                        } else {
                            $($itemDir).append(createFileInTree(directoryInfo.listing[idx], meta.seqNo));
                            ++meta.seqNo;
                        }
                    }
                    $dirName.attr("data-loaded", "true");
                }

                return $dirName;
            }

            function listRootFiles(id) {
                return restClient.listAllFiles("/").then(function (items) {
                    var $menu = $("#" + id);
                    $menu.empty();

                    // Create root directory structure with only first-level contents
                    var rootDir = {
                        name: "/",
                        type: "dir",
                        listing: items
                    };

                    var $root = createDirectoryInTree(rootDir).children().appendTo($menu);

                    $("#" + id).treed();

                    return Promise.resolve();

                }).catch(function (rsp) {
                    var alertMsg = "";

                    if (typeof rsp === "string") {
                        alertMsg = rsp;
                    } else {
                        alertMsg = rsp.error.msg;
                    }

                    return dialog.showError("<p>" + alertMsg + "</p>").then(function () {
                        return Promise.reject();
                    });
                });
            }

            function loadDirectoryContents(dirPath, $dirElement) {
                return restClient.listAllFiles(dirPath).then(function (items) {
                    var $itemDir = $dirElement.children('ul').first();
                    var meta = {
                        seqNo: $("#fileTree").find('a[id^="file"]').length // Continue numbering from existing files
                    };

                    // Clear any existing placeholder content
                    $itemDir.empty();

                    // Add the directory contents
                    for (var idx = 0; idx < items.length; ++idx) {
                        if (items[idx].type === "dir") {
                            // For subdirectories, create without listing to enable lazy loading
                            var subDir = {
                                name: items[idx].name,
                                type: "dir"
                                // No listing property - this will trigger lazy loading
                            };
                            $itemDir.append(createDirectoryInTree(subDir, meta));
                        } else {
                            $itemDir.append(createFileInTree(items[idx], meta.seqNo));
                            ++meta.seqNo;
                        }
                    }

                    // Mark as loaded and reinitialize tree functionality for new elements
                    $dirElement.attr("data-loaded", "true");
                    $("#fileTree").treed();

                    return Promise.resolve();

                }).catch(function (rsp) {
                    var alertMsg = "";

                    if (typeof rsp === "string") {
                        alertMsg = rsp;
                    } else {
                        alertMsg = rsp.error.msg;
                    }

                    return dialog.showError("<p>" + alertMsg + "</p>").then(function () {
                        return Promise.reject();
                    });
                });
            }

            function editFile(id) {
                var filename = $("#" + id).attr("data-full-path"); // Use full path from data attribute

                loadedFile = filename;
                editor.setValue("");
                setEditorMode(filename);
                $("#editor").collapse("show");
                $("#preview").collapse("hide");
                $("#fileName").text(loadedFile);

                return dialog.show("Loading file", "<p>Please wait, its loading.</p>")
                    .then(function () {
                        return restClient.readFile(filename);
                    })
                    .then(function (rsp) {
                        /* Fill content in, remove selection and
                         * move cursor to the begin.
                         */
                        editor.setValue(rsp, -1);

                        return dialog.hide();
                    }).catch(function (rsp) {
                        var errorMsg = rsp.error.msg;

                        return dialog.showError("<p>" + errorMsg + "</p>").then(function () {
                            return Promise.reject();
                        });
                    });
            }

            function previewFile(id) {
                var filename = $("#" + id).attr("data-full-path"); // Use full path from data attribute
                var $image = $("<img>")
                    .attr("src", filename)
                    .attr("alt", filename);

                loadedFile = "";
                editor.setValue("");

                $("#preview").empty();
                $("#preview").append($image);
                $("#editor").collapse("hide");
                $("#preview").collapse("show");
            }

            function removeFile(id) {
                var filename = $("#" + id).attr("data-full-path"); // Use full path from data attribute

                return restClient.removeFile(filename).then(function (rsp) {

                    if (loadedFile === filename) {
                        loadedFile = "";
                        editor.setValue("");
                    }
                    $("#" + id).parent().remove();

                    return dialog.showInfo("<p>File " + filename + " removed.</p>");

                }).catch(function (rsp) {
                    return dialog.showError("<p>" + rsp.error.msg + "</p>");
                });
            }

            function getFileTypeInfo(filename) {
                var info = null;
                var index = 0;

                while ((supportedFileTypes.length > index) && (null === info)) {
                    if (true === filename.endsWith("." + supportedFileTypes[index].name)) {
                        info = supportedFileTypes[index];
                    }
                    ++index;
                }

                return info;
            }

            function setEditorMode(filename) {
                var prefix = "ace/mode/";
                var mode = prefix + "plain_text";
                var fileTypeInfo = getFileTypeInfo(filename);

                if ((null !== fileTypeInfo) &&
                    (null !== fileTypeInfo.lang)) {
                    mode = prefix + fileTypeInfo.lang;
                }

                editor.getSession().setMode(mode);
            }

            function upload() {
                var fileCnt = document.getElementById("uploadFile").files.length;
                var dstDirectoryName = $("#directory").val();
                var file = null;
                var fullPath = "";

                if (fileCnt === 1) {
                    file = document.getElementById("uploadFile").files[0];
                    fullPath = dstDirectoryName + "/" + file.name;

                    return restClient.writeFile(fullPath, file, "application/octet-stream").then(function (rsp) {
                        return dialog.showInfo("<p>File " + file.name + " uploaded.</p>").then(function () {
                            return listRootFiles("fileTree");
                        });
                    }).catch(function (rsp) {
                        return dialog.showError("<p>" + rsp.error.msg + "</p>");
                    });
                }
            }

            function saveCurrentFile() {
                if (0 === loadedFile.length) {
                    return dialog.showInfo("<p>Please select a text file to edit first.</p>");
                }

                return dialog.show("Saving file", "<p>Please wait, its saving.</p>")
                    .then(function () {
                        return restClient.writeFile(loadedFile, editor.getValue(), "text/plain");
                    })
                    .finally(function () {
                        dialog.hide();
                    });
            }

            function undoInEditor() {
                if (null !== editor) {
                    editor.getSession().getUndoManager().undo(false);
                }
            }

            function redoInEditor() {
                if (null !== editor) {
                    editor.getSession().getUndoManager().redo(false);
                }
            }

            function filterFileTree() {
                var query = $("#fileFilter").val().trim().toLowerCase();
                var $tree = $("#fileTree");

                if (0 === query.length) {
                    $tree.find("li").show();
                    return;
                }

                $tree.find("a[id^='file']").each(function () {
                    var $fileItem = $(this).closest("li");
                    var isMatch = ($(this).text().toLowerCase().indexOf(query) !== -1);
                    $fileItem.toggle(isMatch);
                });

                $($tree.find("li").get().reverse()).each(function () {
                    var $dirItem = $(this);
                    var $childrenList = $dirItem.children("ul");

                    if (0 < $childrenList.length) {
                        var ownText = $dirItem.clone().children().remove().end().text().trim().toLowerCase();
                        var hasVisibleChildren = (0 < $childrenList.children("li:visible").length);
                        var ownMatch = (ownText.indexOf(query) !== -1);

                        $dirItem.toggle(ownMatch || hasVisibleChildren);
                    }
                });
            }

            function refreshFileTree() {
                return dialog.show("Refreshing files", "<p>Please wait, file information is loading.</p>")
                    .then(function () {
                        return listRootFiles("fileTree");
                    })
                    .finally(function () {
                        dialog.hide();
                    });
            }

            $(document).ready(function () {
                menu.addSubMenu(menu.data, "Plugins", pluginSubMenu);
                menu.addSubMenu(menu.data, "Services", serviceSubMenu);
                menu.create("menu", menu.data);

                $("#uploadFile").on("change", function () {
                    var fileName = $(this).val().split("\\").pop();
                    $(this).next(".custom-file-label").addClass("selected").html(fileName);
                });

                $("#fileFilter").on("input", function () {
                    filterFileTree();
                });

                $("#refreshTree").on("click", function () {
                    refreshFileTree();
                });

                $.fn.extend({
                    treed: function (o) {

                        // Helper function to toggle a branch
                        function toggleBranch(branch) {
                            var icon = branch.children("i:first").children("svg:first");
                            var isCurrentlyCollapsed = icon.hasClass("rotate270");
                            var dirPath = branch.attr("data-full-path");
                            var isLoaded = branch.attr("data-loaded") === "true";

                            // If expanding (currently collapsed) a directory that hasn't been loaded yet, load its contents
                            if (isCurrentlyCollapsed && dirPath && !isLoaded) {
                                dialog.show("Loading directory", "<p>Please wait, loading directory contents...</p>")
                                    .then(function () {
                                        return loadDirectoryContents(dirPath, branch);
                                    })
                                    .then(function () {
                                        // After loading, toggle the visual state
                                        icon.removeClass("rotate270");
                                        branch.children().not("i").children().show();
                                    })
                                    .finally(function () {
                                        dialog.hide();
                                    });
                            } else {
                                // Normal toggle behavior for already loaded directories
                                icon.toggleClass("rotate270");
                                branch.children().not("i").children().toggle();
                            }
                        }

                        //initialize each of the top levels
                        var tree = $(this);
                        tree.addClass("tree");
                        tree.find('li').has("ul").each(function () {
                            var branch = $(this); //li with children ul

                            // Only add icon if it doesn't already exist
                            if (branch.children("i.tree-icon").length === 0) {
                                branch.prepend("<i class=\"tree-icon\"><svg class=\"rotate270 bg-white\" xmlns=\"http://www.w3.org/2000/svg\" width=\"13\" height=\"10\" viewBox=\"0 0 13 10\"><polygon points=\"2 1, 12 1, 7 9\"></polygon></svg></i>");
                                branch.addClass('branch');

                                // Remove old click handlers and add new one
                                branch.off('click.tree').on('click.tree', function (e) {
                                    if (this == e.target) {
                                        toggleBranch($(this));
                                    }
                                });

                                // Initially hide children unless it's the root or already loaded
                                if (branch.attr("data-loaded") !== "true") {
                                    branch.children().not("i").children().hide();
                                }
                            }
                        });

                        //fire event from the dynamically added icon
                        tree.find('.branch .tree-icon').each(function () {
                            $(this).off('click.tree').on('click.tree', function (e) {
                                e.stopPropagation(); // Prevent event bubbling
                                toggleBranch($(this).closest('li'));
                            });
                        });

                        //fire event from the dynamically added SVG icon
                        tree.find('.branch .tree-icon svg').each(function () {
                            $(this).off('click.tree').on('click.tree', function (e) {
                                e.stopPropagation(); // Prevent event bubbling
                                toggleBranch($(this).closest('li'));
                            });
                        });

                        //fire event to open branch if the li contains an anchor instead of text
                        tree.find('.branch>a').each(function () {
                            $(this).off('click.tree').on('click.tree', function (e) {
                                $(this).closest('li').click();
                                e.preventDefault();
                            });
                        });

                        //fire event to open branch if the li contains a button instead of text
                        tree.find('.branch>button').each(function () {
                            $(this).off('click.tree').on('click.tree', function (e) {
                                $(this).closest('li').click();
                                e.preventDefault();
                            });
                        });
                    }
                });

                ace.config.set("basePath", "https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2");
                editor = ace.edit("editor");
                editor.setTheme("ace/theme/textmate");
                editor.session.setUseSoftTabs(true);
                editor.session.setTabSize(4);
                editor.setShowPrintMargin(false);
                editor.setHighlightActiveLine(true);
                editor.setAutoScrollEditorIntoView(true);
                editor.setOptions({ maxLines: Infinity });
                editor.commands.addCommand({
                    name: "saveCommand",
                    bindKey: {
                        win: "Ctrl-S",
                        mac: "Command-S"
                    },
                    exec: function (editor) {
                        saveCurrentFile();
                    },
                    readOnly: false
                });
                editor.commands.addCommand({
                    name: "undoCommand",
                    bindKey: { win: "Ctrl-Z", mac: "Command-Z" },
                    exec: function (editor) {
                        undoInEditor();
                    },
                    readOnly: false
                });
                editor.commands.addCommand({
                    name: "redoCommand",
                    bindKey: { win: "Ctrl-Shift-Z", mac: "Command-Shift-Z" },
                    exec: function (editor) {
                        redoInEditor();
                    },
                    readOnly: false
                });

                dialog.show("Loading ...", "<p>Please wait, file information is loading.</p>")
                    .then(function () {
                        return listRootFiles("fileTree");
                    })
                    .finally(function () {
                        dialog.hide();
                    });
            });
        </script>
    </body>

</html>
