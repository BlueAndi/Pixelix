<!doctype html>
<html lang="en" data-bs-theme="dark">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <!-- Styles -->
        <link id="bootstrap-css" rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
        <script>
            (function () {
                const cdnLink = document.getElementById("bootstrap-css");
                let isLoaded = false;

                if (null === cdnLink) {
                    return;
                }

                const useLocalBootstrapCss = function () {
                    cdnLink.setAttribute("href", "/style/bootstrap.min.css");
                };

                cdnLink.addEventListener("load", function () {
                    isLoaded = true;
                });

                cdnLink.addEventListener("error", useLocalBootstrapCss);

                window.setTimeout(function () {
                    if (false === isLoaded) {
                        useLocalBootstrapCss();
                    }
                }, 3000);
            })();
        </script>
        <link rel="stylesheet" type="text/css" href="/style/app-common.css" />
        <link rel="stylesheet" type="text/css" href="/style/edit.css" />
        <link rel="stylesheet" type="text/css" href="/style/tree.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ace-builds@1.43.6/css/ace.min.css">

        <style>
            .editor-page {
                padding-top: 1rem;
                padding-bottom: 1.5rem;
            }

            .editor-shell {
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 0.75rem;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
                overflow: hidden;
            }

            .editor-toolbar {
                background-color: rgba(0, 0, 0, 0.2);
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }

            .file-sidebar {
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 0.75rem;
                background-color: rgba(255, 255, 255, 0.02);
                padding: 0.75rem;
            }

            .file-tree-scroll {
                max-height: 65vh;
                overflow: auto;
                padding-right: 0.25rem;
            }

            #fileTree .nav-link {
                border-radius: 0.4rem;
            }

            #editor,
            #preview {
                min-height: 70vh;
            }

            #preview {
                padding: 0.75rem;
            }

            #preview img {
                max-width: 100%;
                height: auto;
                border-radius: 0.5rem;
            }

            .upload-card {
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 0.75rem;
                background-color: rgba(255, 255, 255, 0.02);
                padding: 0.75rem;
            }
        </style>

        <title>PIXELIX</title>
        <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    </head>

        <main role="main" class="flex-shrink-0">

            <div class="modal fade" id="modalDialog" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true" data-bs-keyboard="false" data-bs-backdrop="static">

        <!-- Bootstrap JS bundle -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" onerror="this.onerror=null;this.src='/js/bootstrap.bundle.min.js';"></script>

        <!-- Pixelix REST API -->
        <!-- The high performance code editor Ace. -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/ace-builds@1.43.6/src-min-noconflict/ace.min.js" referrerpolicy="origin"></script>

        <!-- Custom javascript -->
        <script>
            let editor = null;
            let loadedFile = "";
            const restClient = new pixelix.rest.Client();
            const supportedFileTypes = [{
                name: "bmp",
                lang: null,
                type: "image"
            }, {
                name: "css",
                lang: "css",
                type: "text"
            }, {
                name: "gif",
                lang: null,
                type: "image"
            }, {
                name: "htm",
                lang: "html",
                type: "text"
            }, {
                name: "html",
                lang: "html",
                type: "text"
            }, {
                name: "jpg",
                lang: null,
                type: "image"
            }, {
                name: "js",
                lang: "javascript",
                type: "text"
            }, {
                name: "json",
                lang: "json",
                type: "text"
            }, {
                name: "png",
                lang: null,
                type: "image"
            }, {
                name: "txt",
                lang: "plain_text",
                type: "text"
            }, {
                name: "xml",
                lang: "xml",
                type: "text"
            }];

            function setVisible(element, visible) {
                element.style.display = visible ? "" : "none";
            }

            function isVisible(element) {
                return element.offsetParent !== null;
            }

            function createFileInTree(fileInfo, seqNo) {
                const fileTypeInfo = getFileTypeInfo(fileInfo.name);
                const itemId = "file" + seqNo;
                const fileName = fileInfo.name.split("/").pop(); // Extract only the filename without path

                const itemButton = document.createElement("a");
                itemButton.href = "#";
                itemButton.setAttribute("role", "button");
                itemButton.className = "nav-link dropdown-toggle";
                itemButton.id = itemId;
                itemButton.setAttribute("data-full-path", fileInfo.name); // Store full path for operations
                itemButton.setAttribute("data-bs-toggle", "dropdown");
                itemButton.setAttribute("aria-haspopup", "true");
                itemButton.setAttribute("aria-expanded", "false");
                itemButton.textContent = fileName;

                const actions = document.createElement("div");
                actions.className = "dropdown-menu";

                const actionSize = document.createElement("a");
                actionSize.className = "dropdown-item disabled";
                actionSize.href = "#";
                actionSize.tabIndex = -1;
                actionSize.setAttribute("aria-disabled", "true");
                actionSize.textContent = (fileInfo.size / 1024).toFixed(2) + " kByte";

                const actionDownload = document.createElement("a");
                actionDownload.className = "dropdown-item";
                actionDownload.href = fileInfo.name;
                actionDownload.setAttribute("download", "true");
                actionDownload.textContent = "Download";

                actions.appendChild(actionSize);
                actions.appendChild(actionDownload);

                if (fileTypeInfo !== null) {
                    if (fileTypeInfo.type === "text") {
                        const actionEdit = document.createElement("a");
                        actionEdit.className = "dropdown-item";
                        actionEdit.href = "#";
                        actionEdit.textContent = "Edit";
                        actionEdit.addEventListener("click", () => editFile(itemId));
                        actions.appendChild(actionEdit);
                    } else if (fileTypeInfo.type === "image") {
                        const actionPreview = document.createElement("a");
                        actionPreview.className = "dropdown-item";
                        actionPreview.href = "#";
                        actionPreview.textContent = "Preview";
                        actionPreview.addEventListener("click", () => previewFile(itemId));
                        actions.appendChild(actionPreview);
                    }
                }

                const actionRemove = document.createElement("a");
                actionRemove.className = "dropdown-item";
                actionRemove.href = "#";
                actionRemove.textContent = "Remove";
                actionRemove.addEventListener("click", () => removeFile(itemId));
                actions.appendChild(actionRemove);

                const itemFile = document.createElement("li");
                itemFile.appendChild(itemButton);
                itemFile.appendChild(actions);

                return itemFile;
            }

            function createDirectoryInTree(directoryInfo, meta = null) {
                const dirName = directoryInfo.name.split("/").pop() || directoryInfo.name; // Extract only the directory name without path

                const dirItem = document.createElement("li");
                dirItem.setAttribute("data-full-path", directoryInfo.name);
                dirItem.setAttribute("data-loaded", "false");
                dirItem.textContent = dirName;

                const subList = document.createElement("ul");
                dirItem.appendChild(subList);

                if (meta === null) {
                    meta = { seqNo: 0 };
                }

                // Only process the listing if it exists (for initially loaded directories)
                if (directoryInfo.listing && directoryInfo.listing.length > 0) {
                    directoryInfo.listing.forEach((entry) => {
                        if (entry.type === "dir") {
                            // For subdirectories, create placeholder without listing to enable lazy loading
                            subList.appendChild(createDirectoryInTree({ name: entry.name, type: "dir" }, meta));
                        } else {
                            subList.appendChild(createFileInTree(entry, meta.seqNo));
                            ++meta.seqNo;
                        }
                    });
                    dirItem.setAttribute("data-loaded", "true");
                }

                return dirItem;
            }

            async function listRootFiles(id) {
                try {
                    const items = await restClient.listAllFiles("/");
                    const menuEl = document.getElementById(id);
                    menuEl.replaceChildren();

                    // Create root directory structure with only first-level contents
                    const rootDir = { name: "/", type: "dir", listing: items };
                    const rootItem = createDirectoryInTree(rootDir);

                    // Append the root's children (its <ul>) directly into the tree container.
                    Array.from(rootItem.children).forEach((child) => menuEl.appendChild(child));

                    initFileTree(menuEl);
                } catch (rsp) {
                    const alertMsg = (typeof rsp === "string") ? rsp : rsp.error.msg;
                    await dialog.showError("<p>" + alertMsg + "</p>");
                }
            }

            async function loadDirectoryContents(dirPath, dirElement) {
                try {
                    const items = await restClient.listAllFiles(dirPath);
                    const subList = dirElement.querySelector(":scope > ul");
                    const meta = {
                        seqNo: document.querySelectorAll('#fileTree a[id^="file"]').length // Continue numbering from existing files
                    };

                    // Clear any existing placeholder content
                    subList.replaceChildren();

                    // Add the directory contents
                    items.forEach((entry) => {
                        if (entry.type === "dir") {
                            // For subdirectories, create without listing to enable lazy loading
                            subList.appendChild(createDirectoryInTree({ name: entry.name, type: "dir" }, meta));
                        } else {
                            subList.appendChild(createFileInTree(entry, meta.seqNo));
                            ++meta.seqNo;
                        }
                    });

                    // Mark as loaded and reinitialize tree functionality for new elements
                    dirElement.setAttribute("data-loaded", "true");
                    initFileTree(document.getElementById("fileTree"));
                } catch (rsp) {
                    const alertMsg = (typeof rsp === "string") ? rsp : rsp.error.msg;
                    await dialog.showError("<p>" + alertMsg + "</p>");
                }
            }

            async function editFile(id) {
                const filename = document.getElementById(id).getAttribute("data-full-path"); // Use full path from data attribute

                loadedFile = filename;
                editor.setValue("");
                setEditorMode(filename);
                bootstrap.Collapse.getOrCreateInstance(document.getElementById("editor")).show();
                bootstrap.Collapse.getOrCreateInstance(document.getElementById("preview")).hide();
                document.getElementById("fileName").textContent = loadedFile;

                try {
                    await dialog.show("Loading file", "<p>Please wait, its loading.</p>");

                    const rsp = await restClient.readFile(filename);

                    /* Fill content in, remove selection and move cursor to the begin. */
                    editor.setValue(rsp, -1);

                    await dialog.hide();
                } catch (rsp) {
                    await dialog.showError("<p>" + rsp.error.msg + "</p>");
                }
            }

            function previewFile(id) {
                const filename = document.getElementById(id).getAttribute("data-full-path"); // Use full path from data attribute

                loadedFile = "";
                editor.setValue("");

                const image = document.createElement("img");
                image.src = filename;
                image.alt = filename;

                const preview = document.getElementById("preview");
                preview.replaceChildren(image);

                bootstrap.Collapse.getOrCreateInstance(document.getElementById("editor")).hide();
                bootstrap.Collapse.getOrCreateInstance(preview).show();
            }

            async function removeFile(id) {
                const item = document.getElementById(id);
                const filename = item.getAttribute("data-full-path"); // Use full path from data attribute

                try {
                    await restClient.removeFile(filename);

                    if (loadedFile === filename) {
                        loadedFile = "";
                        editor.setValue("");
                    }
                    item.parentElement.remove();

                    await dialog.showInfo("<p>File " + filename + " removed.</p>");
                } catch (rsp) {
                    await dialog.showError("<p>" + rsp.error.msg + "</p>");
                }
            }

            function getFileTypeInfo(filename) {
                let info = null;
                let index = 0;

                while ((supportedFileTypes.length > index) && (null === info)) {
                    if (true === filename.endsWith("." + supportedFileTypes[index].name)) {
                        info = supportedFileTypes[index];
                    }
                    ++index;
                }

                return info;
            }

            function setEditorMode(filename) {
                const prefix = "ace/mode/";
                let mode = prefix + "plain_text";
                const fileTypeInfo = getFileTypeInfo(filename);

                if ((null !== fileTypeInfo) &&
                    (null !== fileTypeInfo.lang)) {
                    mode = prefix + fileTypeInfo.lang;
                }

                editor.getSession().setMode(mode);
            }

            async function upload() {
                const fileCnt = document.getElementById("uploadFile").files.length;
                const dstDirectoryName = document.getElementById("directory").value;

                if (fileCnt !== 1) {
                    return;
                }

                const file = document.getElementById("uploadFile").files[0];
                const fullPath = dstDirectoryName + "/" + file.name;

                try {
                    await restClient.writeFile(fullPath, file, "application/octet-stream");
                    await dialog.showInfo("<p>File " + file.name + " uploaded.</p>");
                    await listRootFiles("fileTree");
                } catch (rsp) {
                    await dialog.showError("<p>" + rsp.error.msg + "</p>");
                }
            }

            async function saveCurrentFile() {
                if (0 === loadedFile.length) {
                    await dialog.showInfo("<p>Please select a text file to edit first.</p>");
                    return;
                }

                try {
                    await dialog.show("Saving file", "<p>Please wait, its saving.</p>");
                    await restClient.writeFile(loadedFile, editor.getValue(), "text/plain");
                } finally {
                    dialog.hide();
                }
            }

            function undoInEditor() {
                if (null !== editor) {
                    editor.getSession().getUndoManager().undo(false);
                }
            }

            function redoInEditor() {
                if (null !== editor) {
                    editor.getSession().getUndoManager().redo(false);
                }
            }

            function filterFileTree() {
                const query = document.getElementById("fileFilter").value.trim().toLowerCase();
                const tree = document.getElementById("fileTree");

                if (0 === query.length) {
                    tree.querySelectorAll("li").forEach((li) => setVisible(li, true));
                    return;
                }

                tree.querySelectorAll('a[id^="file"]').forEach((anchor) => {
                    const fileItem = anchor.closest("li");
                    const isMatch = anchor.textContent.toLowerCase().includes(query);
                    setVisible(fileItem, isMatch);
                });

                Array.from(tree.querySelectorAll("li")).reverse().forEach((dirItem) => {
                    const childrenList = dirItem.querySelector(":scope > ul");

                    if (childrenList !== null) {
                        /* Own text = the directory's own text nodes, excluding child elements. */
                        let ownText = "";
                        dirItem.childNodes.forEach((node) => {
                            if (node.nodeType === Node.TEXT_NODE) {
                                ownText += node.textContent;
                            }
                        });
                        ownText = ownText.trim().toLowerCase();

                        const hasVisibleChildren = Array.from(childrenList.children).some(
                            (child) => (child.tagName.toLowerCase() === "li") && isVisible(child)
                        );
                        const ownMatch = ownText.includes(query);

                        setVisible(dirItem, ownMatch || hasVisibleChildren);
                    }
                });
            }

            async function refreshFileTree() {
                try {
                    await dialog.show("Refreshing files", "<p>Please wait, file information is loading.</p>");
                    await listRootFiles("fileTree");
                } finally {
                    dialog.hide();
                }
            }

            /* Collect the elements toggled when expanding/collapsing a branch:
             * the element children of each non-<i> child of the branch (i.e. the
             * directory entries inside the branch's <ul>). */
            function branchEntryElements(branch) {
                const result = [];

                Array.from(branch.children).forEach((child) => {
                    if (child.tagName.toLowerCase() !== "i") {
                        Array.from(child.children).forEach((grandChild) => result.push(grandChild));
                    }
                });

                return result;
            }

            function setBranchEntriesVisible(branch, visible) {
                branchEntryElements(branch).forEach((el) => setVisible(el, visible));
            }

            function toggleBranchEntries(branch) {
                branchEntryElements(branch).forEach((el) => setVisible(el, el.style.display === "none"));
            }

            function toggleBranch(branch) {
                const icon = branch.querySelector(":scope > i.tree-icon svg");
                const isCurrentlyCollapsed = icon.classList.contains("rotate270");
                const dirPath = branch.getAttribute("data-full-path");
                const isLoaded = branch.getAttribute("data-loaded") === "true";

                // If expanding (currently collapsed) a directory that hasn't been loaded yet, load its contents
                if (isCurrentlyCollapsed && dirPath && !isLoaded) {
                    dialog.show("Loading directory", "<p>Please wait, loading directory contents...</p>")
                        .then(() => loadDirectoryContents(dirPath, branch))
                        .then(() => {
                            // After loading, toggle the visual state
                            icon.classList.remove("rotate270");
                            setBranchEntriesVisible(branch, true);
                        })
                        .finally(() => dialog.hide());
                } else {
                    // Normal toggle behavior for already loaded directories
                    icon.classList.toggle("rotate270");
                    toggleBranchEntries(branch);
                }
            }

            /* Vanilla replacement for the former jQuery "treed" plugin. Idempotent:
             * safe to call again after new branches are lazily loaded. */
            function initFileTree(tree) {
                tree.classList.add("tree");

                // Initialize each branch (an <li> that directly contains a <ul>).
                tree.querySelectorAll("li").forEach((branch) => {
                    if (branch.querySelector(":scope > ul") === null) {
                        return;
                    }

                    // Only add icon + handler if it doesn't already exist.
                    if (branch.querySelector(":scope > i.tree-icon") === null) {
                        const icon = document.createElement("i");
                        icon.className = "tree-icon";
                        icon.innerHTML = '<svg class="rotate270 bg-white" xmlns="http://www.w3.org/2000/svg" width="13" height="10" viewBox="0 0 13 10"><polygon points="2 1, 12 1, 7 9"></polygon></svg>';
                        branch.prepend(icon);
                        branch.classList.add("branch");

                        branch.addEventListener("click", (e) => {
                            if (branch === e.target) {
                                toggleBranch(branch);
                            }
                        });

                        // Initially hide children unless already loaded.
                        if (branch.getAttribute("data-loaded") !== "true") {
                            setBranchEntriesVisible(branch, false);
                        }
                    }
                });

                // Toggle from the icon (and its SVG); bind once per element.
                tree.querySelectorAll(".branch > i.tree-icon").forEach((icon) => {
                    if (icon.dataset.treeBound === "true") {
                        return;
                    }
                    icon.dataset.treeBound = "true";

                    icon.addEventListener("click", (e) => {
                        e.stopPropagation();
                        toggleBranch(icon.closest("li"));
                    });

                    const svg = icon.querySelector("svg");
                    if (svg !== null) {
                        svg.addEventListener("click", (e) => {
                            e.stopPropagation();
                            toggleBranch(svg.closest("li"));
                        });
                    }
                });

                // Open the branch if it directly contains an anchor or button.
                tree.querySelectorAll(".branch > a, .branch > button").forEach((el) => {
                    if (el.dataset.treeBound === "true") {
                        return;
                    }
                    el.dataset.treeBound = "true";

                    el.addEventListener("click", (e) => {
                        el.closest("li").click();
                        e.preventDefault();
                    });
                });
            }

            document.addEventListener("DOMContentLoaded", async () => {
                menu.addSubMenu(menu.data, "Plugins", pluginSubMenu);
                menu.addSubMenu(menu.data, "Services", serviceSubMenu);
                menu.create("menu", menu.data);

                document.getElementById("fileFilter").addEventListener("input", filterFileTree);
                document.getElementById("refreshTree").addEventListener("click", refreshFileTree);
                document.getElementById("btnUpload").addEventListener("click", upload);
                document.getElementById("btnSave").addEventListener("click", saveCurrentFile);
                document.getElementById("btnUndo").addEventListener("click", undoInEditor);
                document.getElementById("btnRedo").addEventListener("click", redoInEditor);

                ace.config.set("basePath", "https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.6");
                editor = ace.edit("editor");
                editor.setTheme("ace/theme/textmate");
                editor.session.setUseSoftTabs(true);
                editor.session.setTabSize(4);
                editor.setShowPrintMargin(false);
                editor.setHighlightActiveLine(true);
                editor.setAutoScrollEditorIntoView(true);
                editor.setOptions({ maxLines: Infinity });
                editor.commands.addCommand({
                    name: "saveCommand",
                    bindKey: { win: "Ctrl-S", mac: "Command-S" },
                    exec: () => saveCurrentFile(),
                    readOnly: false
                });
                editor.commands.addCommand({
                    name: "undoCommand",
                    bindKey: { win: "Ctrl-Z", mac: "Command-Z" },
                    exec: () => undoInEditor(),
                    readOnly: false
                });
                editor.commands.addCommand({
                    name: "redoCommand",
                    bindKey: { win: "Ctrl-Shift-Z", mac: "Command-Shift-Z" },
                    exec: () => redoInEditor(),
                    readOnly: false
                });

                try {
                    await dialog.show("Loading ...", "<p>Please wait, file information is loading.</p>");
                    await listRootFiles("fileTree");
                } finally {
                    dialog.hide();
                }
            });
        </script>
    </body>

</html>
