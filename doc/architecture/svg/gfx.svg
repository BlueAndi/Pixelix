tyle="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.0469" x="2210" y="1363.1045">The canvas ensures that all graphic operation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.1206" x="2210" y="1379.4561">will be performed only inside the canvas.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.1396" x="2210" y="1395.8076">It defines the window size and the offset.</text></g><g class="entity" data-qualified-name="GMN32" data-source-line="111" id="ent0033"><path d="M781.5,2002.1094 L781.5,2110.2188 A0,0 0 0 0 781.5,2110.2188 L988.9624,2110.2188 A0,0 0 0 0 988.9624,2110.2188 L988.9624,2060.1094 L1023.21,2056.1094 L988.9624,2052.1094 L988.9624,2012.1094 L978.9624,2002.1094 L781.5,2002.1094 A0,0 0 0 0 781.5,2002.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M978.9624,2002.1094 L978.9624,2012.1094 L988.9624,2012.1094 L978.9624,2002.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.4707" x="787.5" y="2020.6045">Basic graphics operations,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.9097" x="787.5" y="2036.9561">independend of the color type.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.9897" x="787.5" y="2053.3076">Color manipulations are not part</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4624" x="787.5" y="2069.6592">of the GFX and shall be handled</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.2598" x="787.5" y="2086.0107">in higher layers, where the color</text><text fill="#000000" font-family