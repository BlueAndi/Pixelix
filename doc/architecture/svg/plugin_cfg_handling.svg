"#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.1104" x="340" y="480.9717">The topic handler would be able to read the configuration</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.4478" x="340" y="497.3232">from the filesystem. But this shall be avoided because of</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.4077" x="340" y="513.6748">slow flash access and to avoid that plugin has internally</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9478" x="340" y="530.0264">a different configuration than stored in the filesystem.</text><g class="message" data-entity-1="part1" data-entity-2="part4" id="msg12"><polygon fill="#181818" points="929.6714,561.2344,939.6714,565.2344,929.6714,569.2344,933.6714,565.2344" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="513.7515" x2="935.6714" y1="565.2344" y2="565.2344"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.1289" x="520.7515" y="560.3779">Read configuration</text></g><g class="message" data-entity-1="part4" data-entity-2="part1" id="msg13"><polygon fill="#181818" points="524.7515,591.5859,514.7515,595.5859,524.7515,599.5859,520.7515,595.5859" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="518.7515" x2="945.6714" y1="595.5859" y2="595.5859"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.9517" x="530.7515" y="590.7295">Configuration as JSON</text></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg14"><polygon fill="#181818" points="11,621.9375,1,625.9375,11,629.9375,7,625.9375" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="5" x2="507.7515" y1="625.9375" y2="625.9375"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.9517" x="17" y="621.0811">Configuration as JSON</text></g><path d="M466,638.9375 L466,664.9375 L1277,664.9375 L1277,648.9375 L1267,638.9375 L466,638.9375" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1267,638.9375 L1267,648.9375 L1277,648.9375 L1267,638.9375" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.0698" x="769.5251" y="657.4326">Write configuration via REST API.</text><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg15"><polygon fill="#181818" points="491.7515,688.6406,501.7515,692.6406,491.7515,696.6406,495.7515,692.6406" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="0" x2="497.7515" y1="692.6406" y2="692.6406"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="484.7515" x="7" y="687.7842">POST /rest/api/v1/display/uid/&lt;PLUGIN-UID&gt;/&lt;PLUGIN-SPECIFIC-URI&gt; with JSON</text></g><path d="M771,705.6406 L771,747.6406 L1121,747.6406 L1121,715.6406 L1111,705.6406 L771,705.6406" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1111,705.6406 L1111,715.6406 L1121,715.6406 L1111,705.6406" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.0942" x="777" y="724.1357">Don't write configuration to flash, because flash access is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.9224" x="777" y="740.4873">slow. It shall be written during plugin processing.</text><g class="message" data-entity-1="part1" data-entity-2="part4" id="msg16"><polygon fill="#181818" points="929.6714,771.6953,939.6714,775.6953,929.6714,779.6953,933.6714,775.6953" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="513.7515" x2="935.6714" y1="775.6953" y2="775.6953"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108.3799" x="520.7515" y="770.8389">Write configuration</text></g><g class="message" data-entity-1="part4" data-entity-2="part1" id="msg17"><polygon fill="#181818" points="524.7515,785.6953,514.7515,789.6953,524.7515,793.6953,520.7515,789.6953" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="518.7515" x2="945.6714" y1="789.6953" y2="789.6953"/></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg18"><polygon fill="#181818" points="11,799.6953,1,803.6953,11,807.6953,7,803.6953" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="5" x2="507.7515" y1="803.6953" y2="803.6953"/></g><path d="M813,816.6953 L813,858.6953 L1079,858.6953 L1079,826.6953 L1069,816.6953 L813,816.6953" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1069,816.6953 L1069,826.6953 L1079,826.6953 L1069,816.6953" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.1333" x="819" y="835.1904">Store configuration triggered by previous</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.6606" x="819" y="851.542">REST API call for writing the configuration.</text><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg19"><polygon fill="#181818" points="851.2061,882.75,861.2061,886.75,851.2061,890.75,855.2061,886.75" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="0" x2="857.2061" y1="886.75" y2="886.75"/><text