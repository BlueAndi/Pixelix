ead the configuration from &lt;PLUGIN-UID&gt;.json</text></g><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg5"><polygon fill="#181818" points="962.3813,253.9766,952.3813,257.9766,962.3813,261.9766,958.3813,257.9766" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="956.3813" x2="1256.1792" y1="257.9766" y2="257.9766"/></g><path d="M881.5195,272.9766 L946.7305,272.9766 L946.7305,281.3281 L936.7305,291.3281 L881.5195,291.3281 L881.5195,272.9766" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="115.4063" style="stroke:#000000;stroke-width:1.5;" width="430.5884" x="881.5195" y="272.9766"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="20.2109" x="896.5195" y="287.4717">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="62.3477" x="961.7305" y="286.3955">[read failed]</text><path d="M901,296.3281 L901,338.3281 L1302,338.3281 L1302,306.3281 L1292,296.3281 L901,296.3281" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1292,296.3281 L1292,306.3281 L1302,306.3281 L1292,296.3281" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.8169" x="969.1455" y="314.8232">If the configuration is not available or invalid,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.2598" x="969.1455" y="331.1748">an initial configuration is written.</text><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg6"><polygon fill="#181818" points="1240.1792,362.3828,1250.1792,366.3828,1240.1792,370.3828,1244.1792,366.3828" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="951.3813" x2="1246.1792" y1="366.3828" y2="366.3828"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.8906" x="958.3813" y="361.5264">Write the configuration to &lt;PLUGIN-UID&gt;.json</text></g><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg7"><polygon fill="#181818" points="962.3813,376.3828,952.3813,380.3828,962.3813,384.3828,958.3813,380.3828" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="956.3813" x2="1256.1792" y1="380.3828" y2="380.3828"/></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg8"><polygon fill="#181818" points="806.936,397.3828,796.936,401.3828,806.936,405.3828,802.936,401.3828" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="800.936" x2="945.3813" y1="401.3828" y2="401.3828"/></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg9"><polygon fill="#181818" points="566.2607,411.3828,556.2607,415.3828,566.2607,419.3828,562.2607,415.3828" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="560.2607" x2="789.936" y1="415.3828" y2="415.3828"/></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg10"><polygon fill="#181818" points="11,425.3828,1,429.3828,11,433.3828,7,429.3828" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="5" x2="549.2607" y1="429.3828" y2="429.3828"/></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1322.1079" x="0" y="458.5586"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1322.1079" y1="458.5586" y2="458.5586"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1322.1079" y1="461.5586" y2="461.5586"/><rect fill="#EEEEEE" height="24.3516" style="stroke:#000000;stroke-width:2;" width="244.4199" x="538.844" y="447.3828"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="226.8081" x="544.844" y="464.8779">Read the configuration via REST API</text><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg11"><polygon fill="#181818" points="411.606,500.0859,421.606,504.0859,411.606,508.0859,415.606,504.0859" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="0" x2="417.606" y1="504.0859" y2="504.0859"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="395.9351" x="7" y="499.2295">GET /rest/api/v1/display/plugin/&lt;PLUGIN-ALIAS&gt;/&lt;PLUGIN-TOPIC&gt;</text></g><path d="M247,517.0859 L247,592.0859 L609,592.0859 L609,527.0859 L599,517.0859 L247,517.0859" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M599,517.0859 L599,527.0859 L609,527.0859 L599,517.0859" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.8022" x="253" y="535.5811">The topic handler could read the configuration from the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.7578" x="253" y="551.9326">filesystem. This is avoided on purpose: flash access is slow</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.5913" x="253" y="568.2842">and the plugin could hold a configuration in memory which</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="155.3525" x="253" y="584.6357">differs from the stored one.</text><g class="message" data-entity-1="part1" data-entity-2="part4" id="msg12"><polygon fill="#181818" points="929.3813,615.8438,939.3813,619.8438,929.3813,623.8438,933.3813,619.8438" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="433.606" x2="935.3813" y1="619.8438" y2="619.8438"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.2808" x="440.606" y="614.9873">getTopic(topic, value)</text></g><g class="message" data-entity-1="part4" data-entity-2="part1" id="msg13"><polygon fill="#181818" points="444.606,646.1953,434.606,650.1953,444.606,654.1953,440.606,650.1953" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="438.606" x2="945.3813" y1="650.1953" y2="650.1953"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.0635" x="450.606" y="645.3389">configuration as JSON</text></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg14"><polygon fill="#181818" points="11,676.5469,1,680.5469,11,684.5469,7,680.5469" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="5" x2="427.606" y1="680.5469" y2="680.5469"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130.0635" x="17" y="675.6904">configuration as JSON</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1322.1079" x="0" y="709.7227"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1322.1079" y1="709.7227" y2="709.7227"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1322.1079" y1="712.7227" y2="712.7227"/><rect fill="#EEEEEE" height="24.3516" style="stroke:#000000;stroke-width:2;" width="245.1309" x="538.4885" y="698.5469"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="227.519" x="544.4885" y="716.042">Write the configuration via REST API</text><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg15"><polygon fill="#181818" points="411.606,751.25,421.606,755.25,411.606,759.25,415.606,755.25" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="0" x2="417.606" y1="755.25" y2="755.25"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.606" x="7" y="750.3936">POST /rest/api/v1/display/plugin/&lt;PLUGIN-ALIAS&gt;/&lt;PLUGIN-TOPIC&gt;</text></g><path d="M772,768.25 L772,827.25 L1118,827.25 L1118,778.25 L1108,768.25 L772,768.25" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1108,768.25 L1108,778.25 L1118,778.25 L1108,768.25" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.5659" x="778" y="786.7451">The configuration is not written to flash here, because</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.8633" x="778" y="803.0967">flash access is slow and this runs in the web server task.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.8042" x="778" y="819.4482">It is written during plugin processing instead.</text><g class="message" data-entity-1="part1" data-entity-2="part4" id="msg16"><polygon fill="#181818" points="929.3813,850.6563,939.3813,854.6563,929.3813,858.6563,933.3813,854.6563" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="433.606" x2="935.3813" y1="854.6563" y2="854.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.5508" x="440.606" y="849.7998">setTopic(topic, value)</text></g><g class="message" data-entity-1="part4" data-entity-2="part1" id="msg17"><polygon fill="#181818" points="444.606,864.6563,434.606,868.6563,444.606,872.6563,440.606,868.6563" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="438.606" x2="945.3813" y1="868.6563" y2="868.6563"/></g><g class="message" data-entity-1="part1" data-entity-2="part1" id="msg18"><polygon fill="#181818"