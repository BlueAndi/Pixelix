36" y="1222.9639">stop()</text></g><path d="M901,1240.8203 L901,1266.8203 L1302,1266.8203 L1302,1250.8203 L1292,1240.8203 L901,1240.8203" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1292,1240.8203 L1292,1250.8203 L1302,1250.8203 L1292,1240.8203" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.0415" x="948.0332" y="1259.3154">Don't waste flash space with unused configurations.</text><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg28"><polygon fill="#181818" points="1240.1792,1290.5234,1250.1792,1294.5234,1240.1792,1298.5234,1244.1792,1294.5234" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="951.3813" x2="1246.1792" y1="1294.5234" y2="1294.5234"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.5151" x="958.3813" y="1289.667">Remove the configuration &lt;PLUGIN-UID&gt;.json</text></g><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg29"><polygon fill="#181818" points="962.3813,1304.5234,952.3813,1308.5234,962.3813,1312.5234,958.3813,1308.5234" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="956.3813" x2="1256.1792" y1="1308.5234" y2="1308.5234"/></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg30"><polygon fill="#181818" points="806.936,1318.5234,796.936,1322.5234,806.936,1326.5234,802.936,1322.5234" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="800.936" x2="945.3813" y1="1322.5234" y2="1322.5234"/></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg31"><polygon fill="#181818" points="566.2607,1332.5234,556.2607,1336.5234,566.2607,1340.5234,562.2607,1336.5234" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-wi