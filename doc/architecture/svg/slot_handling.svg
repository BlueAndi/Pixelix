<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="710px" preserveAspectRatio="none" style="width:879px;height:710px;background:#FFFFFF;" version="1.1" viewBox="0 0 879 710" width="879px" zoomAndPan="magnify"><title>Slot handling</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="88.6553" x="388.5155" y="24.5332">Slot handling</text></g><g class="entity" data-qualified-name="idle" id="ent0002"><rect fill="#F1F1F1" height="67.7969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="433.877" x="50.07" y="505.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="50.07" x2="483.947" y1="533.2188" y2="533.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="22.5723" x="255.7223" y="525.1426">Idle</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="413.877" x="55.07" y="550.6758">/do Find next slot with enabled plugin (for last active slot + 1 to last active slot)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="114.0645" x="55.07" y="565.7695">/exit Select found slot</text></g><g class="entity" data-qualified-name="fadeIn" id="ent0003"><rect fill="#F1F1F1" height="52.7031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="154.748" x="476.57" y="651.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="476.57" x2="631.318" y1="679.2188" y2="679.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="43.5859" x="532.1511" y="671.1426">FadeIn</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.748" x="481.57" y="696.6758">/entry Fade next plugin in</text></g><g class="entity" data-qualified-name="active" id="ent0004"><rect fill="#F1F1F1" height="82.8906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="232.4316" x="281.07" y="148.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="281.07" x2="513.5016" y1="176.2188" y2="176.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.124" x="378.2238" y="168.1426">Active</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.4316" x="286.07" y="193.6758">/entry If slot duration &gt; 0 then start timer</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="85.3945" x="286.07" y="208.7695">/do Show plugin</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="80.0273" x="286.07" y="223.8633">/exit Stop timer</text></g><g class="entity" data-qualified-name="fadeOut" id="ent0005"><rect fill="#F1F1F1" height="52.7031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="171.4355" x="242.57" y="358.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="242.57" x2="414.0055" y1="386.2188" y2="386.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.4756" x="301.05" y="378.1426">FadeOut</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.4355" x="247.57" y="403.6758">/do Fade previous plugin out</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="15" id="ent0002"><ellipse cx="89.07" cy="385.1094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="30" id="ent0003"><path d="M197.07,44.6094 L197.07,87.3125 A0,0 0 0 0 197.07,87.3125 L393.07,87.3125 L397.07,148.5294 L401.07,87.3125 L597.4313,87.3125 A0,0 0 0 0 597.4313,87.3125 L597.4313,54.6094 L587.4313,44.6094 L197.07,44.6094 A0,0 0 0 0 197.07,44.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M587.4313,44.6094 L587.4313,54.6094 L597.4313,54.6094 L587.4313,44.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="379.3613" x="203.07" y="63.1045">If user configures a slot duration of 0 ms, the timer is disabled and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.1587" x="203.07" y="79.4561">the slot will stay active until other conditions appear.</text></g><!--link *start* to idle--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="15" id="lnk3"><path d="M85.79,394.7194 C79.87,411.8994 69.53,450.8894 87.07,475.6094 C95.69,487.7594 101.7719,494.3778 114.3019,502.3178" fill="none" id="*start*-to-idle" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="119.37,505.5294,113.9089,497.3333,115.1466,502.8531,109.6268,504.0908,119.37,505.5294" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.9644" x="88.07" y="464.1045">set last active slot to last slot in list</text></g><!--link idle to fadeIn--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="17" id="lnk4"><path d="M293.15,573.9694 C307.68,590.4994 327.06,609.4594 348.07,621.6094 C387.35,644.3194 430.3175,656.8279 470.5975,664.9179" fill="none" id="idle-to-fadeIn" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="476.48,666.0994,468.4439,660.4055,471.5779,665.1148,466.8686,668.2489,476.48,666.0994" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.5151" x="349.07" y="618.1045">[slot with enabled plugin found]</text></g><!--link fadeIn to active--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="19" id="lnk5"><path d="M597.95,651.4994 C626.26,633.0194 661.97,605.7294 685.07,573.6094 C796.2,419.0794 834.46,335.5794 773.07,261.6094 C740.46,222.3194 617.3813,205.2723 519.4813,197.5323" fill="none" id="fadeIn-to-active" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="513.5,197.0594,522.1567,201.7563,518.4844,197.4534,522.7873,193.7811,513.5,197.0594" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.6162" x="769.07" y="464.1045">[fade in complete]</text></g><!--link active to fadeOut--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="21" id="lnk6"><path d="M280.92,197.3194 C184.17,205.2094 57.2,222.8194 25.07,261.6094 C6.07,284.5394 6,305.7394 25.07,328.6094 C39,345.3194 151.7285,362.4583 236.3385,373.2783" fill="none" id="active-to-fadeOut" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="242.29,374.0394,233.8701,368.9301,237.3304,373.4051,232.8553,376.8654,242.29,374.0394" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="117.0698" x="64.3718" y="284.1045">[plugin disabled] OR</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.5635" x="48.1249" y="300.4561">[plugin removed from slot]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.6733" x="26.07" y="316.8076">select next slot with enable plugin</text></g><!--link active to fadeOut--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="22" id="lnk7"><path d="M288.2,231.6794 C277.07,239.9694 267.24,249.8494 260.07,261.6094 C244.56,287.0294 247.3,301.7094 260.07,328.6094 C265.62,340.3094 270.3371,346.5589 280.3671,354.7689" fill="none" id="active-to-fadeOut-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="285.01,358.5694,280.5792,349.7734,281.1409,355.4023,275.512,355.964,285.01,358.5694" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="80.9136" x="334.0712" y="276.1045">[timeout] AND</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.916" x="261.07" y="292.4561">[next slot contains enabled plugin] AND</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.1543" x="280.9509" y="308.8076">[next slot __is not__ current slot]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.9854" x="331.5353" y="325.1592">select next slot</text></g><!--link active to fadeOut--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="23" id="lnk8"><path d="M468.19,231.6094 C477.82,240.2294 486.34,250.2294 492.07,261.6094 C505.45,288.2094 509.42,304.4094 492.07,328.6094 C473.85,354.0094 449.1745,366.4489 419.4045,374.0289" fill="none" id="active-to-fadeOut-2" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="413.59,375.5094,423.2987,377.165,418.4354,374.2756,421.3247,369.4123,413.59,375.5094" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.188" x="551.0585" y="276.1045">[slot requested by user] AND</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.165" x="504.07" y="292.4561">[requested slot contains enabled plugin] AND</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.4033" x="523.9509" y="308.8076">[requested slot __is not__ current slot]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.2344" x="574.5353" y="325.1592">select requested slot</text></g><!--link active to active--><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" data-link-type="dependency" data-source-line="24" id="lnk9"><path d="M513.24,177.4294 C533.76,179.0994 548.07,183.3194 548.07,190.1094 C548.07,196.8994 539.7402,200.6327 519.2202,202.3027" fill="none" id="active-to-active" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="513.24,202.7894,522.5348,206.0462,518.2235,202.3838,521.8859,198.0725,513.24,202.7894" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.2427" x="640.0617" y="171.1045">([timeout] AND</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.916" x="569.225" y="187.4561">[next slot contains enabled plugin] AND</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.2261" x="554.07" y="203.8076">[next slot __is same__ than current slot]) OR</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158.2534" x="603.5563" y="220.1592">[slot duration re-configured]</text></g><!--link fadeOut to idle--><g class="link" data-entity-1="ent0005" data-entity-2="ent0002" data-link-type="dependency" data-source-line="26" id="lnk10"><path d="M317.86,411.6394 C307.55,437.4094 293.7973,471.7681 282.5273,499.9581" fill="none" id="fadeOut-to-idle" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="280.3,505.5294,287.3552,498.6574,282.1561,500.8867,279.9268,495.6876,280.3,505.5294" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-siz