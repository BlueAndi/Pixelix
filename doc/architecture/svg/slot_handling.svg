<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="735px" preserveAspectRatio="none" style="width:1263px;height:735px;background:#FFFFFF;" version="1.1" viewBox="0 0 1263 735" width="1263px" zoomAndPan="magnify"><title>Slot Handling</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="90.2139" x="579.7831" y="24.5332">Slot Handling</text></g><g class="entity" data-qualified-name="idle" id="ent0002"><rect fill="#F1F1F1" height="82.8906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="257.4922" x="839.5" y="158.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="839.5" x2="1096.9922" y1="186.2188" y2="186.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="22.5723" x="956.96" y="178.1426">Idle</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="237.4922" x="844.5" y="203.6758">do / Find the next slot with an enabled plugin</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="226.4121" x="844.5" y="218.7695">(from last active slot + 1 to last active slot).</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="140.748" x="844.5" y="233.8633">exit / Select the found slot.</text></g><g class="entity" data-qualified-name="fadeIn" id="ent0003"><rect fill="#F1F1F1" height="52.7031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="181.4316" x="767.5" y="319.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="767.5" x2="948.9316" y1="347.2188" y2="347.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="43.5859" x="836.4229" y="339.1426">FadeIn</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="161.4316" x="772.5" y="364.6758">entry / Fade the next plugin in.</text></g><g class="entity" data-qualified-name="active" id="ent0004"><rect fill="#F1F1F1" height="82.8906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="255.7754" x="218" y="466.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="218" x2="473.7754" y1="494.2188" y2="494.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.124" x="326.8257" y="486.1426">Active</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.7754" x="223" y="511.6758">entry / If the slot duration &gt; 0, start the timer.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.0781" x="223" y="526.7695">do / Show the plugin.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.7109" x="223" y="541.8633">exit / Stop the timer.</text></g><g class="entity" data-qualified-name="fadeOut" id="ent0005"><rect fill="#F1F1F1" height="52.7031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="198.1191" x="493" y="676.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="493" x2="691.1191" y1="704.2188" y2="704.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.4756" x="564.8218" y="696.1426">FadeOut</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.1191" x="498" y="721.6758">do / Fade the previous plugin out.</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="22" id="ent0002"><ellipse cx="968" cy="54.6094" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN2" data-source-line="37" id="ent0003"><path d="M139.5,324.6094 L139.5,367.3125 A0,0 0 0 0 139.5,367.3125 L342,367.3125 L346,466.3094 L350,367.3125 L552.1885,367.3125 A0,0 0 0 0 552.1885,367.3125 L552.1885,334.6094 L542.1885,324.6094 L139.5,324.6094 A0,0 0 0 0 139.5,324.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M542.1885,324.6094 L542.1885,334.6094 L552.1885,334.6094 L542.1885,324.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.6587" x="145.5" y="343.1045">If the user configures a slot duration of 0 ms, the timer stays</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="391.6885" x="145.5" y="359.4561">disabled and the slot remains active until another condition appears.</text></g><!--link *start* to idle--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="22" id="lnk3"><path d="M968,65.0294 C968,83.6694 968,120.2694 968,152.4794" fill="none" id="*start*-to-idle" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="968,158.4794,972,149.4794,968,153.4794,964,149.4794,968,158.4794" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.5044" x="970.8091" y="109.1045">/ set the last active slot</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.1226" x="969" y="125.4561">to the last slot in the list</text></g><!--link idle to fadeIn--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="24" id="lnk4"><path d="M880.9,241.7894 C870.54,250.1994 861.39,260.0794 855,271.6094 C847.01,286.0194 846.7228,298.6724 849.5128,313.5324" fill="none" id="idle-to-fadeIn" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="850.62,319.4294,852.8906,309.8458,849.6974,314.5152,845.0279,311.322,850.62,319.4294" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.5869" x="856" y="286.1045">[slot with an enabled plugin found]</text></g><!--link fadeIn to active--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="26" id="lnk5"><path d="M776.31,372.6394 C695,398.0494 574.7368,435.6296 480.0568,465.2196" fill="none" id="fadeIn-to-active" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="474.33,467.0094,484.1134,468.1426,479.1024,465.5179,481.7271,460.5068,474.33,467.0094" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.6162" x="679" y="425.1045">[fade in complete]</text></g><!--link active to fadeOut--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="28" id="lnk6"><path d="M217.81,521.0694 C139.69,531.3094 50.32,549.3494 26,579.6094 C7.35,602.8194 6,624.5494 26,646.6094 C56.7,680.4594 332.9833,694.1803 486.9333,699.2903" fill="none" id="active-to-fadeOut" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="492.93,699.4894,484.0677,695.193,487.9328,699.3235,483.8023,703.1886,492.93,699.4894" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="109.1289" x="92.7649" y="602.1045">[plugin disabled] or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.7871" x="68.9358" y="618.4561">[plugin removed from slot] /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.6587" x="27" y="634.8076">select the next slot with an enabled plugin</text></g><!--link active to fadeOut--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="29" id="lnk7"><path d="M317.17,549.8494 C299.98,579.5694 285.49,619.2694 308,646.6094 C331.31,674.9194 414.4369,688.4215 486.6969,695.2915" fill="none" id="active-to-fadeOut-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="492.67,695.8594,484.089,691.0255,487.6924,695.3861,483.3318,698.9896,492.67,695.8594" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.1563" x="391.0371" y="594.1045">[timeout] and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.2305" x="309" y="610.4561">[next slot contains an enabled plugin] and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.0615" x="320.5845" y="626.8076">[next slot __is not__ the current slot] /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.6689" x="374.7808" y="643.1592">select the next slot</text></g><!--link active to fadeOut--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="30" id="lnk8"><path d="M474.04,532.2094 C503.02,542.6194 531.54,557.7194 553,579.6094 C578.62,605.7494 586.7646,642.7053 589.7846,670.1853" fill="none" id="active-to-fadeOut-2" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="590.44,676.1494,593.4329,666.7663,589.8938,671.1793,585.4808,667.6402,590.44,676.1494" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.4307" x="642.0244" y="594.1045">[slot requested by user] and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.4795" x="586" y="610.4561">[requested slot contains an enabled plugin] and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.3105" x="597.5845" y="626.8076">[requested slot __is not__ the current slot] /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="140.918" x="651.7808" y="643.1592">select the requested slot</text></g><!--link active to active--><g class="link" data-entity-1="ent0004" data-entity-2="ent0004" data-link-type="dependency" data-source-line="31" id="lnk9"><path d="M474.13,492.8794 C494.81,495.0794 509,500.1594 509,508.1094 C509,516.0594 500.7763,520.5047 480.0963,522.7047" fill="none" id="active-to-active" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="474.13,523.3394,483.5026,526.3649,479.1019,522.8104,482.6564,518.4097,474.13,523.3394" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.4854" x="615.7976" y="489.1045">([timeout] and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.2305" x="535.925" y="505.4561">[next slot contains an enabled plugin] and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.0806" x="515" y="521.8076">[next slot __is the same as__ the current slot]) or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.9243" x="578.5781" y="538.1592">[slot duration reconfigured]</text></g><!--link fadeOut to idle--><g class="link" data-entity-1="ent0005" data-entity-2="ent0002" data-link-type="dependency" data-source-line="33" id="lnk10"><path d="M691.18,695.7894 C755.04,689.0694 838.75,675.1994 908,646.6094 C977.63,617.8594 1010.89,615.7194 1047,549.6094 C1256.78,165.5894 1071.98,302.5994 1057,271.6094 C1051.59,260.4294 1047.8337,254.5868 1038.6337,245.9468" fill="none" id="fadeOut-to-idle" style="stroke:#181818;stroke-width:1;"/><polygon fi