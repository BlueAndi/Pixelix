oke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.2979" x="1556.5" y="340.1045">Base class which implements every method of the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.2241" x="1556.5" y="356.4561">maintenance interface except update(). A concrete</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.3823" x="1556.5" y="372.8076">plugin therefore only overrides what it really needs.</text></g><!--class ConcretePlugin--><g class="entity" data-qualified-name="ConcretePlugin" data-source-line="66" id="ent0014"><rect fill="#F1F1F1" height="83.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="418.998" x="1133" y="1579.6094"/><ellipse cx="1290.3872" cy="1595.6094" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M1293.1528,1591.4844 Q1293.3091,1591.2656 1293.4966,1591.1563 Q1293.6841,1591.0469 1293.9028,1591.0469 Q1294.2778,1591.0469 1294.5122,1591.3125 Q1294.7466,1591.5625 1294.7466,1592.1719 L1294.7466,1593.625 Q1294.7466,1594.2344 1294.5122,1594.5 Q1294.2778,1594.7656 1293.9028,1594.7656 Q1293.5591,1594.7656 1293.356,1594.5625 Q1293.1528,1594.375 1293.0435,1593.8594 Q1292.9966,1593.5 1292.8091,1593.3125 Q1292.481,1592.9375 1291.8716,1592.7188 Q1291.2622,1592.5 1290.6372,1592.5 Q1289.8716,1592.5 1289.231,1592.8281 Q1288.606,1593.1563 1288.106,1593.9063 Q1287.6216,1594.6563 1287.6216,1595.6875 L1287.6216,1596.7813 Q1287.6216,1598.0156 1288.5122,1598.8438 Q1289.4028,1599.6563 1290.9966,1599.6563 Q1291.9341,1599.6563 1292.5903,1599.4063 Q1292.981,1599.25 1293.4028,1598.8125 Q1293.6685,1598.5469 1293.8091,1598.4688 Q1293.9653,1598.3906 1294.1685,1598.3906 Q1294.4966,1598.3906 1294.7466,1598.6563 Q1295.0122,1598.9063 1295.0122,1599.25 Q1295.0122,1599.5938 1294.6685,1600 Q1294.1685,1600.5781 1293.3716,1600.9063 Q1292.2935,1601.