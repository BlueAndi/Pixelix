;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.146" x="1170.5" y="1732.1045">Each plugin represents its own functionality. While it</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.7305" x="1170.5" y="1748.4561">is scheduled by the display manager, it may draw on the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.0781" x="1170.5" y="1764.8076">display.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="1170.5" y="1781.1592">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.3423" x="1170.5" y="1797.5107">The plugin specific interface must be protected against</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="334.5723" x="1170.5" y="1813.8623">concurrent access, because a REST request is handled in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.3271" x="1170.5" y="1830.2139">the web server task.</text></g><!--class ISlotPlugin--><g class="entity" data-qualified-name="ISlotPlugin" data-source-line="81" id="ent0018"><rect fill="#F1F1F1" height="65.6094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="230.2852" x="1315.5" y="492.6094"/><ellipse cx="1392.9272" cy="508.6094" fill="#B4A7E5" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M1393.8804,505.25 L1393.8804,511.9063 L1395.5991,511.9063 Q1396.2085,511.9063 1396.4741,512.1406 Q1396.7397,512.375 1396.7397,512.7656 Q1396.7397,513.1406 1396.4741,513.375 Q1396.2085,513.6094 1395.5991,513.6094 L1390.4585,513.6094 Q1389.8491,513.6094 1389.5835,513.375 Q1389.3179,513.1406 1389.3179,512.75 Q1389.3179,512.375 1389.5835,512.1406 Q1389.8491,511.9063 1390.4585,511.9063 L1392.1772,511.9063 L1392