 but only the ones which are really required</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.6563" x="1178" y="1820.5107">for its functionality.</text></g><!--class ConcretePlugin--><g class="entity" data-qualified-name="ConcretePlugin" data-source-line="73" id="ent0014"><rect fill="#F1F1F1" height="83.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="432.2256" x="59" y="2043.6094"/><ellipse cx="223.001" cy="2059.6094" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M225.7666,2055.4844 Q225.9229,2055.2656 226.1104,2055.1563 Q226.2979,2055.0469 226.5166,2055.0469 Q226.8916,2055.0469 227.126,2055.3125 Q227.3604,2055.5625 227.3604,2056.1719 L227.3604,2057.625 Q227.3604,2058.2344 227.126,2058.5 Q226.8916,2058.7656 226.5166,2058.7656 Q226.1729,2058.7656 225.9697,2058.5625 Q225.7666,2058.375 225.6572,2057.8594 Q225.6104,2057.5 225.4229,2057.3125 Q225.0947,2056.9375 224.4854,2056.7188 Q223.876,2056.5 223.251,2056.5 Q222.4854,2056.5 221.8447,2056.8281 Q221.2197,2057.1563 220.7197,2057.9063 Q220.2354,2058.6563 220.2354,2059.6875 L220.2354,2060.7813 Q220.2354,2062.0156 221.126,2062.8438 Q222.0166,2063.6563 223.6104,2063.6563 Q224.5479,2063.6563 225.2041,2063.4063 Q225.5947,2063.25 226.0166,2062.8125 Q226.2822,2062.5469 226.4229,2062.4688 Q226.5791,2062.3906 226.7822,2062.3906 Q227.1104,2062.3906 227.3604,2062.6563 Q227.626,2062.9063 227.626,2063.25 Q227.626,2063.5938 227.2822,2064 Q226.7822,2064.5781 225.9854,2064.9063 Q224.9072,2065.3594 223.6104,2065.3594 Q222.0947,2065.3594 220.8916,2064.7344 Q219.9072,2064.2344 219.2197,2063.1719 Q218.5322,2062.0938 218.5322,2060.8125 L218.5322,2059.6563 Q218.5322,2058.3281 219.1416,2057.1875 Q219.7666,2056.0313 220.8604,2055.4219 Q221.9541,2054.7969 223.1885,2054.7969 Q223.9229,2054.7969 224.5635,2054.9688 Q225.2197,2055.125 225.7666,2055.4844 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.7236" x="243.501" y="2065.3379">ConcretePlugin</text><line style="stroke:#181818;stroke-width:0.5;" x1="60" x2="490.2256" y1="2075.6094" y2="2075.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="60" x2="490.2256" y1="2083.6094" y2="2083.6094"/><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="70" cy="2097.9141" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="406.2256" x="79" y="2102.1426">create(name : const String&amp;, uid : uint16_t) : IPluginMaintenance*</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="70" cy="2115.5234" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.958" x="79" y="2119.752">update(gfx: IGfx&amp;) : void</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="79" id="ent0016"><path d="M116.5,2187.6094 L116.5,2312.0703 A0,0 0 0 0 116.5,2312.0703 L433.0151,2312.0703 A0,0 0 0 0 433.0151,2312.0703 L433.0151,2197.6094 L423.0151,2187.6094 L279,2187.6094 L275,2126.6994 L271,2187.6094 L116.5,2187.6094 A0,0 0 0 0 116.5,2187.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M423.0151,2187.6094 L423.0151,2197.6094 L433.0151,2197.6094 L423.0151,2187.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.916" x="122.5" y="2206.1045">Each plugin represents its own functionality.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.8887" x="122.5" y="2222.4561">If a plugin is scheduled by the display manager,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.3062" x="122.5" y="2238.8076">it can draw on the display.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="122.5" y="2255.1592">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.8105" x="122.5" y="2271.5107">The plugin specific interface must be protected</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.6733" x="122.5" y="2287.8623">against concurrent access. This is the case if</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.5151" x="122.5" y="2304.2139">a REST page is accessed from the webserver task.</text></g><!--class ISlotPlugin--><g class="entity" data-qualified-name="ISlotPlugin" data-source-line="88" id="ent0018"><rect fill="#F1F1F1" height="65.6094" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="230.2852" x="1395" y="657.6094"/><ellipse cx="1472.4272" cy="673.6094" fill="#B4A7E5" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M1473.3804,670.25 L1473.3804,676.9063 L1475.0991,676.9063 Q1475.7085,676.9063 1475.9741,677.1406 Q1476.2397,677.375 1476.2397,677.7656 Q1476.2397,678.1406 1475.9741,678.375 Q1475.7085,678.6094 1475.0991,678.6094 L1469.9585,678.6094 Q1469.3491,678.6094 1469.0835,678.375 Q1468.8179,678.1406 1468.8179,677.75 Q1468.8179,677.375 1469.0835,677.1406 Q1469.3491,676.9063 1469.9585,676.9063 L1471.6772,676.9063 L1471.6772,670.25 L1469.9585,670.25 Q1469.3491,670.25 1469.0835,670.0156 Q1468.8179,669.7813 1468.8179,669.3906 Q1468.8179,669.0156 1469.0835,668.7813 Q1469.3491,668.5469 1469.9585,668.5469 L1475.0991,668.5469 Q1475.7085,668.5469 1475.9741,668.7813 Q1476.2397,669.0156 1476.2397,669.3906 Q1476.2397,669.7813 1475.9741,670.0156 Q1475.7085,670.25 1475.0991,670.25 L1473.3804,670.25 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengt