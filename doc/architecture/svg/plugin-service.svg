-serif" font-size="14" lengthAdjust="spacing" textLength="63.0273" x="449.5" y="449.2363">PluginMgr</text><line style="stroke:#181818;stroke-width:0.5;" x1="421.5" x2="514.5273" y1="457.3125" y2="457.3125"/><line style="stroke:#181818;stroke-width:0.5;" x1="421.5" x2="514.5273" y1="465.3125" y2="465.3125"/></g><g class="entity" data-qualified-name="GMN33" data-source-line="150" id="ent0034"><path d="M42.5,308.1094 L42.5,579.7344 A0,0 0 0 0 42.5,579.7344 L385.0532,579.7344 A0,0 0 0 0 385.0532,579.7344 L385.0532,448.1094 L420.39,444.1094 L385.0532,440.1094 L385.0532,318.1094 L375.0532,308.1094 L42.5,308.1094 A0,0 0 0 0 42.5,308.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M375.0532,308.1094 L375.0532,318.1094 L385.0532,318.1094 L375.0532,308.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.2178" x="48.5" y="326.6045">The plugin manager is able to load/save the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.6206" x="48.5" y="342.9561">plugin configuration in persistent memory.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.2935" x="48.5" y="359.3076">Per plugin are stored:</text><ellipse cx="54" cy="371.0156" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="34.6772" x="60.5" y="375.6592">Name</text><ellipse cx="54" cy="387.3672" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="22.3882" x="60.5" y="392.0107">UID</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.0742" x="48.5" y="408.3623">The order of saving plugins in persistent memory</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.2324" x="48.5" y="424.7139">is according to the slot number, they are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="63.6099" x="48.5" y="441.0654">plugged in.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="48.5" y="457.417">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.8887" x="48.5" y="473.7686">The plugin manager handles the whole REST API</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.9287" x="48.5" y="490.1201">registration for the plugins by requesting the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="75.8799" x="48.5" y="506.4717">plugin topics.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="3.6118" x="48.5" y="522.8232">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.5532" x="48.5" y="539.1748">The REST API URL depends on the plugin UID or alias:</text><ellipse cx="54" cy="550.8828" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.9414" x="60.5" y="555.5264">&lt;base-uri&gt;/rest/api/v1/display/uid/&lt;plugin-uid&gt;</text><ellipse cx="54" cy="567.2344" fill="#000000" rx="2.5" ry="2.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.7178" x="60.5" y="571.8779">&lt;base-uri&gt;/rest/api/v1/display/alias/&lt;plugin-alias&gt;</text></g><!--class ESPAsyncWebserver--><g class="entity" data-qualified-name="ESPAsyncWebserver" data-source-line="168" id="ent0036"><rect fill="#F1F1F1" height="48" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="165.8203" x="598"