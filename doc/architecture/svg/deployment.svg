<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="871px" preserveAspectRatio="none" style="width:1005px;height:871px;background:#FFFFFF;" version="1.1" viewBox="0 0 1005 871" width="1005px" zoomAndPan="magnify"><title>Task Deployment</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="115.9238" x="437.5381" y="24.5332">Task Deployment</text></g><g class="legend" data-source-line="11"><rect fill="#DDDDDD" height="45.2188" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="420.8193" x="558.1807" y="50.6094"/><path d="M568.264,60.3854 L567.6807,61.7738 C567.564,61.8087 567.459,61.8671 567.354,61.9254 L565.9657,61.3421 L565.1257,62.1821 L565.709,63.5704 C565.6507,63.6871 565.604,63.7804 565.5573,63.8971 L564.169,64.4804 L564.169,65.6471 L565.5573,66.2304 C565.604,66.3471 565.6507,66.4404 565.709,66.5571 L565.1257,67.9454 L565.9657,68.7854 L567.354,68.2021 C567.459,68.2488 567.564,68.3071 567.6807,68.3537 L568.264,69.7421 L569.4307,69.7421 L570.014,68.3537 C570.119,68.3071 570.2357,68.2604 570.3407,68.2021 L571.729,68.7854 L572.569,67.9454 L571.9857,66.5571 C572.0323,66.4521 572.0907,66.3354 572.1373,66.2304 L573.5257,65.6471 L573.5257,64.4804 L572.1373,63.8971 C572.1023,63.7921 572.044,63.6754 571.9857,63.5704 L572.569,62.1821 L571.729,61.3421 L570.3407,61.9254 C570.2357,61.8788 570.119,61.8204 570.014,61.7738 L569.4307,60.3854 L568.264,60.3854 M568.8473,63.3021 C569.8157,63.3021 570.5973,64.0838 570.5973,65.0521 C570.5973,66.0204 569.8157,66.8021 568.8473,66.8021 C567.879,66.8021 567.0973,66.0204 567.0973,65.0521 C567.0973,64.0838 567.879,63.3021 568.8473,63.3021" fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="303.4746" x="578.4036" y="70.1426">&#171;task&#187; is a project specific stereotype on Artifact.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="410.8193" x="563.1807" y="87.752">It denotes a FreeRTOS task. The number in brackets is its priority.</text></g><!--cluster esp32--><g class="cluster" data-qualified-name="esp32" data-source-line="16" id="ent0002"><polygon fill="none" points="16,124.8281,26,114.8281,988,114.8281,988,844.8281,978,854.8281,16,854.8281,16,124.8281" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="978" x2="988" y1="124.8281" y2="114.8281"/><line style="stroke:#181818;stroke-width:1;" x1="16" x2="978" y1="124.8281" y2="124.8281"/><line style="stroke:#181818;stroke-width:1;" x1="978" x2="978" y1="124.8281" y2="854.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="56.041" x="469.9795" y="142.3613">&#171;device&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="43.5859" x="476.207" y="159.9707">ESP32</text></g><!--cluster proCpu--><g class="cluster" data-qualified-name="esp32.proCpu" data-source-line="18" id="ent0003"><polygon fill="none" points="558,250.8281,568,240.8281,956,240.8281,956,572.8281,946,582.8281,558,582.8281,558,250.8281" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="946" x2="956" y1="250.8281" y2="240.8281"/><line style="stroke:#181818;stroke-width:1;" x1="558" x2="946" y1="250.8281" y2="250.8281"/><line style="stroke:#181818;stroke-width:1;" x1="946" x2="946" y1="250.8281" y2="582.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="154.0957" x="675.9521" y="268.3613">&#171;executionEnvironment&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="43.5723"