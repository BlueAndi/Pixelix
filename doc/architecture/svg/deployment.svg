sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.2114" x="617" y="814.3232">Tasks without affinity are not pinned to a core. The</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325.165" x="617" y="830.6748">scheduler decides in every cycle on which core they run.</text></g><!--entity idle0Task--><g class="entity" data-qualified-name="esp32.proCpu.idle0Task" data-source-line="20" id="ent0004"><rect fill="#F1F1F1" height="58.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="89.9102" x="582" y="324.8281"/><polygon fill="#F1F1F1" points="654.9102,329.8281,654.9102,343.8281,666.9102,343.8281,666.9102,335.8281,660.9102,329.8281,654.9102,329.8281" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="660.9102" x2="660.9102" y1="329.8281" y2="335.8281"/><line style="stroke:#181818;stroke-width:0.5;" x1="666.9102" x2="660.9102" y1="335.8281" y2="335.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="41.248" x="601.3311" y="352.3613">&#171;task&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.9102" x="592" y="369.9707">IDLE0 (0)</text></g><!--entity tmrSvcTask--><g class="entity" data-qualified-name="esp32.proCpu.tmrSvcTask" data-source-line="21" id="ent0005"><rect fill="#F1F1F1" height="58.2188" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="103.1035" x="684.5" y="324.8281"/><polygon fill="#F1F1F1" points="770.6035,329.8281,770.6035,343.8281,782.6035,343.8281,782.6035,335.8281,776.6035,329.8281,770.6035,329.8281" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="776.6035" x2="776.6035" y1="329.8281" y2="335.8281"/><line style="stroke:#181818;stroke-width:0.5;" x1="782.6035" x2="776.6035" y1="335.8281" y2="335.8281"/><text fill="#000000" font-family="san