<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1178px" preserveAspectRatio="none" style="width:747px;height:1178px;background:#FFFFFF;" version="1.1" viewBox="0 0 747 1178" width="747px" zoomAndPan="magnify"><title>User Button Debouncing</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="164.8828" x="289.667" y="34.5332">User Button Debouncing</text></g><path d="M187.2832,48.6094 L187.2832,124.0156 L573.9336,124.0156 L573.9336,58.6094 L563.9336,48.6094 L187.2832,48.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M563.9336,48.6094 L563.9336,58.6094 L573.9336,58.6094 L563.9336,48.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.8276" x="193.2832" y="67.1045">Design: the ISR only reports that a button edge was detected.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.2031" x="193.2832" y="83.4561">Every edge restarts the debounce timer of that button. The task</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="365.6504" x="193.2832" y="99.8076">evaluates the pin level once the timer expired, which means the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.0762" x="193.2832" y="116.1592">level was stable for DEBOUNCING_TIME (100 ms).</text><ellipse cx="380.6084" cy="154.0156" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="231.4648" x="264.876" y="184.0156"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.4648" x="274.876" y="206.4727">Install the ISR on falling and rising edge</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="83.3789" x="274.876" y="221.5664">for every button</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="725.2168" x="11" y="254.2031"/><path d="M230.4727,703.7861 L230.4727,712.9619 L210.4727,716.9619 L230.4727,720.9619 L230.4727,730.1377 A0,0 0 0 0 230.4727,730.1377 L346.1289,730.1377 A0,0 0 0 0 346.1289,730.1377 L346.1289,713.7861 L336.1289,703.7861 L230.4727,703.7861 A0,0 0 0 0 230.4727,703.7861" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M336.1289,703.7861 L336.1289,713.7861 L346.1289,713.7861 L336.1289,703.7861" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94.6563" x="236.4727" y="722.2813">Runs in the ISR.</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="187.4727" x="23" y="699.415"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.4727" x="33" y="721.8721">Send the button id to the queue</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="254.7148" x="416.8154" y="324.2031"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.7148" x="426.8154" y="346.6602">Wait up to DEBOUNCING_TIME / 4 (25 ms)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.7832" x="426.8154" y="361.7539">for a button id on the queue</text><rect fill="#F1F1F1" height="50.1875" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="218.0586" x="435.1436" y="443.3086"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.7363" x="445.1436" y="465.7656">(Re)start the debounce timer</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.0586" x="445.1436" y="480.8594">(DEBOUNCING_TIME) of that button</text><polygon fill="#F1F1F1" points="497.0872,394.3906,591.2585,394.3906,603.2585,406.3906,591.2585,418.3906,497.0872,418.3906,485.0872,406.3906,497.0872,394.3906" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="548.1729" y="429.8096">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="94.1714" x="497.0872" y="410.8916">Button id received?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="603.2585" y="403.9736">no</text><polygon fill="#F1F1F1" points="544.1729,513.4961,556.1729,525.4961,544.1729,537.4961,532.1729,525.4961,544.1729,513.4961" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="152.7617" x="467.792" y="663.333"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.7617" x="477.792" y="685.79">Read the button pin level</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="272.0879" x="408.1289" y="733.4268"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="252.0879" x="418.1289" y="755.8838">Derive PRESSED or RELEASED from the level</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="160.0918" x="464.127" y="837.4385"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="140.0918" x="474.127" y="859.8955">Store the new button state</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="120.7109" x="483.8174" y="907.5322"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="100.7109" x="493.8174" y="929.9893">Notify the observer</text><polygon fill="#F1F1F1" points="462.5457,788.5205,625.8,788.5205,637.8,800.5205,625.8,812.5205,462.5457,812.5205,450.5457,800.5205,462.5457,788.5205" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="548.1729" y="823.9395">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="163.2544" x="462.5457" y="805.0215">State differs from the stored one?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="637.8" y="798.1035">no</text><polygon fill="#F1F1F1" points="544.1729,962.626,556.1729,974.626,544.1729,986.626,532.1729,974.626,544.1729,962.626" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="150.752" x="468.7969" y="1006.626"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="130.752" x="478.7969" y="1029.083">Stop the debounce timer</text><polygon fill="#F1F1F1" points="447.5576,614.415,640.7881,614.415,652.7881,626.415,640.7881,638.415,447.5576,638.415,435.5576,626.415,447.5576,614.415" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="548.1729" y="649.834">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="193.2305" x="447.5576" y="630.916">Debounce timer running and timed out?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="652.7881" y="623.998">no</text><polygon fill="#F1F1F1" points="544.1729,1061.7197,556.1729,1073.7197,544.1729,1085.7197,532.1729,1073.7197,544.1729,1061.7197" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="501.0671,557.4961,587.2786,557.4961,599.2786,569.4961,587.2786,581.4961,501.0671,581.4961,489.0671,569.4961,501.0671,557.4961" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="54.4307" x="548.1729" y="592.915">next button</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="86.2114" x="501.0671" y="573.9971">For every button?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="77.6714" x="411.3958" y="567.0791">all buttons done</text><polygon fill="#F1F1F1" points="544.1729,280.2031,556.1729,292.2031,544.1729,304.2031,532.1729,292.2031,544.1729,280.2031" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="512.3787,1127.7197,575.967,1127.7197,587.967,1139.7197,575.967,1151.7197,512.3787,1151.7197,500.3787,1139.7197,512.3787,1127.7197" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="63.5884" x="512.3787" y="1144.2207">Run forever?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="587.967" y="1137.3027">yes</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="725.2168" x="11" y="1161.7197"/><line style="stroke:#181818;stroke-width:1;" x1="380.6084" x2="380.6084" y1="124.0156" y2="144.0156"/><polygon fill="#181818" points="376.6084,134.0156,380.6084,144.0156,384.6084,134.0156,380.6084,138.0156" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x