<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="813px" preserveAspectRatio="none" style="width:1021px;height:813px;background:#FFFFFF;" version="1.1" viewBox="0 0 1021 813" width="1021px" zoomAndPan="magnify"><title>User Button Debouncing
</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="164.8828" x="426.5618" y="34.5332">User Button Debouncing</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="3.8896" x="507.0583" y="52.1426">&#160;</text></g><path d="M33.9202,66.2188 L33.9202,125.2734 A0,0 0 0 0 33.9202,125.2734 L488.5032,125.2734 A0,0 0 0 0 488.5032,125.2734 L488.5032,99.7461 L508.5032,95.7461 L488.5032,91.7461 L488.5032,76.2188 L478.5032,66.2188 L33.9202,66.2188 A0,0 0 0 0 33.9202,66.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M478.5032,66.2188 L478.5032,76.2188 L488.5032,76.2188 L478.5032,66.2188" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="433.583" x="39.9202" y="84.7139">Design: The user button ISR counts the number of detected button triggers.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="414.7622" x="39.9202" y="101.0654">The button task determines every 10 ms how many trigger are detected.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.5913" x="39.9202" y="117.417">If there are 0 triggers over 100 ms, the current user button state is valid.</text><ellipse cx="518.5032" cy="95.7461" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="214.7832" x="411.1116" y="145.2734"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194.7832" x="421.1116" y="167.7305">Install ISR on falling and rising edge.</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="999.0063" x="11" y="200.3672"/><path d="M23,469.6484 L23,496 A0,0 0 0 0 23,496 L116.9727,496 A0,0 0 0 0 116.9727,496 L116.9727,487.6484 L136.9727,482.8242 L116.9727,479.6484 L116.9727,479.6484 L106.9727,469.6484 L23,469.6484 A0,0 0 0 0 23,469.6484" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M106.9727,469.6484 L106.9727,479.6484 L116.9727,479.6484 L106.9727,469.6484" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.9727" x="29" y="488.1436">Runs in ISR.</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="146.7324" x="136.9727" y="465.2773"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.7324" x="146.9727" y="487.7344">Increase trigger counter</text><polygon fill="#F1F1F1" points="760.5991,270.3672,856.6021,270.3672,868.6021,282.3672,856.6021,294.3672,760.5991,294.3672,748.5991,282.3672,760.5991,270.3672" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="96.0029" x="760.5991" y="286.8682">0 == trigger counter</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="731.4814" y="279.9502">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="868.6021" y="279.9502">no</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="269.4805" x="565.145" y="304.3672"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.4805" x="575.145" y="326.8242">Set lastButtonState to current user button state</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="140.0586" x="629.856" y="359.4609"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.0586" x="639.856" y="381.918">Increase cycle counter</text><path d="M331.7051,463.4727 L331.7051,506.1758 A0,0 0 0 0 331.7051,506.1758 L568.811,506.1758 A0,0 0 0 0 568.811,506.1758 L568.811,488.8242 L588.811,484.8242 L568.811,480.8242 L568.811,473.4727 L558.811,463.4727 L331.7051,463.4727 A0,0 0 0 0 331.7051,463.4727" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M558.811,463.4727 L558.811,473.4727 L568.811,473.4727 L558.811,463.4727" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.106" x="337.7051" y="481.9678">The button queue will be handled in a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.0381" x="337.7051" y="498.3193">different task.</text><rect fill="#F1F1F1" height="35.0938" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="222.1484" x="588.811" y="467.2773"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.1484" x="598.811" y="489.7344">Push lastButtonState to button queue.</text><polygon fill="#F1F1F1" points="648.825,414.5547,750.9456,414.5547,762.9456,426.5547,750.9456,438.5547,648.825,438.5547,636.825,426.5547,648.825,414.5547" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="17.1177" x="703.8853" y="449.9736">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="102.1206" x="648.825" y="431.0557">10 &gt;= cycle counter?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="12.2354" x="762.9456" y="424.1377">no</text><polygon fill="#F1F1F1" points="699.8853,526.1758,711.8853,538.1758,699.8853,550.1758,