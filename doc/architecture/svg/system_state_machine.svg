<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="911px" preserveAspectRatio="none" style="width:884px;height:911px;background:#FFFFFF;" version="1.1" viewBox="0 0 884 911" width="884px" zoomAndPan="magnify"><title>System State Machine</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="147.834" x="361.3274" y="24.5332">System State Machine</text></g><g class="entity" data-qualified-name="InitState" id="ent0002"><rect fill="#F1F1F1" height="113.0781" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216.7637" x="266.94" y="142.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="266.94" x2="483.7037" y1="170.2188" y2="170.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.3652" x="349.6392" y="162.1426">InitState</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.7637" x="271.94" y="187.6758">/entry: Initialize HAL and slot layouts.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.0723" x="271.94" y="202.7695">/do: Get button state.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.0352" x="271.94" y="217.8633">/exit: Start wifi network</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="92.6836" x="271.94" y="232.957">/exit: Start mDNS</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.7617" x="271.94" y="248.0508">/exit: Start web- and update server.</text></g><g class="entity" data-qualified-name="APState" id="ent0003"><rect fill="#F1F1F1" height="82.8906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="214.7539" x="461.94" y="349.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="461.94" x2="676.6939" y1="377.2188" y2="377.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.3652" x="543.6343" y="369.1426">APState</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.4102" x="466.94" y="394.6758">/entry: Setup access point.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.418" x="466.94" y="409.7695">/do: Handle client requests.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="194.7539" x="466.94" y="424.8633">/exit: Disconnect all wifi connections.</text></g><g class="entity" data-qualified-name="IdleState" id="ent0004"><rect fill="#F1F1F1" height="52.7031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="160.7246" x="15.94" y="654.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="15.94" x2="176.6646" y1="682.2188" y2="682.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.2617" x="68.6714" y="674.1426">IdleState</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="140.7246" x="20.94" y="699.6758">/do: Wait for manual reset.</text></g><g class="entity" data-qualified-name="ConnectingState" id="ent0005"><rect fill="#F1F1F1" height="67.7969" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="270.1133" x="102.44" y="357.1094"/><line style="stroke:#181818;stroke-width:0.5;" x1="102.44" x2="372.5533" y1="384.7188" y2="384.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.5166" x="185.7383" y="376.6426">ConnectingState</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLeng