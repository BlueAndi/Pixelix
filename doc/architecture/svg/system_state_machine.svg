<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="971px" preserveAspectRatio="none" style="width:972px;height:971px;background:#FFFFFF;" version="1.1" viewBox="0 0 972 971" width="972px" zoomAndPan="magnify"><title>System State Machine</title><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="147.834" x="405.4807" y="24.5332">System State Machine</text></g><g class="entity" data-qualified-name="InitState" id="ent0002"><rect fill="#F1F1F1" height="143.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="254.0996" x="200" y="142.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="200" x2="454.0996" y1="170.2188" y2="170.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.3652" x="301.3672" y="162.1426">InitState</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="234.0996" x="205" y="187.6758">entry / Initialize HAL, filesystem and display.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.0391" x="205" y="202.7695">entry / Start all services.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="210.7852" x="205" y="217.8633">entry / Prepare plugins and slot layouts.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.1113" x="205" y="232.957">do / Sample the user button state.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.7148" x="205" y="248.0508">do / Process all services.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.6953" x="205" y="263.1445">exit / Start WiFi and mDNS.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.7617" x="205" y="278.2383">exit / Start web- and update server.</text></g><g class="entity" data-qualified-name="APState" id="ent0003"><rect fill="#F1F1F1" height="82.8906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="221.4102" x="216.5" y="379.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="216.5" x2="437.9102" y1="407.2188" y2="407.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.3652" x="301.5225" y="399.1426">APState</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.082" x="221.5" y="424.6758">entry / Set up the WiFi access point.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.418" x="221.5" y="439.7695">do / Handle client requests.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.4102" x="221.5" y="454.8633">exit / Disconnect all WiFi connections.</text></g><g class="entity" data-qualified-name="ConnectingState" id="ent0004"><rect fill="#F1F1F1" height="82.8906" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="296.7852" x="472.5" y="379.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="472.5" x2="769.2852" y1="407.2188" y2="407.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.5166" x="569.1343" y="399.1426">ConnectingState</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="267.4453" x="477.5" y="424.6758">entry / Get the remote WiFi SSID and passphrase.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="276.7852" x="477.5" y="439.7695">do / Connect every 30 s to the remote WiFi network.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.7148" x="477.5" y="454.8633">do / Process all services.</text></g><g class="entity" data-qualified-name="ConnectedState" id="ent0005"><rect fill="#F1F1F1" height="113.0781" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="236.7969" x="483.5" y="556.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="483.5" x2="720.2969" y1="584.2188" y2="584.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.4063" x="551.6953" y="576.1426">ConnectedState</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.0801" x="488.5" y="601.6758">entry / Show the hostname.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="216.7969" x="488.5" y="616.7695">entry / Enable slot routing on the display.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.418" x="488.5" y="631.8633">do / Handle client requests.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.7148" x="488.5" y="646.957">do / Process all services.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.4102" x="488.5" y="662.0508">exit / Disconnect all WiFi connections.</text></g><g class="entity" data-qualified-name="IdleState" id="ent0006"><rect fill="#F1F1F1" height="52.7031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="170.7324" x="692.5" y="699.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="692.5" x2="863.2324" y1="727.2188" y2="727.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.2617" x="750.2354" y="719.1426">IdleState</text><text fill="#000000" font-family="sans-serif" font-size="12" lengt