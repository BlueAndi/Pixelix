      description: |
        Set timer status.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "state=off" -X POST http://pixelix-FFFFFFFF/rest/api/v1/timerService/timer
        ```
      operationId: setTimerServiceTimer
      parameters:
        - in: query
          name: timerSettings._0_.enabled
          schema:
            type: boolean
          required: true
          description: Enable/disable timer setting 0.
        - in: query
          name: timerSettings._0_.hour
          schema:
            type: number
          required: true
          description: Timer 0 hour [0; 23].
        - in: query
          name: timerSettings._0_.minute
          schema:
            type: number
          required: true
          description: Timer 0 minute [0; 59].
        - in: query
          name: timerSettings._0_.sunday
          schema:
            type: boolean
          required: true
          description: Timer 0 enabled/disabled on Sunday.
        - in: query
          name: timerSettings._0_.monday
          schema:
            type: boolean
          required: true
          description: Timer 0 enabled/disabled on Monday.
        - in: query
          name: timerSettings._0_.tuesday
          schema:
            type: boolean
          required: true
          description: Timer 0 enabled/disabled on Tuesday.
        - in: query
          name: timerSettings._0_.wednesday
          schema:
            type: boolean
          required: true
          description: Timer 0 enabled/disabled on Wednesday.
        - in: query
          name: timerSettings._0_.thursday
          schema:
            type: boolean
          required: true
          description: Timer 0 enabled/disabled on Thursday.
        - in: query
          name: timerSettings._0_.friday
          schema:
            type: boolean
          required: true
          description: Timer 0 enabled/disabled on Friday.
        - in: query
          name: timerSettings._0_.saturday
          schema:
            type: boolean
          required: true
          description: Timer 0 enabled/disabled on Saturday.
        - in: query
          name: timerSettings._0_.displayState
          schema:
            type: number
            enum: [0, 1, 2]
          required: true
          description: "Timer 0 display state (0: none / 1: on / 2: off)."
        - in: query
          name: timerSettings._0_.brightness
          schema:
            type: number
          required: true
          description: Timer 0 brightnes in %. A -1 means disabled.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimerServiceTimer"
      security:
        - pixelixAuth: []
  /coredump:
    get:
      tags:
        - Common
      summary: Get coredump information
      description: |
        Retrieve coredump partition information or decoded crash summary.

        **Without decode parameter** - Returns basic partition info:
        ```json
        {
          "status": "ok",
          "data": {
            "hasCoredump": true,
            "partitionSize": 65536,
            "partitionOffset": 8323072,
            "coredumpSize": 12345,
            "coredumpOffset": 8323072
          }
        }
        ```

        **With decode=true** - Returns decoded crash analysis:
        ```json
        {
          "status": "ok",
          "data": {
            "crashedTask": "IDLE0",
            "exceptionCause": "LoadProhibited",
            "exceptionCode": 28,
            "exceptionAddr": "0x00000000",
            "registers": {
              "A0": "0x80090c10",
              "A1": "0x3ffbf1bc",
              ...
            },
            "backtrace": ["0x40084659"],
            "backtraceDepth": 1
          }
        }
        ```
      operationId: getCoredump
      parameters:
        - in: query
          name: decode
          schema:
            type: boolean
          required: false
          description: If true, decode coredump into human-readable crash summary with registers and backtrace.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "400":
          description: Bad request - invalid decode parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Coredump partition not found or no coredump data present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error reading or decoding coredump
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - pixelixAuth: []
    delete:
      tags:
        - Common
      summary: Clear coredump partition
      description: |
        Erase the coredump partition to remove stored crash data.

        Response:
        ```json
        {
          "status": "ok",
          "data": {}
        }
        ```
      operationId: clearCoredump
      responses:
        "200":
          description: Coredump partition cleared successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "404":
          description: Coredump partition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to erase coredump partition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - pixelixAuth: []
  /partitionChange:
    post:
      tags:
        - Common
      summary: Switch to factory partition and restart
      description: |
        Set the factory partition as the next boot partition and restart the device.
        Used for firmware recovery or switching to factory firmware.

        Response on success:
        ```json
        {
          "status": "ok",
          "data": {}
        }
        ```

        Note: Device will restart after successful execution.
      operationId: changePartition
      responses:
        "200":
          description: Factory partition set as boot partition, device restarting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "500":
          description: Failed to set factory partition (not found or set failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - pixelixAuth: []
  /homeAssistant/automaticDiscovery/disable:
    post:
      tags:
        - Service
      summary: Disable Home Assistant MQTT automatic discovery
      description: |
        Disable the Home Assistant MQTT automatic discovery feature.
        This prevents the welcome plugin from being discovered during filesystem updates.

        Response:
        ```json
        {
          "status": "ok",
          "data": {}
        }
        ```
      operationId: disableHomeAssistantDiscovery
      responses:
        "200":
          description: Discovery disabled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "500":
          description: Failed to disable discovery or MqttService not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - pixelixAuth: []
  /homeAssistant/automaticDiscovery/status:
    get:
      tags:
        - Service
      summary: Get Home Assistant MQTT automatic discovery status
      description: |
        Check whether the Home Assistant MQTT automatic discovery is enabled or disabled.

        Response:
        ```json
        {
          "status": "ok",
          "data": {
            "enabled": true
          }
        }
        ```
      operationId: getHomeAssistantDiscoveryStatus
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - data
                properties:
                  status:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: True if discovery is enabled, false if disabled or MqttService not configured
        "500":
          description: Unknown error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - pixelixAuth: []
