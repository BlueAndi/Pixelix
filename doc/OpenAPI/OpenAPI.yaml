        $ curl -u luke:skywalker -d "key=hostname" -X GET http://pixelix-FFFFFFFF/rest/api/v1/setting
        ```
      operationId: getSetting
      parameters:
        - in: query
          name: key
          schema:
            type: string
          required: true
          description: The key of the setting, which to get.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
      security:
        - pixelixAuth: []
    post:
      tags:
        - Common
      summary: Set setting by key
      description: |
        Set single settings value by key.

        Example:
        ```bash
        curl -u luke:skywalker -d "key=hostname" -d "value=pixelix" -X POST http://pixelix-FFFFFFFF/rest/api/v1/setting
        ```
      operationId: setSetting
      parameters:
        - in: query
          name: key
          schema:
            type: string
          required: true
          description: The key of the setting, which to set.
        - in: query
          name: value
          schema:
            oneOf:
              - type: string
              - type: integer
              - type: boolean
              - type: object
          required: true
          description: The value of the setting, which to set.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          description: Settings value invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Setting key not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings:
    get:
      tags:
        - Common
      summary: List setting keys
      description: |
        List all settings with their key.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/settings
        ```
      operationId: getSettings
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
      security:
        - pixelixAuth: []
  /status:
    get:
      tags:
        - Common
      summary: Get status information
      description: |
        Status information:
        * Software version.
        * ESP SDK version.
        * ESP chip revision.
        * ESP cpu frequency in MHz.
        * Internal RAM heap size and available heap.
        * Wifi SSID of the network, the display will connect to.
        * Wifi receive signal strength indicator in dBm.
        * Wifi signal quality in percent.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/status
        ```
      operationId: getStatus
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
      security:
        - pixelixAuth: []
  /timerService/timer:
    get:
      tags:
        - Service
      summary: Get timer status.
      description: |
        Get timer status.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/timerService/timer
        ```
      operationId: getTimerServiceTimer
      responses:
        "200":
          description: Ok
          content:
