openapi: 3.0.0
info:
  description: |
    # PIXELIX

    Pixelix offers a REST API to control the display.

    ## General

    If a plugin is instantiated, it will get a random and unqiue id (UID). The UID is used to address the plugin specific REST API. The user is able to assign a alias name for every plugin instance, which can be used to address it too.
    * UID:
      * ```<server-url>/display/uid/{uid}```
    * Alias:
      * ```/display/alias/{alias}```

    The REST API description focus only on the UID for the sake of maintainability.
  version: 1.9.0
  title: Pixelix REST API
  termsOfService: ""
  license:
    name: MIT
    url: "https://github.com/BlueAndi/Pixelix/blob/master/LICENSE"
servers:
  - url: "http://{pixelix-hostname}/rest/api/v1"
    variables:
      pixelix-hostname:
        default: "pixelix-FFFFFFFF"
        description: The Pixelix hostname.
tags:
  - name: Common
    description: Common status and configuration
  - name: Display
    description: Display status and functionality
  - name: FileMgrService
    description: File upload manager
  - name: Filesystem
    description: File system handling
  - name: Sensor
    description: Sensor information
  - name: Service
    description: Service depended information
  - name: CountdownPlugin
    description: Plugin specific API
  - name: DateTimePlugin
    description: Plugin specific API
  - name: GithubPlugin
    description: Plugin specific API
  - name: GrabViaRestPlugin
    description: Plugin specific API
  - name: GruenbeckPlugin
    description: Plugin specific API
  - name: IconTextLampPlugin
    description: Plugin specific API
  - name: IconTextPlugin
    description: Plugin specific API
  - name: MultiIconPlugin
    description: Plugin specific API
  - name: OpenMeteoPlugin
    description: Plugin specific API
  - name: OpenWeatherPlugin
    description: Plugin specific API
  - name: SensorPlugin
    description: Plugin specific API
  - name: SignalDetectorPlugin
    description: Plugin specific API
  - name: SoundReactivePlugin
    description: Plugin specific API
  - name: SunrisePlugin
    description: Plugin specific API
  - name: VolumioPlugin
    description: Plugin specific API
paths:
  /button:
    post:
      tags:
        - Common
      summary: Trigger button
      description: |
        Trigger button with the same effet as triggering the hardware pushbutton.

        Example:
        ```bash
        $ curl -u luke:skywalker -X POST http://pixelix-FFFFFFFF/rest/api/v1/button
        ```
      operationId: triggerButton
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Button"
      security:
        - pixelixAuth: []
  /display/fadeEffect:
    get:
      tags:
        - Display
      summary: Get fade effect
      description: |
        Get current fade effect.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/fadeEffect
        ```
      operationId: getFadeEffect
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadeEffect"
      security:
        - pixelixAuth: []
    post:
      tags:
        - Display
      summary: Activate next fade effect
      description: |
        Activate next fade effect. It will iterate through all fade effects.

        Example:
        ```bash
        $ curl -u luke:skywalker -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/fadeEffect
        ```
      operationId: nextFadeEffect
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FadeEffect"
      security:
        - pixelixAuth: []
  /display/power:
    get:
      tags:
        - Display
      summary: Get display power state.
      description: |
        Get current display power state.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/power
        ```
      operationId: getDisplayPowerState
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayPowerState"
      security:
        - pixelixAuth: []
    post:
      tags:
        - Display
      summary: Set display power state.
      description: |
        Set current display power state.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "state=off" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/power
        ```
      operationId: setDisplayPowerState
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [off, on]
          required: false
          description: "Power on/off state."
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayPowerState"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/channel:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - SensorPlugin
      summary: Get sensor configuration
      description: |
        Get sensor configuration parameters.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/channel
        ```
      operationId: getSensorCfg
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
      security:
        - pixelixAuth: []
    post:
      tags:
        - SensorPlugin
      summary: Set sensor configuration
      description: |
        Set sensor configuration parameters.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "sensorIndex=0" -d "channelIndex=0" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/channel
        ```
      operationId: setSensorCfg
      parameters:
        - in: query
          name: sensorIndex
          schema:
            type: number
          required: true
          description: The index of the sensor which to select.
        - in: query
          name: channelIndex
          schema:
            type: number
          required: true
          description: The index of the sensor specific channel which to select.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/config:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - SoundReactivePlugin
      summary: Get configuration
      description: |
        Get sound reactive plugin configuration.
        You can choose between 8 or 16 frequency bands to show.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/config
        ```
      operationId: getConfiguration
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
      security:
        - pixelixAuth: []
    post:
      tags:
        - SoundReactivePlugin
      summary: Set configuration
      description: |
        Set sound reactive plugin configuration parameters.
        You can choose between 8 or 16 frequency bands to show.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "freqBandLen=8" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/config
        ```
      operationId: setConfiguration
      parameters:
        - in: query
          name: freqBandLen
          schema:
            type: number
            enum: [8, 16]
          required: true
          description: Number of frequency bands to show.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/countdown:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - CountdownPlugin
      summary: Get target date
      description: |
        Get target date and target day description.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/countdown
        ```
      operationId: getTargetDate
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Countdown"
      security:
        - pixelixAuth: []
    post:
      tags:
        - CountdownPlugin
      summary: Set target date
      description: |
        Set target date and target day description. Note, every parameter is optional.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "day=29" -d "month=8" -d "year=2019" -d "descPlural=DAYS" -d "descSingular=DAY" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/countdown
        ```
      operationId: setTargetDate
      parameters:
        - in: query
          name: day
          schema:
            type: number
          required: false
          description: The day of the countdown date.
        - in: query
          name: month
          schema:
            type: number
          required: false
          description: The month of the countdown date.
        - in: query
          name: year
          schema:
            type: number
          required: false
          description: The year of the countdown date.
        - in: query
          name: descPlural
          schema:
            type: string
          required: false
          description: The plural of day.
        - in: query
          name: descSingular
          schema:
            type: string
          required: false
          description: The singular of day.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/dateTime:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - DateTimePlugin
      summary: Get configuration
      description: |
        Get configuration.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/dateTime
        ```
      operationId: getDateTimeCfg
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DateTime"
      security:
        - pixelixAuth: []
    post:
      tags:
        - DateTimePlugin
      summary: Set configuration
      description: |
        Set configuration.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "mode=0" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/dateTime
        ```
      operationId: setDateTimeCfg
      parameters:
        - in: query
          name: mode
          schema:
            type: number
          required: false
          description: "0: Show date and time / 1: Show date only / 2: Show time only"
        - in: query
          name: timeFormat
          schema:
            type: string
          required: false
          description: "Time format according to strftime()."
        - in: query
          name: dateFormat
          schema:
            type: string
          required: false
          description: "Date format according to strftime()."
        - in: query
          name: timeZone
          schema:
            type: string
          required: false
          description: "Timezone"
        - in: query
          name: dayOnColor
          schema:
            type: string
          required: false
          description: "Color of the current day."
        - in: query
          name: dayOffColor
          schema:
            type: string
          required: false
          description: "Color of the other days than the current one."
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/grabConfig:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - GrabViaRestPlugin
      summary: Get configuration
      description: |
        Get grab via REST plugin configuration.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/grabConfig
        ```
      operationId: getGrabConfiguration
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrabConfig"
      security:
        - pixelixAuth: []
    post:
      tags:
        - GrabViaRestPlugin
      summary: Set configuration
      description: |
        Set grab via REST plugin configuration.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "freqBandLen=8" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/grabConfig
        ```
      operationId: setGrabConfiguration
      parameters:
        - in: query
          name: method
          schema:
            type: string
            enum: [GET, POST]
          required: true
          description: The HTTP method.
        - in: query
          name: url
          schema:
            type: string
          description: REST API URL
        - in: query
          name: filter
          schema:
            type: string
          required: true
          description: Filter to identify the value in the JSON response.
        - in: query
          name: iconFileId
          schema:
            type: number
          required: true
          description: The file id of the icon from FileMgrService.
        - in: query
          name: format
          schema:
            type: string
          required: true
          description: Format specifier, e.g. "%s" for strings or "%f" for numbers.
        - in: query
          name: multiplier
          schema:
            type: number
          required: true
          description: Number which is multiplied with a number value. Not used for string values.
        - in: query
          name: offset
          schema:
            type: number
          required: true
          description: Number which is added to a number value. Not used for string values.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/host:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - VolumioPlugin
      summary: Get host address
      description: |
        Get host address of the VOLUMIO server.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/host
        ```
      operationId: getHost
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
      security:
        - pixelixAuth: []
    post:
      tags:
        - VolumioPlugin
      summary: Set host address
      description: |
        Set host address of the VOLUMIO server.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "set=volumio.fritz.box" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/host
        ```
      operationId: setHost
      parameters:
        - in: query
          name: host
          schema:
            type: string
          required: true
          description: The host address of the VOLUMIO server.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/ipAddress:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - GruenbeckPlugin
      summary: Get IP address
      description: |
        Get IP address of the system.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/ipAddress
        ```
      operationId: getIpAddress
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPAddress"
      security:
        - pixelixAuth: []
    post:
      tags:
        - GruenbeckPlugin
      summary: Set IP address
      description: |
        Set IP address of the system.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "ipAddress=192.168.178.10" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/ipAddress
        ```
      operationId: setIpAddress
      parameters:
        - in: query
          name: ipAddress
          schema:
            type: string
          required: true
          description: The IP address of the system.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/github:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - GithubPlugin
      summary: Get github user and repository name
      description: |
        Get github user and repository name.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/github
        ```
      operationId: getUserAndRepositoryName
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Github"
      security:
        - pixelixAuth: []
    post:
      tags:
        - GithubPlugin
      summary: Set github user and repository name
      description: |
        Set github user and repository name.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "user=BlueAndi" -d "repository=Pixelix" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/github
        ```
      operationId: setUserAndRepositoryName
      parameters:
        - in: query
          name: user
          schema:
            type: string
          required: true
          description: The github user name.
        - in: query
          name: repository
          schema:
            type: string
          required: true
          description: The github repository name.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/lamp/{lampId}:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - IconTextLampPlugin
      summary: Get lamp state
      description: |
        Get lamp state.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/lamp/0
        ```
      operationId: getLampState
      parameters:
        - in: path
          name: lampId
          schema:
            type: number
          required: true
          description: The lamp id.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lamp"
      security:
        - pixelixAuth: []
    post:
      tags:
        - IconTextLampPlugin
      summary: Set lamp state
      description: |
        Set lamp state.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "state=on" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/lamp/0
        ```
      operationId: setLampState
      parameters:
        - in: path
          name: lampId
          schema:
            type: number
          required: true
          description: The lamp id.
        - in: query
          name: state
          schema:
            type: string
            enum: [off, on]
          required: true
          description: The lamp state.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/lamps:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - IconTextLampPlugin
      summary: Get lamp states
      description: |
        Get all lamp states.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/lamps
        ```
      operationId: getLampStates
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lamps"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/location:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - SunrisePlugin
      summary: Get location
      description: |
        Get location on earth.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/location
        ```
      operationId: getLocation
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
      security:
        - pixelixAuth: []
    post:
      tags:
        - SunrisePlugin
      summary: Set location
      description: |
        Set location on earth.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "longitude=2.295" -d "latitude=48.858" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/location
        ```
      operationId: setLocation
      parameters:
        - in: query
          name: longitude
          schema:
            type: string
          required: true
          description: The location longitude.
        - in: query
          name: latitude
          schema:
            type: string
          required: true
          description: The location latitude.
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/omweather:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - OpenMeteoPlugin
      summary: Get weather configuration data
      description: |
        Get weather configuration data, necessary for [https://open-meteo.com](https://open-meteo.com).

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/omweather
        ```
      operationId: getOMWeather
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OMWeather"
      security:
        - pixelixAuth: []
    post:
      tags:
        - OpenMeteoPlugin
      summary: Set weather configuration data
      description: |
        Set weather configuration data, necessary for [https://open-meteo.com](https://open-meteo.com).

        Example:
        ```bash
        $ curl -u luke:skywalker -d "latitude=48.858" -d "longitude=2.295" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/omweather
        ```
      operationId: setOMWeather
      parameters:
        - in: query
          name: updatePeriod
          schema:
            type: number
          required: false
          description: The weather update period in s.
        - in: query
          name: latitude
          schema:
            type: string
          required: false
          description: The latitude of the weather location.
        - in: query
          name: longitude
          schema:
            type: string
          required: false
          description: The longitude of the weather location.
        - in: query
          name: temperatureUnit
          schema:
            type: string
            enum: [celisua, fahrenheit]
          required: false
          description: The unit of the temperature.
        - in: query
          name: windSpeedUnit
          schema:
            type: string
            enum: [mph, kmh, ms, kn]
          required: false
          description: The unit of the wind speed.
        - in: query
          name: weatherInfo
          schema:
            type: number
          required: false
          description: "Combine the bits to select what shall be shown: 0x01 - temperature / 0x02 - humidity / 0x04 - wind speed / 0x08 - uv-index"
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
      security:
        - pixelixAuth: []
  /display/uid/{uid}/signalDetector:
    parameters:
      - $ref: "#/components/parameters/uid"
    get:
      tags:
        - SignalDetectorPlugin
      summary: Get location
      description: |
        Get signal detector configuration.

        Example:
        ```bash
        $ curl -u luke:skywalker -X GET http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/signalDetector
        ```
      operationId: getSignalDetector
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalDetector"
      security:
        - pixelixAuth: []
    post:
      tags:
        - SignalDetectorPlugin
      summary: Set location
      description: |
        Set signal detector configuration.

        Example:
        ```bash
        $ curl -u luke:skywalker -d "pushUrl=\"http://notify.me\"" -d "text=\"Detected!\"" -X POST http://pixelix-FFFFFFFF/rest/api/v1/display/uid/0/signalDetector
        ```
      operationId: setSignalDetector
      parameters:
        - in: query
          name: pushUrl
          schema:
            type: string
          required: false
          description: If signal is detected, this URL will be called for notification.
        - in: query
          name: text
          schema:
            type: string
          required: false
          description: If signal is detected, this text will be shown.
        - in: query
          name: tones._0_.frequency
          schema:
            type: number
          required: false
          description: ...
